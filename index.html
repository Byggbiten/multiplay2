<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#c084fc" />
  <meta name="description" content="MULTIPLAY – magisk matteapp för barn" />
  <title>MULTIPLAY ✨</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Typografi: Baloo 2 (rubriker/siffror) + Nunito (brödtext) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Designsystem (se docs/DESIGN-SYSTEM.md) -->
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════
     IKONBIBLIOTEK (inline-SVG, UI-ikoner – aldrig emoji)
     Användning: <svg class="icn"><use href="#i-back"/></svg>
═══════════════════════════════════════════════ -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M5 19v-6M12 19V5.5M19 19v-9"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-switch" viewBox="0 0 24 24"><path d="M7 8h10M14 5l3 3-3 3M17 16H7M10 13l-3 3 3 3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3M4.5 17.5V12H10"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2 4.6 5 .5-3.8 3.4 1.1 4.9L12 14.3 7.7 16.9l1.1-4.9L5 8.6l5-.5z"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M9.5 3.5h5"/></symbol>
</svg>

<!-- Dekorativa bakgrundsstjärnor (innehålls-emoji, pausbara) -->
<div id="bg-stars" aria-hidden="true"></div>

<div class="app-wrapper">

  <!-- ══════════════════════════════════════
       SKÄRM 1: STARTSKÄRM / PROFILER
  ══════════════════════════════════════ -->
  <section id="screen-home" class="screen active" role="main">
    <div class="floaties" aria-hidden="true">
      <span style="top:8%;left:8%">✨</span>
      <span style="top:14%;right:10%;animation-delay:1.5s">🌟</span>
      <span style="bottom:12%;right:7%;animation-delay:2s">✨</span>
    </div>
    <div class="wrap vcenter">
      <div class="logo">MULTIPLAY</div>
      <p class="tagline">Vem ska spela idag?</p>

      <div class="profiles" id="profiles-list">
        <!-- Profilkort renderas hit av App.renderProfiles() -->
      </div>
      <div id="no-profiles-msg" class="empty-note hidden">
        Inga profiler ännu – skapa en! 🌟
      </div>

      <div class="home-actions">
        <button class="btn btn-primary btn-lg btn-block" onclick="App.showCreateProfile()">
          <svg class="icn"><use href="#i-plus"/></svg>
          Skapa ny profil
        </button>
        <button class="btn btn-ghost btn-sm btn-block" onclick="App.showDeleteProfiles()" id="btn-show-delete">
          <svg class="icn"><use href="#i-trash"/></svg>
          Ta bort profiler
        </button>
      </div>

      <button id="update-btn" class="update-link" onclick="checkForUpdate()">
        Sök uppdatering
      </button>
    </div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 2: SKAPA PROFIL
  ══════════════════════════════════════ -->
  <section id="screen-create-profile" class="screen" role="main">
    <div class="floaties" aria-hidden="true">
      <span style="top:6%;right:8%">✨</span>
      <span style="bottom:10%;left:6%;animation-delay:2s">🌟</span>
    </div>
    <div class="wrap">
      <div class="app-header">
        <button class="btn-back" onclick="App.showHome()">Tillbaka</button>
        <span class="header-title">Ny profil</span>
        <span style="width:52px" aria-hidden="true"></span>
      </div>

      <div class="wrap vcenter">
        <div class="card create-form">
          <div class="text-center">
            <h2>Vad heter du? 😊</h2>
            <p class="text-muted text-sm mt-2">Skapa din magiska profil!</p>
          </div>

          <div>
            <label class="form-label" for="profile-name-input">Ditt namn ✏️</label>
            <input
              class="input"
              id="profile-name-input"
              type="text"
              placeholder="Skriv ditt namn här..."
              maxlength="20"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div>
            <label class="form-label">Välj din avatar 🎭</label>
            <div class="avatar-picker" id="avatar-picker">
              <!-- Renderas av JS -->
            </div>
          </div>

          <button class="btn btn-primary btn-lg btn-block" onclick="App.createProfile()" id="btn-create">
            Skapa!
            <svg class="icn"><use href="#i-play"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 3: SPELVÄLJARE
  ══════════════════════════════════════ -->
  <section id="screen-game-select" class="screen" role="main">
    <div class="floaties" aria-hidden="true">
      <span style="top:6%;right:6%">✨</span>
      <span style="bottom:8%;left:4%;animation-delay:2s">🌟</span>
    </div>
    <div class="wrap">
      <div class="me-row">
        <div class="me-chip" id="player-banner">
          <span class="avatar avatar-sm" id="banner-avatar"></span>
          <b id="banner-name"></b>
          <button class="btn-switch" onclick="App.showHome()">
            <svg class="icn"><use href="#i-switch"/></svg>Byt
          </button>
        </div>
        <button class="icon-btn" aria-label="Samlingen – dina capybara-kort" title="Samlingen" onclick="typeof Capy !== 'undefined' && Capy.showCollection()">
          <svg class="icn"><use href="#i-star"/></svg>
        </button>
      </div>

      <h2 class="hello">Hej <em id="hello-name"></em>! Vad vill du träna på? 🌈</h2>

      <!-- Hero-slot: "kom igång" (<2 test) eller Dagens träning
           (js/daily.js). Innehållet renderas av App.renderHero(). -->
      <div class="hero" id="daily-hero"></div>

      <div class="grid-cards">

        <button class="game-card theme-mult" onclick="App.startGame('multiplication')">
          <span class="game-emoji">✖️</span>
          <h3>Gångertabellen</h3>
          <p>Träna 1–12:ans tabeller i din egen takt</p>
          <span class="game-meta" data-game-status="multiplication">Ny! ✨</span>
        </button>

        <button class="game-card theme-clock" onclick="App.startGame('clock')">
          <span class="game-emoji">🕐</span>
          <h3>Klockan</h3>
          <p>Analog, digital och svensk tid</p>
          <span class="game-meta" data-game-status="clock">Ny! ✨</span>
        </button>

        <button class="game-card theme-friends" onclick="App.startGame('friends')">
          <span class="game-emoji">🤝</span>
          <h3>10-Kompisar</h3>
          <p>Talpar som tillsammans blir 10</p>
          <span class="game-meta" data-game-status="friends">Ny! ✨</span>
        </button>

        <button class="game-card theme-np" onclick="App.startGame('nationella')">
          <span class="game-emoji">📝</span>
          <h3>Nationella Prov</h3>
          <p>Träna inför nationella proven i åk 3</p>
          <span class="game-meta" data-game-status="nationella">Ny! ✨</span>
        </button>

        <button class="game-card theme-plus" onclick="App.startGame('addsub')">
          <span class="game-emoji">➕➖</span>
          <h3>Addition &amp; Subtraktion</h3>
          <p>Platsvärde, uppställning &amp; minnessiffra</p>
          <span class="game-meta" data-game-status="addsub">Ny! ✨</span>
        </button>

        <button class="game-card theme-multdiv" onclick="App.startGame('multdiv')">
          <span class="game-emoji" aria-hidden="true" style="color:var(--accent)">
            <svg viewBox="0 0 52 24" style="width:1.9em;height:0.9em;display:inline-block"
              fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
              <path d="M5 5l14 14M19 5L5 19"/>
              <path d="M31 12h16"/>
              <circle cx="39" cy="5" r="2.4" fill="currentColor" stroke="none"/>
              <circle cx="39" cy="19" r="2.4" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <h3>Multiplikation &amp; Division</h3>
          <p>Uppställning &amp; kort division</p>
          <span class="game-meta" data-game-status="multdiv">Ny! ✨</span>
        </button>

      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 4: GÅNGERTABELLEN
  ══════════════════════════════════════ -->
  <section id="screen-multiplication" class="screen screen-multiplication" role="main">
    <div id="mult-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 5: KLOCKAN
  ══════════════════════════════════════ -->
  <section id="screen-clock" class="screen screen-clock" role="main">
    <div id="clock-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 6: 10-KOMPISAR
  ══════════════════════════════════════ -->
  <section id="screen-friends" class="screen screen-friends" role="main">
    <div id="friends-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 7: NATIONELLA PROV – ÄMNESVAL
  ══════════════════════════════════════ -->
  <section id="screen-nationella-select" class="screen" role="main">
    <div id="nationella-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 8: NP MATTE – DELMODUL-VAL
  ══════════════════════════════════════ -->
  <section id="screen-np-matte-select" class="screen" role="main">
    <div id="np-matte-select-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 9: NP MATTE MUNTLIGT – SPELET
  ══════════════════════════════════════ -->
  <section id="screen-np-matte-muntligt" class="screen" role="main">
    <div id="np-matte-muntligt-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 10: NP MATTE SKRIFTLIG – SPELET
  ══════════════════════════════════════ -->
  <section id="screen-np-matte-skriftlig" class="screen" role="main">
    <div id="np-matte-skriftlig-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 11: NP SVENSKA – VÄLJ
  ══════════════════════════════════════ -->
  <section id="screen-np-svenska-select" class="screen" role="main">
    <div id="np-svenska-select-root" style="display:flex;flex-direction:column;height:100%"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 12: NP SVENSKA – PROV
  ══════════════════════════════════════ -->
  <section id="screen-np-svenska-prov" class="screen" role="main">
    <div id="np-svenska-prov-root" style="display:flex;flex-direction:column;height:100%"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 13: NP SVENSKA – SKRIVA / LOGG
  ══════════════════════════════════════ -->
  <section id="screen-np-svenska-skriva" class="screen" role="main">
    <div id="np-svenska-skriva-root" style="display:flex;flex-direction:column;height:100%"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 14: ADDITION & SUBTRAKTION – HUB
  ══════════════════════════════════════ -->
  <section id="screen-addsub" class="screen screen-addsub" role="main">
    <div id="addsub-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 15: UPPSTÄLLNING
  ══════════════════════════════════════ -->
  <section id="screen-uppstallning" class="screen screen-addsub" role="main">
    <div id="uppstallning-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 16: MULTIPLIKATION & DIVISION
  ══════════════════════════════════════ -->
  <section id="screen-multdiv" class="screen screen-multdiv" role="main">
    <div id="multdiv-root"></div>
  </section>

  <!-- ══════════════════════════════════════
       SKÄRM 17: CAPYBARA-SAMLINGEN (js/capy.js)
  ══════════════════════════════════════ -->
  <section id="screen-collection" class="screen" role="main">
    <div id="capy-root"></div>
  </section>

</div><!-- /app-wrapper -->

<!-- ══════════════════════════════════════
     MODAL: TA BORT PROFIL
══════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modal-delete-profiles">
  <div class="modal">
    <div class="modal-title">Ta bort profil</div>
    <p class="text-center text-sm text-muted" style="margin-bottom:var(--space-2);">
      All statistik raderas permanent!
    </p>
    <div class="profile-delete-list" id="delete-profiles-list"></div>
    <button class="btn btn-ghost btn-block" onclick="App.hideDeleteProfiles()">Stäng</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL: BEKRÄFTA TA BORT
══════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modal-confirm-delete">
  <div class="modal">
    <div class="modal-title">⚠️ Är du säker?</div>
    <p class="text-center text-sm text-muted" style="margin-bottom:var(--space-6);" id="confirm-delete-msg"></p>
    <div style="display:flex;gap:var(--space-3);">
      <button class="btn btn-ghost w-full" onclick="App.hideConfirmDelete()">Avbryt</button>
      <button class="btn btn-danger w-full" id="btn-confirm-delete-yes">Ta bort</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     KONFETTI-CONTAINER
══════════════════════════════════════ -->
<div class="confetti-container" id="confetti-container" aria-hidden="true"></div>

<!-- ══════════════════════════════════════
     SCRIPTS (shared.js FÖRST, ordningen är kontrakt)
══════════════════════════════════════ -->
<script src="js/shared.js"></script>
<script src="js/app.js"></script>
<script src="js/daily.js"></script>
<script src="js/capy.js"></script>
<script src="js/multiplication.js"></script>
<script src="js/clock.js"></script>
<script src="js/tenfriends.js"></script>
<script src="js/np-matte-muntligt.js"></script>
<script src="js/np-matte-skriftlig.js"></script>
<script src="js/np-svenska-texts.js"></script>
<script src="js/np-svenska.js"></script>
<script src="js/nationella.js"></script>
<script src="js/platsvarde.js"></script>
<script src="js/uppstallning.js"></script>
<script src="js/multdiv.js"></script>

</body>
</html>
