<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Övningsblad plan 3 – mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Mockup för plan 3 (D47, brainstorm/16), byggd av VD:n själv. Steg 1: hubben, kort division med tvåsiffrig
   nämnare och trappan. Stil C (D44 ✎): platsvärdesfärger, lila = härifrån, orange = hit, ingen felsignal (D39). */
:root{--ink:#3b1d6e;--soft:#6d5a96;--acc:#0f766e;--deep:#4c1d95;--lila:#7c3aed;--org:#fb923c;--peach:#fff1e6;
  --pvTu:#7c3aed;--pvH:#dc2626;--pvT:#2563eb;--pvE:#16a34a;
  --bg:linear-gradient(160deg,#fdf4ff 0%,#fce7f3 34%,#eff6ff 68%,#f0fdf4 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,sans-serif;font-weight:700;color:var(--ink);background:#ece7f5;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;height:auto;min-height:100%}
.lab{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:390px;font:800 12px Nunito}
.lab button{border:0;border-radius:10px;padding:6px 10px;background:#fff;color:var(--deep);font:800 12px Nunito;cursor:pointer}
.lab button.on{background:var(--deep);color:#fff}
.app{flex:none;width:390px;height:797px;background:var(--bg);border-radius:28px;box-shadow:0 10px 40px rgba(76,29,149,.18);display:flex;flex-direction:column;padding:10px 12px 12px;gap:6px;overflow:hidden;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.back{display:flex;align-items:center;gap:4px;border:0;border-radius:22px;background:rgba(255,255,255,.85);padding:0 14px;height:40px;font:800 14px Nunito;color:var(--deep);cursor:pointer}
.back svg{width:16px;height:16px}
.ttl{font:800 20px 'Baloo 2';color:#134e4a}
.prog{min-width:70px;text-align:right;font:800 13px Nunito;color:var(--soft);background:rgba(255,255,255,.85);border-radius:22px;padding:10px 14px}
.card{flex:none;background:rgba(255,255,255,.72);border-radius:24px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;position:relative}
.top,.pad,.seg,.tiles,.sec{flex:none}
.ask{font:900 15.5px/1.28 Nunito;color:#134e4a;min-height:40px}
.ask .ok{display:block;font:800 13px Nunito;color:#15803d}
.ask .soft{display:block;font:800 13px Nunito;color:#b45309}
.head{font:800 19px 'Baloo 2';letter-spacing:.02em}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pad button{height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.95);font:800 22px 'Baloo 2';color:var(--deep);cursor:pointer;box-shadow:0 2px 6px rgba(93,63,158,.1)}
.pad .wide{grid-column:span 4;background:#e6f4f1;color:#134e4a;font:900 17px Nunito;border:2px solid #99d5c9}
.pad .wide.go{background:var(--acc);color:#fff;border-color:var(--acc)}
.pad .er svg{width:22px;height:22px}
.pad .wide svg{width:20px;height:20px;vertical-align:-3px}
.kladd{flex:1;min-height:100px;background:rgba(255,255,255,.6);border-radius:20px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.kladd .kt{display:flex;justify-content:space-between;align-items:center;font:900 12px Nunito;color:#134e4a;letter-spacing:.05em}
.kladd .kt span{display:flex;gap:6px}
.kladd .kt i{width:34px;height:30px;border-radius:9px;border:2px solid #cfe9e3;display:inline-block;background:#fff}
.kladd .kt i:first-child{background:#3b8f82;border-color:#3b8f82}
.kladd .area{flex:1;border:2px dashed #bfe0d9;border-radius:14px}
/* platsvärdesfärger */
.Tu{color:var(--pvTu)}.H{color:var(--pvH)}.T{color:var(--pvT)}.E{color:var(--pvE)}
/* ── hubben ── */
.seg{display:flex;background:rgba(255,255,255,.72);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;font:800 14px Nunito;color:var(--soft);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.sec{font:900 12px Nunito;letter-spacing:.08em;color:var(--soft);margin:6px 4px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;min-height:58px;border:0;border-radius:16px;background:rgba(255,255,255,.9);padding:8px 10px;text-align:left;font:800 14.5px/1.15 Nunito;color:var(--deep);cursor:pointer;box-shadow:0 2px 8px rgba(93,63,158,.08)}
.tile b{flex:0 0 30px;height:30px;border-radius:10px;background:#3b8f82;color:#fff;display:flex;align-items:center;justify-content:center;font:800 15px 'Baloo 2'}
.tile small{display:block;font:700 11.5px Nunito;color:var(--soft);margin-top:2px}
.tile.later{opacity:.55;cursor:default}
.tile.new{box-shadow:0 0 0 2px #a78bfa,0 2px 8px rgba(93,63,158,.08)}
/* ── kort division ── */
.kd{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:4px}
.fr{display:flex;flex-direction:column;align-items:stretch}
.numrow{display:flex;align-items:flex-end;gap:9px;padding:0 2px 0 10px;border-bottom:3.5px solid var(--deep)}
.dg{position:relative;width:30px;height:52px;display:flex;align-items:flex-end;justify-content:center;font:800 36px/1 'Baloo 2';border-radius:10px;transition:background .25s,box-shadow .25s}
.dg .cap{position:absolute;top:-2px;left:0;right:0;text-align:center;font:900 10px Nunito}
.dg.grp{background:#fff7ed;box-shadow:0 0 0 2.5px var(--org)}
.dg.dim{opacity:.35}
.rs{position:absolute;left:-21px;top:12px;min-width:24px;height:20px;padding:0 3px;border-radius:7px;font:800 15px/20px 'Baloo 2';color:var(--lila);text-align:center}
.rs.slot{border:2px dashed #c4b5fd;background:#fff}
.den{display:flex;justify-content:center;font:800 32px 'Baloo 2';color:var(--deep);padding-top:2px}
.den span{background:#f3e8ff;border-radius:10px;padding:0 10px}
.eqs{font:800 34px 'Baloo 2';color:var(--deep);padding-bottom:18px}
.qbox{display:flex;align-items:flex-end;gap:4px;padding-bottom:12px}
.box{position:relative;width:36px;height:48px;border-radius:12px;border:3px dashed #a7d8cf;background:#fff;display:flex;align-items:center;justify-content:center;font:800 30px 'Baloo 2'}
.box .cap{position:absolute;top:-17px;left:0;right:0;text-align:center;font:900 10px Nunito}
.box.focus{border-style:solid;border-color:#0f766e;box-shadow:0 0 0 3px var(--org)}
.box.done{border-style:solid;border-color:#86efac;background:#f0fdf4}
.box.rest{border-color:#c4b5fd;color:var(--lila)}
.comma{font:800 26px 'Baloo 2';color:var(--deep);padding-bottom:6px}
.restlab{font:900 12px Nunito;color:var(--lila);align-self:center;margin-bottom:-14px}
/* tankeraden: nämnarens tabell */
.think{background:#faf5ff;border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-height:92px}
.think .tt{font:900 12px Nunito;color:var(--lila);letter-spacing:.04em}
.row{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border-radius:10px;font:800 21px 'Baloo 2';color:var(--deep);background:#fff;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s,background .25s,box-shadow .25s;cursor:pointer;position:relative}
.row.in{opacity:1;transform:none}
.row .cmp{margin-left:auto;font:800 13px Nunito;color:var(--soft)}
.row.over{color:#a8a29e}
.row.over::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2.5px;background:#a8a29e;transform:scaleX(0);transform-origin:left;transition:transform .45s}
.row.over.struck::after{transform:scaleX(1)}
.row.pick{box-shadow:0 0 0 2.5px var(--lila);background:#f5f3ff}
.row.nope{background:var(--peach)}
.sub{display:flex;align-items:center;justify-content:center;gap:8px;font:800 22px 'Baloo 2';color:var(--deep);min-height:40px}
.sub .box{width:auto;min-width:56px;height:44px;padding:0 6px}
/* knappar i kortet */
.next{align-self:center;border:0;border-radius:16px;background:var(--acc);color:#fff;font:900 16px Nunito;min-height:46px;padding:0 22px;cursor:pointer;display:flex;align-items:center;gap:8px}
.next svg{width:18px;height:18px}
.ghost{align-self:center;border:2px solid #c4b5fd;border-radius:14px;background:#fff;color:var(--lila);font:900 14px Nunito;min-height:44px;padding:0 16px;cursor:pointer}
/* flygning */
.fly{position:fixed;z-index:50;pointer-events:none;font:800 30px 'Baloo 2';color:var(--lila);transition:transform .7s cubic-bezier(.34,1.2,.4,1)}
/* ── trappan ── */
.trap{display:grid;grid-template-columns:repeat(7,30px);grid-auto-rows:32px;justify-content:center;margin-top:2px}
.c{display:flex;align-items:center;justify-content:center;font:800 24px 'Baloo 2';color:var(--deep);position:relative}
.c.bt{border-top:3px solid var(--deep)}
.c.Tu{color:var(--pvTu)}.c.H{color:var(--pvH)}.c.T{color:var(--pvT)}.c.E{color:var(--pvE)}
.c.bl{border-left:3px solid var(--deep)}
.c.ul{border-bottom:2.5px solid #94a3b8}
.c.minus{color:var(--soft);font-size:20px}
.c.lit{background:#fff7ed;border-radius:8px;box-shadow:0 0 0 2.5px var(--org)}
.c.src{background:#f5f3ff;border-radius:8px;box-shadow:0 0 0 2.5px var(--lila)}
.c.ghostc{color:transparent}
.c.drop{animation:drop .7s cubic-bezier(.34,1.2,.4,1)}
@keyframes drop{from{transform:translateY(-64px)}to{transform:none}}
.c.appear{animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mirror{display:flex;gap:10px;align-items:stretch;justify-content:center}
.mirror .mini{background:#fff;border-radius:14px;padding:6px 10px;font:800 22px 'Baloo 2';color:var(--deep);display:flex;flex-direction:column;align-items:center;gap:2px}
.mirror .mini small{font:900 11px Nunito;color:var(--soft)}
.hl{background:#f5f3ff;border-radius:6px;box-shadow:0 0 0 2px var(--lila);color:var(--lila);padding:0 2px}
.why{display:none;background:#f5f3ff;border-radius:14px;padding:6px 10px;font:800 13px/1.45 Nunito;color:var(--deep)}
.why.on{display:block}
.why>b{color:var(--lila);margin-right:2px}
.mn{display:inline-block;vertical-align:-1px;margin:0 1px}
.mn.note{width:17px;height:10px;border-radius:2px}
.mn.coin{width:11px;height:11px;border-radius:50%}
.mn.Tu{background:#a78bfa}.mn.H{background:#f87171}.mn.T{background:#60a5fa}.mn.E{background:#4ade80}
.mx{font:800 12px Nunito;color:var(--soft);margin-left:3px}
.dg.struck::before{content:"";position:absolute;left:3px;right:3px;top:60%;height:3px;background:#94a3b8;transform:rotate(-55deg);border-radius:2px}
.dg.struck{opacity:.55}
.rs.struck{opacity:.5;text-decoration:line-through}
.box.ans{border-color:#22c55e;box-shadow:0 0 0 3px #bbf7d0,0 0 18px rgba(34,197,94,.45);transform:scale(1.07);transition:transform .4s,box-shadow .4s}
.box.rest.ans{border-color:#7c3aed;box-shadow:0 0 0 3px #ddd6fe,0 0 18px rgba(124,58,237,.4)}
.c.ans{background:#f0fdf4;border-radius:8px;box-shadow:0 0 0 2.5px #22c55e}
.c.restans{background:#f5f3ff;border-radius:8px;box-shadow:0 0 0 2.5px #7c3aed}
.c.pair,.sm.pair{background:#fff7ed;border-radius:7px;box-shadow:0 0 0 2.5px var(--org);transition:box-shadow .3s}
.answer{display:flex;align-items:baseline;justify-content:center;gap:6px;font:800 22px 'Baloo 2';color:var(--deep);background:#fff;border-radius:16px;padding:6px 14px;box-shadow:0 2px 10px rgba(93,63,158,.12)}
.answer .aq{font-size:30px;color:#15803d}.answer .ar{font-size:30px;color:var(--lila)}
.mini .sm{font-size:14px;color:var(--lila);padding:0 2px}
.story{font:800 16px/1.45 Nunito;color:var(--deep);background:#fff;border-radius:16px;padding:10px 12px}
.tok{display:inline-block;padding:0 6px;border-radius:8px;background:#f3e8ff;font-family:'Baloo 2';font-size:18px;transition:box-shadow .3s}
.tok.litok{box-shadow:0 0 0 2.5px var(--lila)}
.bar{display:flex;flex-direction:column;gap:3px}
.barlab{text-align:center;font:800 15px 'Baloo 2';color:var(--lila)}
.barrow{display:flex;gap:4px;height:40px}
.barrow .seg1{flex:1;border-radius:10px;background:#ede9fe;border:2.5px solid #a78bfa}
.barrow .part{flex:1;border-radius:10px;background:#f5f3ff;border:2.5px dashed #a78bfa;display:flex;align-items:center;justify-content:center;font:800 15px 'Baloo 2';color:var(--soft);animation:fade .5s}
.barrow .part.filled{background:#f0fdf4;border:2.5px solid #86efac;color:#15803d}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.opt{min-height:46px;min-width:110px;border:2.5px solid #ddd6fe;border-radius:14px;background:#fff;font:800 20px 'Baloo 2';color:var(--deep);cursor:pointer;padding:0 12px}
.opt.bank{min-width:80px;font-size:17px}
.opt.nope{background:var(--peach);border-color:#fdba74}
.opt.okopt{border-color:#22c55e;background:#f0fdf4;color:#15803d}
.opt.ring{box-shadow:0 0 0 3px #bbf7d0,0 0 14px rgba(34,197,94,.45);border-radius:50px}
.kbar{display:flex;flex-direction:column;gap:4px}
.kbar .barrow .part.first{border-color:var(--org);background:#fff7ed}
.kbar .barrow.sub2{height:34px}
.kbar .barrow.sub2 .part.small{flex:none;width:calc(var(--w) / 2 - 2px);font-size:16px}
.kbar .barrow.sub2 .part.last{border:2.5px solid var(--lila);background:#f5f3ff;color:var(--lila)}
.kbar .spacer{visibility:hidden}
.ansbig{display:inline-block;font:800 26px 'Baloo 2';color:#15803d;background:#f0fdf4;border-radius:12px;padding:0 12px;box-shadow:0 0 0 3px #bbf7d0,0 0 16px rgba(34,197,94,.4)}
.kbar .barrow .part.filled{border:2.5px solid #86efac;background:#f0fdf4;color:#15803d}
.venn{width:100%;height:auto;background:#fff;border-radius:16px}
.venn .sh{fill:none;stroke:#94a3b8;stroke-width:2.5}
.venn .both{fill:#a78bfa;opacity:0;transition:opacity .6s}
.venn .both.on{opacity:.28}
.venn .vn circle{fill:#fff;stroke:#c4b5fd;stroke-width:2}
.venn .vn text{text-anchor:middle;font:800 17px 'Baloo 2';fill:var(--deep)}
.venn .vn{cursor:pointer;transition:opacity .4s}
.venn .vn.out{opacity:.18}
.venn .vn.nope circle{fill:var(--peach);stroke:#fdba74}
.venn .vn.win circle{fill:#f0fdf4;stroke:#22c55e;stroke-width:3}
.dzrow{display:flex;align-items:center;justify-content:center;gap:8px;font:800 30px 'Baloo 2';color:var(--deep);background:#fff;border-radius:16px;padding:6px 10px;position:relative}
.dzrow small{position:absolute;left:10px;top:4px;font:900 10px Nunito;color:var(--soft);letter-spacing:.05em}
.dzrow.orig{padding-top:16px}
.dzrow.flip{padding-top:16px;background:#faf5ff}
.dzn{min-width:30px;text-align:center}
.dzq{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:12px;border:3px dashed var(--org);color:var(--org)}
.dzn.ansq{color:#15803d;background:#f0fdf4;border-radius:12px;padding:0 8px;box-shadow:0 0 0 3px #bbf7d0,0 0 16px rgba(34,197,94,.4)}
.dzrow .box{width:auto;min-width:76px;padding:0 6px}
.carry{font:800 20px 'Baloo 2';color:var(--deep);background:#f0fdf4;border-radius:14px;padding:6px 14px;box-shadow:0 0 0 2px #bbf7d0}
.carry b{color:#15803d}
.dzrow.two{flex-direction:column;gap:4px;font-size:26px}
.dzrow.two>div{display:flex;align-items:center;gap:8px}
.dzrow.two .dzq{min-width:44px;height:40px}
.note{font:800 12.5px/1.35 Nunito;color:var(--soft);text-align:center}
</style>
</head>
<body>
<div class="lab" id="lab">
  <button data-go="hub">Hubben</button>
  <button data-go="kd">Kort division</button>
  <button data-go="trap">Trappan</button>
  <button data-go="prob">Problemlösning</button>
  <button data-go="klur">Kluringar</button>
  <button data-go="venn">Vilket tal?</button>
  <button data-go="dz">10/100/1000</button>
  <button data-go="restart">Börja om vyn</button>
</div>
<div class="app" id="app"></div>
<p class="note" style="max-width:390px">Mockup för plan 3: hubben, kort division och trappan (5736 / 7), problemlösning, kluringar, Vilket tal? och 10/100/1000. Dela och gruppera och Divisionstabellen är som i appen idag.</p>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const W = ms => new Promise(r => setTimeout(r, ms));
const PACE = 900; /* barnets takt: en förflyttning åt gången (Dennis: "för fort och osynkat") */
const ic = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  erase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M8 5h12v14H8l-6-7z"/><path d="M11 9l6 6M17 9l-6 6" stroke-linecap="round"/></svg>'
};
let view = 'hub';

/* ── gemensamt: knappsats och kladd (övningsbladens, D48) ── */
let padHandler = null, typed = '';
function padHTML(label = 'Svara') {
  const k = [1,2,3,4,5,6,7,8,9,0].map(n => `<button data-k="${n}">${n}</button>`).join('');
  return `<div class="pad" id="pad">${k}<button class="er" data-k="e" aria-label="Sudda">${ic.erase}</button><button class="wide" data-k="ok">${ic.check} ${label}</button></div>`;
}
function kladdHTML() { return `<div class="kladd"><div class="kt">KLADD<span><i></i><i></i><i></i><i></i></span></div><div class="area"></div></div>`; }
app.addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b || !padHandler) return;
  const k = b.dataset.k;
  if (k === 'e') typed = typed.slice(0, -1);
  else if (k === 'ok') { padHandler(typed); return; }
  else if (typed.length < 5) typed += k;
  const f = $('.box.focus'); if (f) f.textContent = typed;
  const ok = $('#pad .wide'); if (ok) ok.classList.toggle('go', typed.length > 0);
});

/* Flyg ett känt tal från ett element till ett annat (bandet/flygningen flyttar bara kända tal).
   Ordningen är alltid: pilen ritas (barnet ser vart), en paus, sedan glider talet längs pilen. Dennis: "animationer där
   siffror flyttas i förklarande steg eller pilar … är superbra", men inte för snabbt. */
const ov = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
ov.setAttribute('style', 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40;overflow:visible');
ov.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker></defs>';
document.body.appendChild(ov);
function arrow(a, b) {
  const x1 = a.left + a.width / 2, y1 = a.top + a.height / 2, x2 = b.left + b.width / 2, y2 = b.top + b.height / 2;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const p1 = Math.min(a.width, a.height) / 2 + 4, p2 = Math.min(b.width, b.height) / 2 + 6;   /* utanför rutorna */
  const sx = x1 + dx / len * p1, sy = y1 + dy / len * p1, ex = x2 - dx / len * p2, ey = y2 - dy / len * p2;
  let nx = -dy / len, ny = dx / len; if (ny > 0) { nx = -nx; ny = -ny; }   /* böj alltid uppåt, bort från raden under */
  const bend = Math.min(36, len / 4), mx = (sx + ex) / 2 + nx * bend, my = (sy + ey) / 2 + ny * bend;
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', `M${sx} ${sy} Q${mx} ${my} ${ex} ${ey}`);
  p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#7c3aed'); p.setAttribute('stroke-width', '3');
  p.setAttribute('stroke-dasharray', '6 6'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('marker-end', 'url(#ah)');

}
async function fly(from, to, text) {
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  const ar = arrow(a, b);
  await W(PACE);                                            /* först pilen: vart ska talet? */
  const f = document.createElement('div'); f.className = 'fly'; f.textContent = text; f.style.transition = 'none';
  document.body.appendChild(f);
  const fw = f.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2, bx = b.left + b.width / 2, by = b.top + b.height / 2;
  f.style.left = (ax - fw.width / 2) + 'px'; f.style.top = (ay - fw.height / 2) + 'px';
  const t0 = performance.now(), dur = PACE * 1.3;
  await new Promise(res => {
    const step = now => {
      let t = Math.min(1, (now - t0) / dur); t = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const x = (1 - t) * (1 - t) * ax + 2 * (1 - t) * t * ar.mx + t * t * bx, y = (1 - t) * (1 - t) * ay + 2 * (1 - t) * t * ar.my + t * t * by;
      f.style.transform = `translate(${x - ax}px,${y - ay}px)`;
      if (t < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
  f.remove(); await W(250); ar.p.remove();
}

/* Stegen räknas fram ur talet, så att samma motor bär alla tal */
function plan(n, d) {
  const ds = [...n].map(Number); let i = 0, cur = ds[0];
  while (cur < d && i < ds.length - 1) { i++; cur = cur * 10 + ds[i]; }
  const steps = [];
  for (; i < ds.length; i++) {
    const q = Math.floor(cur / d), r = cur - q * d;
    steps.push({ i, cur, q, p: q * d, r, last: i === ds.length - 1 });
    if (i < ds.length - 1) cur = r * 10 + ds[i + 1];
  }
  return { ds, start: steps[0].i, steps, quot: steps.map(s => s.q).join(''), rest: steps[steps.length - 1].r };
}

/* ── Varför? Pengar gör talsorterna konkreta: tusenlappar, hundralappar, tior och kronor, i platsvärdets färger.

const MONEY = [

}
const giveWhy = s => `Varje person får ${nm(s.q, s.i)}. Därför står ${s.q} i ${PLACE[s.i]}et.`;

const restWhy = s => s.r === 0 ? `Allt gick jämnt ut – inget blir kvar av ${MONEY[s.i].many}.` : s.last ? `${nm(s.r, s.i)} ${icons(s.r, s.i)} blir kvar. ${s.r === 0 ? 'Allt gick jämnt ut.' : 'De räcker inte till alla, så det är resten.'}`
  : `${nm(s.r, s.i)} ${icons(s.r, s.i)} räcker inte till alla ${D}. Den ska inte slängas – den växlas.`;
const swapWhy = s => { const nx = P.ds[s.i + 1];
  return `${nm(s.r, s.i)} ${icons(s.r, s.i)} växlas till ${s.r * 10} ${MONEY[s.i + 1].many} ${icons(s.r * 10, s.i + 1)}.

            $('#sm' + (x.i + 1)).classList.add('pair');
            ask(`Efter ${PLACE[x.i]}en blev <b>${x.r}</b> över. I kort division är det den lilla ${x.r}:an framför ${nx}:an.`);
            why(`${nm(x.r, x.i)} ${icons(x.r, x.i)} växlas till ${x.r * 10} ${MONEY[x.i + 1].many}. Trappan skriver ut det, kort division skriver bara den lilla siffran.`);
            await waitNext(k + 1 < P.steps.length - 1 ? 'Nästa växling' : 'Och sist?');
          } else {
            $('#smR').classList.add('pair');
            ask(`Sist blev <b>${x.r}</b> över. Det finns inget mer att växla till, så det är resten – i båda.`);
            why(`Varje växling i trappan är en liten siffra i kort division, och det som blir över sist är resten.`);
            act(`<button class="ghost">Räkna samma tal i kort division</button>`, () => go('kd'));
          }
        }
      };
    }
  }
}

/* ── Problemlösning (31, 32a, 34b): berättelse → stapelmodellen → välj uträkning → räkna i kort division → svarsbanken ── */
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);   /* platsen lottas (D17) */
let PROB = null;
function probView(back) {
  view = 'prob'; typed = ''; padHandler = null;
  const n = 2856, d = 4, q = n / d;
  PROB = { n, d, q };
  app.innerHTML = kdShell('Problemlösning') + `
  <div class="card">
    <div class="story" id="story">Stafettbanan är <b class="tok" id="tN">${n}</b> meter. Den delas i <b class="tok" id="tD">${d}</b> lika långa sträckor. Hur lång är en sträcka?</div>
    <div class="why" id="why"></div>
    <div class="bar" id="bar"><div class="barlab" id="barlab">${n} m</div><div class="barrow" id="barrow"><div class="seg1"></div></div></div>
    <div class="ask" id="ask"></div>
    <div class="opts" id="opts"></div>
    <div class="sub" id="sub"></div>
    <div id="act" style="display:flex;justify-content:center;min-height:46px"></div>
  </div>` + padHTML() + kladdHTML();
  $('[data-hub]').onclick = hub;
  if (back) return probEnd();
  probRun();
}
async function probRun() {
  const { n, d } = PROB;
  ask('Läs berättelsen. Vad ska delas, och i hur många delar?');
  await waitNext('Rita stapeln');
  /* stapelmodellen: hela sträckan som en stapel, delad i d lika delar */
  why(`Hela sträckan är en stapel. Den ska delas i ${d} lika långa delar, så stapeln delas i ${d}.`);
  $('#tN').classList.add('litok');
  await W(PACE);
  $('#barrow').innerHTML = Array.from({ length: d }, () => '<div class="part"><span>?</span></div>').join('');
  $('#tD').classList.add('litok');
  await W(PACE);
  ask('Vilken uträkning ger längden på en sträcka? Tryck på den.');
  const right = `${n} / ${d}`;
  const opts = shuffle([right, `${n} · ${d}`, `${n} − ${d}`, `${n} + ${d}`]);
  $('#opts').innerHTML = opts.map(o => `<button class="opt" data-o="${o}">${o}</button>`).join('');
  await new Promise(res => $('#opts').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (b.dataset.o === right) { b.classList.add('okopt'); $('#opts').querySelectorAll('.opt').forEach(x => x.onclick = null); res(); }
    else { b.classList.add('nope'); setTimeout(() => b.classList.remove('nope'), 900);
      const o = b.dataset.o;
      ask(`<span class="soft">Inte riktigt – försök igen.</span>${o.includes('·') ? 'Gånger gör sträckan längre. Vi ska dela den.' : o.includes('−') ? `Minus tar bort ${d} meter. Vi ska dela i ${d} delar.` : `Plus gör sträckan längre. Vi ska dela den.`}`); }
  }));
  ask(`<span class="ok">Rätt!</span>${right}: sträckan delas i ${d} lika delar.`);
  why(`Lika långa delar betyder division. Stapelns ${d} delar är svaret på ${right}.`);
  await waitNext('Räkna i kort division');
  /* räkna i kort division med hjälp, sedan tillbaka hit */
  setTask(String(n), d);
  kdView({ title: 'Problemlösning', onDone: () => probView(true) });
}
async function probEnd() {
  const { n, d, q } = PROB;
  $('#barrow').innerHTML = Array.from({ length: d }, () => '<div class="part"><span>?</span></div>').join('');
  /* uträkningen följer med tillbaka, så att man inte behöver räkna om (Dennis 12/11) */
  $('#opts').innerHTML = `<div class="carry">Din uträkning: ${n} / ${d} = <b id="carryQ">${q}</b></div>`;
  ask('Svara nu på frågan i berättelsen: hur lång är en sträcka?');
  why('Kvoten är längden på en av de lika långa delarna.');
  $('#sub').innerHTML = `En sträcka är <div class="box" id="sb"></div> meter.`;
  await typeAnswer($('#sb'), q, 'Hur lång är en sträcka? Titta på din uträkning.');
  /* förståelseprovet: svaret fyller stapelns delar */
  ask(`<span class="ok">Klart!</span>En sträcka är <b>${q} meter</b>.`);
  const parts = [...$('#barrow').querySelectorAll('.part')];
  await fly($('#carryQ'), parts[0], String(q));
  for (const p of parts) { p.innerHTML = `<span>${q} m</span>`; p.classList.add('filled'); await W(PACE / 3); }
  why(`${d} sträckor om ${q} m blir hela banan: ${d} · ${q} = ${n}.`);
  act(`<button class="ghost">Till hubben</button>`, hub);
}

/* ── Kluringar (32b) som "vänd på det" (Dennis 12/11): frågan uppställd som två divisioner, baklänges som gångertal ── */
function klurView() {
  view = 'klur'; typed = ''; padHandler = null;
  const a = 3, b = 2, k = 4, mid = k * b, tot = mid * a;   /* tänkta talet 24: 24 / 3 = 8, 8 / 2 = 4 */
  const qb = id => `<span class="dzq" id="${id}">?</span>`;
  app.innerHTML = kdShell('Kluringar') + `
  <div class="card">
    <div class="story">Vilket tal tänker jag på? Först delar jag det med <b class="tok">${a}</b>. Sedan delar jag svaret med <b class="tok">${b}</b>. Då får jag <b class="tok">${k}</b>.</div>
    <div class="dzrow orig two"><small>FRÅGAN</small>
      <div>${qb('kT')} / <span class="dzn" id="kA">${a}</span> = ${qb('kM1')}</div>
      <div>${qb('kM2')} / <span class="dzn" id="kB">${b}</span> = <span class="dzn" id="kK">${k}</span></div></div>
    <div class="why" id="why"></div>
    <div class="dzrow flip two" id="flip" style="visibility:hidden"><small>VÄND PÅ DET</small>
      <div id="fr1"><span class="dzn" id="f1x"></span> · <span class="dzn" id="f1y"></span> = <div class="box" id="f1z"></div></div>
      <div id="fr2" style="visibility:hidden"><span class="dzn" id="f2x"></span> · <span class="dzn" id="f2y"></span> = <div class="box" id="f2z"></div></div></div>
    <div class="ask" id="ask"></div>
    <div id="act" style="display:flex;justify-content:center;min-height:46px"></div>
  </div>` + padHTML() + kladdHTML();
  $('[data-hub]').onclick = hub;
  klurRun(a, b, k, mid, tot);
}
async function klurRun(a, b, k, mid, tot) {
  ask('Skriv det som två divisioner. Rutan i mitten är svaret efter första delningen.');
  why('Vi vet bara slutet: 4. Därför börjar vi bakifrån.');
  await waitNext('Vänd på det');
  $('#flip').style.visibility = 'visible';
  why(`Om något delat med ${b} blir ${k}, så är något ${b} gånger ${k}. Division baklänges är gånger.`);
  await fly($('#kK'), $('#f1x'), String(k)); $('#f1x').textContent = k;
  await fly($('#kB'), $('#f1y'), String(b)); $('#f1y').textContent = b;
  let q = `Räkna ${k} · ${b}.`; ask(q);
  await typeAnswer($('#f1z'), mid, q);
  ask(`<span class="ok">Rätt!</span>Svaret efter första delningen är <b>${mid}</b>.`);
  await fly($('#f1z'), $('#kM2'), String(mid)); $('#kM2').textContent = mid; $('#kM2').className = 'dzn';
  await fly($('#f1z'), $('#kM1'), String(mid)); $('#kM1').textContent = mid; $('#kM1').className = 'dzn';
  await waitNext('Och talet?');
  $('#fr2').style.visibility = 'visible';
  why(`Om talet delat med ${a} blir ${mid}, så är talet ${a} gånger ${mid}.`);
  await fly($('#kM1'), $('#f2x'), String(mid)); $('#f2x').textContent = mid;
  await fly($('#kA'), $('#f2y'), String(a)); $('#f2y').textContent = a;
  q = `Räkna ${mid} · ${a}.`; ask(q);
  await typeAnswer($('#f2z'), tot, q);
  await fly($('#f2z'), $('#kT'), String(tot)); $('#kT').textContent = tot; $('#kT').className = 'dzn ansq';
  ask(`<span class="ok">Klart!</span>Talet är <b>${tot}</b>.`);
  why(`Kontroll framåt: ${tot} / ${a} = ${mid}, och ${mid} / ${b} = ${k}. Det stämmer.`);
  act(`<button class="ghost">Till hubben</button>`, hub);
}

/* ── Vilket tal? (26b): Venndiagram, med hjälp tonas tal bort ledtråd för ledtråd (uteslutning) ── */
const VN = [ [34,62,58],[21,70,152],[12,148,82],[15,160,146],[18,126,118],[20,236,58],[8,244,150],[35,306,28],[16,300,196],[27,46,208] ];
const inSq = (x, y) => x > 40 && x < 190 && y > 30 && y < 180;
const inCi = (x, y) => Math.hypot(x - 185, y - 110) < 78;
function vennView() {
  view = 'venn'; typed = ''; padHandler = null;
  app.innerHTML = kdShell('Vilket tal?') + `
  <div class="card">
    <div class="story" id="clue">Talet är inuti <b class="tok" id="c1">både cirkeln och kvadraten</b>. Det kan delas <b class="tok" id="c2">jämnt med 4</b>.</div>
    <div class="why" id="why"></div>
    <svg class="venn" viewBox="0 0 340 230" id="venn">
      <defs><clipPath id="sqc"><rect x="40" y="30" width="150" height="150"/></clipPath></defs>
      <rect x="40" y="30" width="150" height="150" class="sh" id="shS"/>
      <circle cx="185" cy="110" r="78" class="sh" id="shC"/>
      <polygon points="215,205 335,120 335,222" class="sh" id="shT"/>
      <circle cx="185" cy="110" r="78" clip-path="url(#sqc)" class="both" id="both"/>
      ${VN.map(([n, x, y]) => `<g class="vn" data-n="${n}" transform="translate(${x},${y})"><circle r="16"/><text dy="6">${n}</text></g>`).join('')}
    </svg>
    <div class="ask" id="ask"></div>
    <div id="act" style="display:flex;justify-content:center;min-height:46px"></div>
  </div>` + kladdHTML();
  $('[data-hub]').onclick = hub;
  vennRun();
}
async function vennRun() {
  const gs = [...document.querySelectorAll('.vn')];
  const pos = g => VN.find(v => v[0] === +g.dataset.n);
  ask('Läs ledtrådarna en i taget. Vi stryker de tal som inte passar.');
  why('Varje ledtråd tar bort tal. Till slut finns bara ett kvar.');
  await waitNext('Ledtråd 1');
  $('#c1').classList.add('litok'); $('#both').classList.add('on');
  ask('Inuti <b>både</b> cirkeln och kvadraten: bara talen i det lila området.');
  await W(PACE);
  for (const g of gs) { const [, x, y] = pos(g); if (!(inSq(x, y) && inCi(x, y))) { g.classList.add('out'); await W(120); } }
  why('Talen utanför det lila området är strukna. Kvar: 12, 15 och 18.');
  await waitNext('Ledtråd 2');
  $('#c2').classList.add('litok');
  ask('Kan delas jämnt med 4: vilket av talen som är kvar går att dela med 4 utan rest?');
  await W(PACE);
  for (const g of gs) { const n = +g.dataset.n; if (!g.classList.contains('out') && n % 4) { g.classList.add('out'); await W(300); } }
  why('15 / 4 = 3 rest 3 och 18 / 4 = 4 rest 2. De stryks. Bara ett tal är kvar.');
  ask('Tryck på talet.');
  await new Promise(res => gs.forEach(g => g.onclick = () => {
    const n = +g.dataset.n;
    if (n === 12) { g.classList.add('win'); gs.forEach(x => x.onclick = null); res(); }
    else { g.classList.add('nope'); setTimeout(() => g.classList.remove('nope'), 900);
      const [, x, y] = pos(g);
      ask(`<span class="soft">Inte riktigt – försök igen.</span>${!(inSq(x, y) && inCi(x, y)) ? `${n} är inte i både cirkeln och kvadraten.` : `${n} går inte jämnt att dela med 4.`}`); }
  }));
  ask('<span class="ok">Klart!</span>Talet är <b>12</b>.');
  why('12 ligger i både cirkeln och kvadraten, och 12 / 4 = 3 utan rest.');
  act(`<button class="ghost">Till hubben</button>`, hub);
}

/* ── 10, 100 och 1000: vänd på det. Originalfrågan står kvar, den vända raden flyger fram under (Dennis 12/11) ── */
const DZ = [
  { a: 6000, b: '?', c: 6, ans: 1000, op: '/', x: 6000, y: 6, q: 'Vad ska 6000 delas med för att bli 6?',
    flipWhy: 'Om 6000 delat med något blir 6, så blir 6000 delat med 6 just det något.',
    calcWhy: `6000 är 6 tusenlappar ${icons(6, 0)}. Delat på 6 blir det 1 tusenlapp var: 1000.` },
  { a: '?', b: 10, c: 30, ans: 300, op: '·', x: 10, y: 30, q: 'Vilket tal delat med 10 blir 30?',
    flipWhy: 'Om något delat med 10 blir 30, så är något 10 gånger så stort som 30. Division baklänges är gånger.',
    calcWhy: `30 tior ${icons(30, 2)} är 300 kronor. 10 · 30 = 300.` } ];
function dzView(k = 0) {
  view = 'dz'; typed = ''; padHandler = null;
  const t = DZ[k];
  const cell = (v, id) => v === '?' ? `<span class="dzq" id="${id}">?</span>` : `<span class="dzn" id="${id}">${v}</span>`;
  app.innerHTML = kdShell('10, 100 och 1000') + `
  <div class="card">
    <div class="ask" id="ask"></div>
    <div class="dzrow orig"><small>FRÅGAN</small>${cell(t.a, 'oa')} / ${cell(t.b, 'ob')} = ${cell(t.c, 'oc')}</div>
    <div class="why" id="why"></div>
    <div class="dzrow flip" id="flip" style="visibility:hidden"><small>VÄND PÅ DET</small><span class="dzn" id="fx"></span> <span id="fop">${t.op}</span> <span class="dzn" id="fy"></span> = <div class="box" id="fz"></div></div>
    <div id="act" style="display:flex;justify-content:center;min-height:46px"></div>
  </div>` + padHTML() + kladdHTML();
  $('[data-hub]').onclick = hub;
  dzRun(k);
}
async function dzRun(k) {
  const t = DZ[k];
  ask(t.q);
  why('Det okända står inte sist. Då vänder vi på frågan, så att det okända hamnar där vi kan räkna fram det.');
  await waitNext('Vänd på det');
  $('#flip').style.visibility = 'visible';
  why(t.flipWhy);
  /* talen flyger från frågan till den vända raden: frågan står kvar ovanför */
  const src = v => ['oa', 'ob', 'oc'].map(id => $('#' + id)).find(e => e.textContent === String(v));
  await fly(src(t.x), $('#fx'), String(t.x)); $('#fx').textContent = t.x;
  await fly(src(t.y), $('#fy'), String(t.y)); $('#fy').textContent = t.y;
  await waitNext('Räkna');
  why(t.calcWhy);
  const q = `Räkna ${t.x} ${t.op} ${t.y}.`;
  ask(q);
  await typeAnswer($('#fz'), t.ans, q);
  /* svaret flyger tillbaka upp till frågetecknet */
  ask('<span class="ok">Rätt!</span>Nu flyttar vi svaret till frågan.');
  const qm = $('#ob').textContent === '?' ? $('#ob') : $('#oa');
  await fly($('#fz'), qm, String(t.ans)); qm.textContent = t.ans; qm.className = 'dzn ansq';
  ask(`<span class="ok">Klart!</span>${t.a === '?' ? t.ans : t.a} / ${t.b === '?' ? t.ans : t.b} = ${t.c}.`);
  why(t.a === '?' ? `Kontroll: ${t.ans} / 10 = ${t.c}. Stryk en nolla i ${t.ans}, så blir det ${t.c}.` : `Kontroll: ${t.a} / ${t.ans} = ${t.c}.`);
  act(k + 1 < DZ.length ? `<button class="next">Nästa uppgift ${ic.next}</button>` : `<button class="ghost">Till hubben</button>`, () => k + 1 < DZ.length ? dzView(k + 1) : hub());
}

function go(v) {
  if (v === 'restart') v = view;
  document.querySelectorAll('#lab button').forEach(b => b.classList.toggle('on', b.dataset.go === v));
  ({ hub, kd: () => kdView(), trap: trapView, prob: () => probView(), klur: klurView, venn: vennView, dz: () => dzView(0) })[v]();
}
document.querySelectorAll('#lab button').forEach(b => b.onclick = () => go(b.dataset.go));
go(location.hash.slice(1) || 'hub');
</script>
