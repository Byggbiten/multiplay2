<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Geografi — mockup (Sveriges landskap)</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ── Tokens ur styles/app.css. Geografin får ett eget modultema (förslag: havsgrönt), samma komponenter ── */
:root{
  --font-head:'Baloo 2',cursive; --font-body:'Nunito',sans-serif;
  --ink:#3b1d6e; --ink-soft:#6d5a96;
  --accent:#0f8b8d; --accent-light:#4fc3c4; --accent-2:#f59e0b; --deep:#134e4a; --glow:rgba(79,195,196,.42); --tint:#e8f8f7;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.9);
  --shadow-panel:0 10px 34px rgba(93,63,158,.10),0 2px 6px rgba(93,63,158,.06);
  --radius-md:18px; --radius-lg:24px;
  --spring:cubic-bezier(.34,1.3,.4,1); --smooth:cubic-bezier(.4,0,.2,1);
  /* lådorna (samma som Gångertabellen och Klockan) */
  --kan:#2fbf68; --due:#bfead0; --ovar:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--ink);overflow:hidden;
  background:linear-gradient(160deg,#fdf4ff 0%,#fce7f3 34%,#eff6ff 68%,#f0fdf4 100%);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:default}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.app{width:390px;height:844px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:4px 10px 8px;overflow:hidden;position:relative}

/* Header (app-header) */
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:46px;flex-shrink:0;gap:6px}
.btn-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 16px 8px 12px;border-radius:999px;
  background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--shadow-panel);color:var(--deep);font-weight:800;font-size:14px;flex-shrink:0}
.btn-back svg{width:18px;height:18px}
.title{font-family:var(--font-head);font-weight:700;font-size:21px;color:var(--deep);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{width:52px;flex-shrink:0}

/* Labbreglage (inte app-UI: dämpade, samma form som gångertabellens mockup) */
.labbox{flex-shrink:0;display:flex;flex-direction:column;gap:3px;padding:2px 4px 5px;border-bottom:1.5px dashed rgba(59,29,110,.18)}
.trow{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.trow .sp1{flex:1}
.tg{display:flex;gap:2px;background:rgba(255,255,255,.6);border-radius:999px;padding:2px}
.tg button{min-height:26px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
.tg button.on{background:var(--ink);color:#fff}
.lbtn{min-height:26px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;color:var(--ink-soft);background:rgba(255,255,255,.6);display:inline-flex;align-items:center;gap:4px}
.lbtn svg{width:13px;height:13px}
.labstat{height:15px;line-height:15px;font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labstat b{font-weight:900;color:var(--ink)}
.labtag{display:inline-block;font-size:9.5px;letter-spacing:.08em;font-weight:900;padding:0 5px;border-radius:4px;background:rgba(59,29,110,.1);margin-right:5px;line-height:14px}

/* Skärmar */
.screens{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:6px}
.screen.on{display:flex;animation:scrin .32s var(--smooth) both}
.card{background:var(--glass-strong);border-radius:var(--radius-lg);border:1px solid var(--glass-line);box-shadow:var(--shadow-panel)}
.grow{flex:1;min-height:0}

/* Knappar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;
  font-size:16px;font-weight:800;line-height:1;white-space:nowrap;user-select:none;width:100%;
  transition:transform .25s var(--spring),box-shadow .25s var(--smooth),opacity .15s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;box-shadow:0 8px 22px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-sec{background:var(--glass-strong);border:1.5px solid color-mix(in srgb,var(--accent) 28%,transparent);color:var(--deep);box-shadow:var(--shadow-panel)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.42;box-shadow:none}
.btn-pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--glass-strong);
  border:1.5px solid color-mix(in srgb,var(--accent) 26%,transparent);color:var(--deep);font-weight:800;font-size:14px;white-space:nowrap;box-shadow:var(--shadow-panel)}
.btn-pill svg{width:18px;height:18px}
.slot{height:52px;flex-shrink:0;display:flex;gap:8px}
.slot .duo{display:none;gap:8px;width:100%}
.slot.duoing .duo{display:flex}
.slot.duoing > .btn{display:none}
.slot .duo .btn{flex:1;padding:0 10px;font-size:15px}
.duo2{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;flex-shrink:0}
.duo2 .btn{min-height:58px;font-size:17px}

/* Bubblan — fast höjd, knappen står still */
.bubble{flex-shrink:0;display:flex}
.b92{height:92px}.b76{height:76px}
.thought{flex:1;background:#fff;border-radius:var(--radius-md);padding:8px 14px;box-shadow:var(--shadow-panel);font-weight:800;color:var(--ink);
  font-size:15.5px;line-height:1.35;border:2px solid color-mix(in srgb,var(--accent) 18%,transparent);display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.thought.pop{animation:bubblein .3s var(--spring)}
.thought .sm{font-size:13px;color:#64748b}
.thought .lead{font-size:15.5px;font-weight:900;color:#b45309}
.thought .lead.good{color:#15803d}

/* ── Kartan ─────────────────────────────── */
.mapbox{position:relative;flex:1;min-height:0}
.gm{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.gm path.ls{fill:var(--f);stroke:rgba(40,40,40,.55);stroke-width:.8;vector-effect:non-scaling-stroke;transition:opacity .45s var(--smooth),fill .45s var(--smooth),filter .45s}
.gm path.ls.out{opacity:.38;filter:saturate(.45)}
.gm path.ls.pale{opacity:.3}
.gm.boxes path.ls{fill:#fff}
.gm.boxes path.ls[data-b="ovar"]{fill:var(--ovar)}
.gm.boxes path.ls[data-b="kan"]{fill:var(--kan)}
.gm.boxes path.ls[data-b="due"]{fill:var(--due)}
.gm .fx{pointer-events:none;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.gm .fx-bad{fill:rgba(239,68,68,.5);stroke:#dc2626;stroke-width:2.5}
.gm .fx-ok{fill:rgba(34,197,94,.5);stroke:#15803d;stroke-width:2.5}
.gm .fx-blink{fill:rgba(245,158,11,.62);stroke:#b45309;stroke-width:3;animation:blink .42s ease-in-out 6 alternate}
.gm .fx-mark{fill:rgba(15,139,141,.34);stroke:var(--deep);stroke-width:3;animation:markpulse 1.6s ease-in-out infinite}
.gm .fx-ref{fill:rgba(15,139,141,.14);stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 4}
.gm .fx-lit{fill:none;stroke:var(--deep);stroke-width:2.6}
.gm .fx-halo{fill:rgba(147,51,234,.12);stroke:rgba(147,51,234,.22)}
.gm .lb{pointer-events:none;opacity:0;transition:opacity .3s}
.gm.instant .lb,.gm.instant path.ls{transition:none}
.gm .lb.on{opacity:1}
.gm .lb text{font-family:var(--font-head);font-weight:800;fill:#1f2937;stroke:#fff;stroke-width:3.2;paint-order:stroke;text-anchor:middle;dominant-baseline:central}
.gm .lb .rg{fill:#fff;stroke:var(--accent);stroke-width:2.6;opacity:0}
.gm .lb.ring .rg{opacity:1;animation:markpulse 1.6s ease-in-out infinite}
.gm .lb.ring text{fill:var(--deep);stroke:none}
.gm .chip{pointer-events:none}
.gm .chip rect{fill:var(--deep)}
.gm .chip text{font-family:var(--font-body);font-weight:900;font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.gm .chip.k-ok rect{fill:#15803d}
.gm .chip.k-bad rect{fill:#dc2626}
.gm .chip.k-ref rect{fill:#fff;stroke:var(--accent);stroke-width:1.5}
.gm .chip.k-ref text{fill:var(--deep)}
.gm .chip.k-ld rect{fill:rgba(255,255,255,.92);stroke:rgba(19,78,74,.35);stroke-width:1.2}
.gm .chip.k-ld text{fill:var(--deep);font-family:var(--font-head);font-weight:800;font-size:16px}
.gm .chip.k-lake text{fill:#0369a1;font-style:italic;font-weight:800;font-size:11.5px}
.gm .chip.k-lake rect{fill:none}
.gm .chip.k-pale rect{fill:rgba(255,255,255,.9);stroke:rgba(40,40,40,.25);stroke-width:1}
.gm .chip.k-pale text{fill:var(--ink-soft)}
.gm .chip .in{transform-box:fill-box;transform-origin:center;animation:chipin .45s var(--spring) both}
.gm .pin{pointer-events:none}
.gm .pin .in{animation:pindrop .55s var(--spring) both}

/* ── Hemvyn ─────────────────────────────── */
.hubcard{flex:1;min-height:0;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px}
.hubhead{display:flex;align-items:center;justify-content:space-between;gap:8px;height:50px;flex-shrink:0}
.hubhead b{font-family:var(--font-head);font-weight:800;font-size:19px;color:var(--deep);line-height:1.1;white-space:nowrap}
.seg2{display:flex;gap:2px;background:rgba(19,78,74,.07);border-radius:999px;padding:3px}
.seg2 button{min-height:44px;padding:0 12px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px}
.seg2 button svg{width:16px;height:16px}
.seg2 button.on{background:#fff;color:var(--deep);box-shadow:0 2px 8px rgba(19,78,74,.16)}
.hubbody{flex:1;min-height:0;display:flex;gap:8px;position:relative}
.hubmap{flex:0 0 198px;position:relative}
.hubbody.wide .hubmap{flex:1 1 auto}
.gsteps{flex:1;min-width:0;position:relative;transition:opacity .25s}
.hubbody.wide .gsteps{display:none}
.gstep{position:absolute;left:0;right:0;height:68px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:6px 9px;border-radius:16px;background:#fff;text-align:left;
  border:1.5px solid color-mix(in srgb,var(--accent) 20%,transparent);color:var(--deep);transition:transform .2s var(--spring);box-shadow:0 4px 12px rgba(19,78,74,.06)}
.gstep:active{transform:scale(.97)}
.gstep .srow{display:flex;align-items:center;gap:6px;min-width:0}
.gstep .smd{position:relative;width:26px;height:26px;flex-shrink:0}
.gstep b{font-family:var(--font-head);font-weight:800;font-size:15.5px;line-height:1.1;white-space:nowrap}
.gstep small{font-size:12px;font-weight:800;color:var(--ink-soft);white-space:nowrap;line-height:1.1}
.gstep .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);vertical-align:0}
.gstep.all{background:linear-gradient(135deg,#fff,var(--tint))}
.tb-bar{display:block;height:4px;border-radius:999px;background:rgba(19,78,74,.1);overflow:hidden;margin-top:2px}
.tb-bar i{display:block;height:100%;border-radius:inherit;background:var(--kan)}
svg.md{display:block;width:100%;height:100%}
.mdue{position:absolute;top:-3px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--due);box-shadow:0 0 0 1.5px #fff,inset 0 0 0 1.5px rgba(47,191,104,.5)}
.hublegend{display:flex;justify-content:center;align-items:center;gap:12px;height:18px;flex-shrink:0;font-size:12px;font-weight:800;color:var(--ink-soft)}
.hublegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.mpill{position:absolute;bottom:0;right:0;z-index:3}
.mpill[hidden]{display:none}

/* ── Stegets startskärm ─────────────────── */
.shead{display:flex;align-items:center;gap:12px;padding:10px 12px;flex-shrink:0}
.smd-l{position:relative;width:54px;height:54px;flex-shrink:0}
.smd-l .mdue{width:14px;height:14px;top:-2px;right:-3px}
.sht{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;line-height:1.1}
.sht b{font-family:var(--font-head);font-weight:800;font-size:27px;color:var(--deep)}
.sht span{font-weight:800;font-size:13.5px;color:var(--ink-soft)}
.sht .tb-bar{width:140px;height:6px;margin-top:3px}
.stepmap{flex:1;min-height:0;padding:8px;display:flex;flex-direction:column}
.medals{display:flex;flex-direction:column;gap:2px;padding:6px 12px;flex-shrink:0}
.md-row{display:flex;align-items:center;gap:10px;min-height:32px;font-size:14px;font-weight:700;color:var(--ink);transition:opacity .2s}
.md-row b{font-weight:900}
.md-row .mdi{width:26px;height:26px;flex-shrink:0}
.md-row.off{opacity:.45}
.md-row .mok{margin-left:auto;width:22px;height:22px;color:#16a34a;visibility:hidden}
.md-row:not(.off) .mok{visibility:visible}
.md-row .mok svg.i{width:20px;height:20px;stroke-width:3}
.md-row.fill{color:var(--ink-soft);font-weight:800;font-size:13px}
.md-row.fill i{display:block;width:12px;height:12px;border-radius:50%;margin:0 7px;background:var(--due);box-shadow:inset 0 0 0 1.5px rgba(47,191,104,.5)}
.rounds{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding:8px 12px;flex-shrink:0;font-size:13px;font-weight:800;color:var(--ink-soft);white-space:nowrap;overflow:hidden}
.rounds b{font-family:var(--font-head);font-size:16px;color:var(--deep);margin-right:2px}
.rounds .rv{display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.ri{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:var(--tint);color:var(--accent)}
.ri svg.i{width:15px;height:15px}

/* ── Lektionen och passet ───────────────── */
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px;flex-shrink:0}
.ltag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--accent);font-size:12.5px;font-weight:900;white-space:nowrap}
.ltag svg.i{width:15px;height:15px}
.ldots{display:flex;justify-content:flex-end;flex:1;gap:5px;align-items:center;padding-right:4px;flex-wrap:nowrap;overflow:hidden}
.ldots i{width:7px;height:7px;border-radius:50%;background:rgba(19,78,74,.16);transition:background-color .3s,transform .3s;flex-shrink:0}
.ldots i.done{background:var(--accent-light)}
.ldots i.cur{background:var(--accent);transform:scale(1.35)}
.ldots i.try{border-radius:2px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:8px 8px 6px;position:relative}
.stage.ok{box-shadow:0 0 0 3px #86efac,var(--shadow-panel)}
.ptop{display:flex;align-items:center;gap:8px;min-height:36px;flex-shrink:0;padding:0 2px}
.prompt{flex:1;min-width:0;font-family:var(--font-head);font-weight:800;color:var(--deep);font-size:20px;line-height:1.15}
.prompt em{font-style:normal;color:var(--accent)}
.qtag{height:24px;padding:0 10px;border-radius:999px;background:var(--tint);color:var(--accent);font-size:12px;font-weight:900;display:none;align-items:center;white-space:nowrap;flex-shrink:0}
.qtag.on{display:inline-flex}
.ptop .btn-pill{flex-shrink:0}
.ctrl{flex-shrink:0;transition:opacity .25s}
.ctrl:empty{display:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:56px;padding:4px 8px;border-radius:18px;font-family:var(--font-head);font-weight:800;font-size:18px;line-height:1.1;background:var(--glass-strong);color:var(--deep);
  border:2px solid color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:var(--shadow-panel);transition:transform .2s var(--spring),background-color .25s,border-color .25s}
.opts.nums .opt{font-size:28px}
.opt:active{transform:scale(.96)}
.opt.ok{background:#dcfce7;border-color:#22c55e;color:#15803d}
.opt.bad{background:#fee2e2;border-color:#ef4444;color:#b91c1c}
.opt:disabled{cursor:default}
.shake{animation:shake .4s ease-in-out}
/* Under förklaringen: bara svaret barnet valde och det rätta – kartan får platsen */
.ctrl.exp .opt:not(.bad):not(.ok){display:none}

/* Passets spår */
.track{min-height:54px;flex-shrink:0;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;gap:7px}
.trtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:800;font-size:13px;color:var(--ink-soft);white-space:nowrap}
.trtop b{font-family:var(--font-head);font-size:18px;color:var(--deep)}
.rps{display:flex;gap:5px;align-items:center;flex-shrink:0}
.rp{width:9px;height:9px;border-radius:50%;background:rgba(19,78,74,.16)}
.rp.ok{background:var(--kan)}
.rp.cur{background:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--accent)}
.bar{position:relative;height:10px;flex-shrink:0;border-radius:999px;background:rgba(19,78,74,.12)}
.bar .fill{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-light));transform-origin:left center;transform:scaleX(0);transition:transform .45s var(--smooth)}
.between{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.between .okc{width:64px;height:64px;color:var(--kan)}
.between .okc svg{width:64px;height:64px;stroke-width:3}
.between b{font-family:var(--font-head);font-weight:800;font-size:30px;color:var(--deep)}
.between span{font-weight:800;font-size:16px;color:var(--ink-soft)}
.rl{display:grid;grid-template-columns:1fr;gap:6px;width:100%}
.rl span{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:14px;background:var(--glass-strong);border:1.5px solid color-mix(in srgb,var(--accent) 16%,transparent);font-weight:800;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.rl span.ok{background:#dcfce7;border-color:#86efac;color:#15803d}
.rl span.next{border-color:var(--accent);color:var(--deep)}

/* Du är klar! – kvittot (Klockans form) */
.dn-head{display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.dn-star{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 8px 20px rgba(245,158,11,.35);animation:pop .6s var(--spring)}
.dn-star svg.i{width:30px;height:30px;fill:#fff;stroke-width:1.6}
.dn-head h2{font-family:var(--font-head);font-weight:800;font-size:32px;color:var(--deep);line-height:1.05;margin:6px 0 0}
.dn-head p{font-weight:800;font-size:15px;color:var(--ink-soft);margin:3px 0 0;min-height:20px}
.receipt{display:flex;flex-direction:column;gap:6px;flex-shrink:0;background:#fff !important;padding:10px 12px}
.rc-top{display:flex;flex-direction:column;gap:1px;padding-bottom:7px;border-bottom:1.5px dashed rgba(19,78,74,.2)}
.rc-k{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rc-k svg.i{width:16px;height:16px}
.rc-when{font-weight:800;font-size:15px;color:var(--deep)}
.rc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;font-weight:700;color:var(--ink-soft)}
.rc-row b{font-family:var(--font-head);font-weight:800;font-size:17px;color:var(--deep);text-align:right}
.rc-rounds{display:grid;grid-template-columns:1fr;gap:3px;padding:6px 0;border-top:1.5px dashed rgba(19,78,74,.2);border-bottom:1.5px dashed rgba(19,78,74,.2)}
.rcv{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap}
.rcv svg.i{width:16px;height:16px;color:#16a34a;stroke-width:3}
.rcv em{font-style:normal;color:var(--ink-soft)}
.rc-foot{position:relative;height:62px;display:grid;place-items:center;border:2px dashed rgba(22,163,74,.35);border-radius:14px;margin-top:2px}
.slot-ph{font-size:13px;font-weight:800;color:rgba(21,128,61,.6);transition:opacity .2s}
.slot-ph.off{opacity:0}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.stamp.on{animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
.st-in{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border:3px solid #16a34a;border-radius:12px;color:#15803d;transform:rotate(-5deg);background:rgba(240,253,244,.9)}
.st-in svg.i{width:26px;height:26px;stroke-width:3.2}
.st-tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.st-in b{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.st-in small{font-size:12px;font-weight:800}
.dn-ask{text-align:center;font-weight:900;font-size:16px;color:var(--deep);margin:0;flex-shrink:0;min-height:22px}
.hold{position:relative;overflow:hidden;min-height:58px;flex-shrink:0;border-radius:999px;border:2px solid #16a34a;background:#fff;color:#15803d;
  font-weight:900;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold-fill{position:absolute;inset:0;background:linear-gradient(90deg,#bbf7d0,#4ade80);transform:scaleX(0);transform-origin:left center}
.hold.holding .hold-fill{transform:scaleX(1);transition:transform 1.5s linear}
.hold-t{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.hold.done{background:#dcfce7}
.hold:disabled{opacity:1}

@keyframes scrin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bubblein{from{transform:scale(.9) translateY(4px);opacity:.4}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes chipin{0%{transform:scale(.4);opacity:0}65%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.5);opacity:.2}65%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes blink{from{opacity:1}to{opacity:.12}}
@keyframes markpulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes pindrop{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4)}60%{opacity:1;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}

/* ═══════════════════════════════════════════════════════════
   LÅDORNA OCH NÖTLOOPEN — kopior ur js/shared.js (MP.spaced, MP.createDrill,
   kvittots hjälpare, MP.medalSVG, MP.bindHold), så att mockupen är en fil.
═══════════════════════════════════════════════════════════ */
const SP = (function(){
  const MEDALS = ['brons', 'silver', 'guld'];
  const INTERVALS = [1, 3, 7, 14, 30];
  const intervalFor = level => INTERVALS[Math.min(Math.max(level, 1), INTERVALS.length) - 1];
  const pad2 = n => String(n).padStart(2, '0');
  const fmtDay = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  function addDays(day, n){ const [y, m, d] = day.split('-').map(Number); return fmtDay(new Date(y, m - 1, d + n)); }
  const fresh = () => ({ box:'ny', okDays:0, level:0, due:null, lastOk:null, relearn:false });
  function applyAnswer(st, correct, day){
    if (correct){
      if (st.lastOk !== day){ st.okDays++; st.lastOk = day; }
      if (st.box === 'ny') st.box = 'ovar';
      else if (st.box === 'ovar'){
        if (st.okDays >= (st.relearn ? 2 : 3)){ st.box = 'kan'; st.level = 1; st.due = addDays(day, intervalFor(1)); st.relearn = false; }
      } else if (st.box === 'kan' && (!st.due || day >= st.due)){ st.level = (st.level || 1) + 1; st.due = addDays(day, intervalFor(st.level)); }
    } else if (st.box === 'kan'){ st.box = 'ovar'; st.okDays = 0; st.lastOk = null; st.relearn = true; st.level = 0; st.due = null; }
    else if (st.box === 'ovar'){ st.okDays = 0; st.lastOk = null; }
    return st;
  }
  const vis = (st, day) => (st.box === 'kan' && st.due && day >= st.due) ? 'due' : st.box;
  function medal(views){
    const total = views.length; let kan = 0, ny = 0, due = 0;
    for (const v of views){ if (v === 'kan' || v === 'due') kan++; if (v === 'due') due++; if (v === 'ny') ny++; }
    const m = ny > 0 ? null : kan === total ? 'guld' : kan * 2 >= total ? 'silver' : 'brons';
    return { medal:m, kan, total, due, share:total ? kan / total : 0 };
  }
  return { MEDALS, fmtDay, addDays, fresh, applyAnswer, vis, medal };
})();
function createDrill(items, r = Math.random){
  const q = items.map((it, i) => ({ ...it, id:i, extra:false }));
  const hasExtra = new Set();
  let idx = 0, retry = false;
  const st = { asked:0, firstOk:0, wrongFirst:0, attempts:0 };
  return {
    current(){ return idx < q.length ? { ...q[idx], retry } : null; },
    answer(ok){
      if (idx >= q.length) return null;
      const slot = q[idx], record = !retry; let insertedAt = null;
      st.attempts++;
      if (record){ st.asked++; if (ok) st.firstOk++; else st.wrongFirst++; }
      if (ok){ idx++; retry = false; }
      else {
        retry = true;
        if (!slot.extra && !hasExtra.has(slot.id)){
          hasExtra.add(slot.id);
          const lo = idx + 3, hi = q.length;
          insertedAt = lo >= hi ? hi : lo + Math.floor(r() * (hi - lo + 1));
          q.splice(insertedAt, 0, { ...slot, extra:true });
        }
      }
      return { record, ok:!!ok, insertedAt };
    },
    isDone(){ return idx >= q.length; },
    progress(){ return { done:idx, total:q.length }; },
    stats(){ return { ...st }; },
    queue(){ return q.map(x => ({ ...x })); },
  };
}
const receiptFor = (results, ms) => {
  const correct = results.reduce((s, x) => s + x.firstOk, 0), total = results.reduce((s, x) => s + x.asked, 0), fixed = results.reduce((s, x) => s + x.wrongFirst, 0);
  return { correct, total, pct:total ? Math.round(100 * correct / total) : 0, fixed, secs:Math.max(0, Math.round((ms || 0) / 1000)), rounds:results.map(x => x.type) };
};
const durTxt = secs => { if (secs < 60) return `${secs} s`; const m = Math.floor(secs / 60), s = secs % 60; return s ? `${m} min ${s} s` : `${m} min`; };
const praiseFor = pct => pct >= 100 ? 'Varje svar satt på första försöket.' : pct >= 85 ? 'Starkt jobbat! Nästan allt satt direkt.' : pct >= 60 ? 'Bra nött! Du rättade varje fel.' : 'Du nötte dig igenom hela passet. Varje fel blev rätt till slut.';
const fmtWhen = iso => { const d = new Date(iso); return `${d.toLocaleDateString('sv-SE', { weekday:'long', day:'numeric', month:'long' })} kl. ${d.toLocaleTimeString('sv-SE', { hour:'2-digit', minute:'2-digit' })}`; };
const fmtStamp = iso => { const d = new Date(iso); return `${d.toLocaleDateString('sv-SE', { day:'numeric', month:'short' })} ${d.toLocaleTimeString('sv-SE', { hour:'2-digit', minute:'2-digit' })}`; };
const MEDAL_COL = { guld:{ f:'#fcd34d', s:'#d97706', st:'#fffbeb' }, silver:{ f:'#e2e8f0', s:'#64748b', st:'#ffffff' }, brons:{ f:'#c2733a', s:'#6b2f0c', st:'#f1c29a' } };
const MEDAL_BAND = { l:'#5eead4', r:'#0f8b8d', ring:'rgba(19,78,74,.3)' };   // geografins havsgröna band
function medalSVG(kind){
  const b = MEDAL_BAND;
  if (!kind) return `<svg class="md" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14.3" r="7" fill="none" stroke="${b.ring}" stroke-width="1.6" stroke-dasharray="2.4 2.4"/></svg>`;
  const c = MEDAL_COL[kind];
  return `<svg class="md md-${kind}" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 1h4.2l2.9 6.4H8.9z" fill="${b.l}"/><path d="M18 1h-4.2l-2.9 6.4h4.2z" fill="${b.r}"/>` +
    `<circle cx="12" cy="14.3" r="7.6" fill="${c.f}" stroke="${c.s}" stroke-width="1.5"/><circle cx="12" cy="14.3" r="5.4" fill="none" stroke="${c.s}" stroke-width=".8" opacity=".4"/>` +
    `<path d="M12 10.4l1.15 2.35 2.6.38-1.88 1.83.44 2.58L12 16.32l-2.31 1.22.44-2.58-1.88-1.83 2.6-.38z" fill="${c.st}" stroke="${c.s}" stroke-width=".7" stroke-linejoin="round"/></svg>`;
}
const MEDAL_NAME = { guld:'Guld', silver:'Silver', brons:'Brons' };
function bindHold(el, opts){
  const ms = opts.ms || 1500; let t = null;
  function start(ev){
    if (el.disabled || (opts.canStart && !opts.canStart())) return;
    if (ev && ev.cancelable) ev.preventDefault();
    clearTimeout(t); el.classList.remove('holding'); void el.offsetWidth; el.classList.add('holding');
    t = setTimeout(() => { t = null; el.classList.remove('holding'); opts.onDone(); }, ms);
  }
  function end(){ if (!t) return; clearTimeout(t); t = null; el.classList.remove('holding'); }
  el.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, end));
  el.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); start(); } });
  el.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') end(); });
  el.addEventListener('contextmenu', e => e.preventDefault());
}

/* ═══════════════════════════════════════════════════════════
   TILLSTÅND: en låda per landskap. Alla tre frågetyperna delar lådan
   (som Gångertabellens omvända frågor och Klockans läs/ställ).
═══════════════════════════════════════════════════════════ */
const STEPS = [
  { id:'Norrland', name:'Norrland', view:'Norrland', nrs:NRS_OF('Norrland') },
  { id:'Svealand', name:'Svealand', view:'Svealand', nrs:NRS_OF('Svealand') },
  { id:'Götaland', name:'Götaland', view:'Götaland', nrs:NRS_OF('Götaland') },
  { id:'Sverige',  name:'Hela Sverige', view:'Sverige', nrs:ALL },

const stepById = id => STEPS.find(s => s.id === id);
const S = { preset:'ny', types:{ a:true, b:true, c:true }, halo:false, dayOff:0, boxes:{}, screen:'hub', step:null, hubMode:'bok' };
const today = () => { const d = new Date(); d.setDate(d.getDate() + S.dayOff); return SP.fmtDay(d); };

function kanState(){ const t = today(); return { box:'kan', okDays:3, level:1, due:SP.addDays(t, 1), lastOk:SP.addDays(t, -1), relearn:false }; }
function applyPreset(p){
  S.preset = p; S.dayOff = 0; S.boxes = {};

    const green = p === 'gron' || (p === 'norr' && BY[n].landsdel === 'Norrland');

}
const stepMedal = id => SP.medal(stepById(id).nrs.map(n => SP.vis(box(n), today())));
const kanTxt = (k, total) => k >= total ? `Du kan alla ${antal(total)} landskap` : k === 0 ? `Du kan inget av de ${antal(total)} landskapen än` : `Du kan ${antal(k)} av ${antal(total)} landskap`;
function recordAnswer(nr, ok){ SP.applyAnswer(box(nr), ok, today()); renderLab(); }

/* ═══════════════════════════════════════════════════════════
   LABBREGLAGEN
═══════════════════════════════════════════════════════════ */
function renderLab(){
  document.querySelectorAll('.tg[data-k]').forEach(tg => {
    const k = tg.dataset.k, v = k === 'halo' ? (S.halo ? 'pa' : 'av') : S[k];
    tg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  });
  $('typeTg').querySelectorAll('button').forEach(b => b.classList.toggle('on', !!S.types[b.dataset.t]));
  const md = STEPS.map(s => { const m = stepMedal(s.id); return `${s.id === 'Sverige' ? 'H' : s.id[0]}:${m.medal ? m.medal : '–'}`; }).join(' ');
  $('labstat').innerHTML = `<span class="labtag">LÄGE</span><b>${S.screen}</b> · dag +${S.dayOff} · ${md}`;
}
document.querySelectorAll('.tg[data-k]').forEach(tg => tg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = tg.dataset.k;
  if (k === 'preset'){ applyPreset(b.dataset.v); return; }
  if (k === 'halo'){ S.halo = b.dataset.v === 'pa'; Object.values(MAPS).forEach(m => m.showHalo(S.halo)); renderLab(); return; }
}));
$('typeTg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = b.dataset.t, on = !S.types[t];
  if (!on && Object.values(S.types).filter(Boolean).length === 1) return;   // minst en frågetyp
  S.types[t] = on; renderLab();
  if (S.screen === 'step') renderStep();
});
$('dayBtn').addEventListener('click', () => { S.dayOff++; renderLab(); if (S.screen === 'hub') renderHub(); if (S.screen === 'step') renderStep(); });
$('resetBtn').addEventListener('click', () => applyPreset(S.preset));

/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
const MAPS = {};
function goto(screen, arg){
  token++; busy = false;
  S.screen = screen;
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === `scr-${screen}`));
  if (screen === 'hub') enterHub();
  if (screen === 'step'){ if (arg) S.step = arg; enterStep(); }
  if (screen === 'lesson') enterLesson(arg || S.step);
  if (screen === 'pass') enterPass(arg || S.step);
  if (screen === 'done') enterDone();
  renderLab();
}
$('backBtn').addEventListener('click', () => {
  if (S.screen === 'hub'){ if (HUB.zoom) hubZoomOut(); return; }
  if (S.screen === 'step') goto('hub');
  else goto('step');
});
function setHeader(title, back = 'Tillbaka'){ $('title').textContent = title; $('backTx').textContent = back; }
function say(id, t1, t2 = '', o = {}){
  const th = $(id); if (!th) return;

const label = nr => NAME(nr);   // lappens text: namnet (siffran står kvar ovanför)

/* ═══════════════════════════════════════════════════════════
   HEMVYN: kartan + trappan (Norrland, Svealand, Götaland, Hela Sverige)
═══════════════════════════════════════════════════════════ */
const HUB = { zoom:null, picked:null };
function enterHub(){
  setHeader('Sveriges landskap');
  HUB.zoom = null; HUB.picked = null;
  $('hubBody').classList.remove('wide'); $('hubOut').hidden = true;
  renderHub();
}
function renderHub(){
  const M = MAPS.hub;
  $('segBok').innerHTML = `${svg('hash')}Läxboken`; $('segLador').innerHTML = `${svg('boxes')}Lådor`;

      <span class="srow"><span class="smd">${medalSVG(m.medal)}${m.due ? '<i class="mdue"></i>' : ''}</span><b>${s.name}</b></span>

    S.hubMode === 'bok' ? 'Siffrorna är samma som i läxboken.' : 'Ljusgrönt betyder att det är dags att öva igen.');

async function hubTap(nr, p){
  if (nr === null || busy) return;
  const M = MAPS.hub;
  if (!HUB.zoom){                                       // första trycket: in i landsdelen (Norrland: norra eller södra delen)
    const v = zoomTarget('Sverige', nr, p); HUB.zoom = v;
    $('hubBody').classList.add('wide'); $('hubOut').hidden = false; $('hubOut').innerHTML = `${svg('zoomout')}Hela kartan`;
    busy = true; M.out(VIEW_LD(v)); await M.setView(v, 650); busy = false;
    say('hubBubble', `Nu ser du ${VIEW_NAME[v]}.`, 'Tryck på ett landskap så ser du vad det heter.');
    return;
  }
  M.clearChips(); M.pin(false);
  HUB.picked = nr;
  M.chip(nr, label(nr), 'def', { below:true });
  if (nr === 7) M.pin(true);
  say('hubBubble', `Nummer ${nr} är ${NAME(nr)}.`, nr === 7 ? 'Här bor du!' : `${NAME(nr)} hör till ${BY[nr].landsdel}.`);
}
async function hubZoomOut(){
  const M = MAPS.hub; if (busy) return;
  HUB.zoom = null; HUB.picked = null; M.clearChips(); M.pin(false); M.out(null);
  $('hubOut').hidden = true;
  busy = true; await M.setView('Sverige', 500); busy = false;
  $('hubBody').classList.remove('wide');
  renderHub();
}
$('hubOut').addEventListener('click', hubZoomOut);
$('hubSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.hubMode = b.dataset.v; HUB.picked = null; renderHub(); if (HUB.zoom) MAPS.hub.out(VIEW_LD(HUB.zoom)); });
$('gsteps').addEventListener('click', e => { const b = e.target.closest('.gstep'); if (b) goto('step', b.dataset.step); });

/* ═══════════════════════════════════════════════════════════
   FRÅGORNA (lektionens försök och passet delar dem)
   it = { nr, type:'a'|'b'|'c', sub:'namn'|'nummer' (bara c) }
═══════════════════════════════════════════════════════════ */
const qView = (step, it) => step.id !== 'Sverige' ? step.view : it.type === 'a' ? 'Sverige' : BY[it.nr].landsdel;
const twoStepQ = (step, it) => it.type === 'a' && OVERVIEW(qView(step, it));
function promptHTML(it){
  const N = `<em>${NAME(it.nr)}</em>`;
  if (it.type === 'a') return `Var ligger ${N}?`;
  if (it.type === 'b') return 'Vilket landskap är markerat?';
  return it.sub === 'namn' ? `Vad heter nummer <em>${it.nr}</em>?` : `Vilket nummer har ${N}?`;
}
/* Felalternativen: grannar och samma landsdel (namn), grannarnas nummer och talen intill (nummer). Ordningen lottas (D17). */
function nameOptions(t){
  const near = shuffle(NEAR(t)), same = shuffle(NRS_OF(BY[t].landsdel).filter(n => n !== t && !near.includes(n)));
  const pick = [...near.slice(0, 2), ...same, ...near.slice(2), ...shuffle(ALL)].filter((n, i, a) => n !== t && a.indexOf(n) === i).slice(0, 3);
  return shuffle([t, ...pick]).map(n => ({ nr:n, ok:n === t, text:NAME(n) }));
}
function numberOptions(t){
  /* Hur många alternativ som ligger under och över lottas också, så att storleksordningen inte avslöjar svaret */
  const pool = [...shuffle(NEAR(t)), ...shuffle([t - 1, t + 1, t - 2, t + 2, t - 3, t + 3])].filter((n, i, a) => n >= 1 && n <= 25 && n !== t && a.indexOf(n) === i);
  const lo = pool.filter(n => n < t), hi = pool.filter(n => n > t);
  const nLo = Math.max(0, Math.min(lo.length, 3 - hi.length, Math.floor(Math.random() * 4))), nHi = 3 - Math.min(nLo, lo.length);
  const pick = [...lo.slice(0, nLo), ...hi.slice(0, nHi)];
  while (pick.length < 3){ const n = [...lo, ...hi].find(x => !pick.includes(x)); if (n === undefined) break; pick.push(n); }
  return shuffle([t, ...pick]).map(n => ({ nr:n, ok:n === t, text:String(n) }));
}
/* Ritar frågan på en scen C = { map, prompt, ctrl, out, step, onAnswer(ok, given) } */
function showQuestion(C, it){

  M.reset();
  M.setView(view);
  M.out(view === 'Sverige' ? null : view);
  $(C.prompt).innerHTML = promptHTML(it);
  $(C.out).hidden = true;
  C.opts = null;
  $(C.ctrl).className = 'ctrl'; $(C.ctrl).innerHTML = '';
  if (it.type === 'a'){
    M.onTap = (nr, p) => {
      if (nr === null || C.locked || C.zooming) return;
      if (OVERVIEW(M.view)){                                         // översikt: trycket zoomar, nästa tryck svarar
        const v = zoomTarget(M.view, nr, p);
        C.zooming = true; M.out(VIEW_LD(v));
        M.setView(v, 600).then(() => { C.zooming = false; M.showHalo(S.halo); });
        $(C.out).hidden = false; $(C.out).innerHTML = `${svg('zoomout')}${C.startView === 'Sverige' ? 'Hela kartan' : 'Hela Norrland'}`;
        if (C.onZoom) C.onZoom(v);
        return;
      }
      C.locked = true;
      const ok = nr === it.nr;
      M.fx(nr, ok ? 'ok' : 'bad');
      M.chip(nr, label(nr), ok ? 'ok' : 'bad');
      C.onAnswer(ok, nr);
    };
  } else {
    if (it.type === 'b') M.fx(it.nr, 'mark');
    if (it.type === 'c' && it.sub === 'namn'){ M.nums(M.visibleNrs()); M.ring(it.nr); }
    C.opts = it.type === 'c' && it.sub === 'nummer' ? numberOptions(it.nr) : nameOptions(it.nr);
    $(C.ctrl).innerHTML = `<div class="opts${it.type === 'c' && it.sub === 'nummer' ? ' nums' : ''}">${C.opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.text)}</button>`).join('')}</div>`;
  }
  C.locked = false; C.zooming = false; C.startView = view;
  M.showHalo(S.halo);
}
function optClick(C, i, el){
  if (C.locked || !C.opts) return;
  const o = C.opts[i]; if (!o) return;
  C.locked = true;
  $(C.ctrl).querySelectorAll('.opt').forEach(b => b.disabled = true);
  el.classList.add(o.ok ? 'ok' : 'bad');
  if (!o.ok){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  if (C.map.visibleNrs().includes(o.nr)){ C.map.unfx(o.nr, 'mark'); C.map.fx(o.nr, o.ok ? 'ok' : 'bad'); C.map.chip(o.nr, label(o.nr), o.ok ? 'ok' : 'bad', { below:C.it.type === 'c' && C.it.sub === 'namn' }); }
  C.onAnswer(o.ok, o.nr);
}
async function zoomBackOut(C){
  const M = C.map; if (M.view === C.startView || C.locked || C.zooming) return;
  M.out(VIEW_LD(C.startView)); $(C.out).hidden = true;
  C.zooming = true; await M.setView(C.startView, 500); C.zooming = false;
  if (C.onZoom) C.onZoom(null);
}

/* ── Förklaringen: rätt landskap blinkar, en granne nämns som referens ── */
const NEAR_LEAD = 'Nästan rätt! Bra försök, låt mig visa!';
const FAR_LEAD = 'Bra försök! Låt mig visa.';
const PRAISE = ['Snyggt!', 'Helt rätt!', 'Rätt!', 'Bra hittat!'];
const praise = i => PRAISE[((i % PRAISE.length) + PRAISE.length) % PRAISE.length];
function nearText(g, t){
  if ([22, 23].includes(g) && [22, 23].includes(t)) return `${NAME(g)} är också en ö.`;
  if ((g === 21 && t === 23) || (g === 23 && t === 21)) return `${NAME(g)} ligger tätt intill ${NAME(t)}.`;
  return `${NAME(g)} är granne med ${NAME(t)}.`;
}
function hereText(it){
  const N = NAME(it.nr);
  if (it.type === 'a') return `${N} är här.`;
  if (it.type === 'b') return `Det markerade landskapet är ${N}.`;
  return it.sub === 'namn' ? `Nummer ${it.nr} är ${N}.` : `${N} har nummer ${it.nr}.`;
}
/* Stegen: [{ text, acts }]. confirm = den bekräftande förklaringen efter rätt svar i lektionen. */
function explainSteps(it, given, confirm = false){
  const t = it.nr, cue = CUE[t], out = [];
  const cueStep = { text:cue.text, acts:[...cue.ref.map(n => ({ do:'ref', nr:n })), ...(cue.lakes ? [{ do:'lakes' }] : [])] };
  if (confirm) return [cueStep];
  if (given && given !== t && isNear(t, given)) out.push({ text:nearText(given, t), acts:[{ do:'badchip', nr:given }] });
  out.push({ text:hereText(it), acts:[{ do:'here', nr:t, below:it.type === 'c' && it.sub === 'namn' }], done:true });
  out.push(cueStep);
  return out;
}

/* Akterna på kartan (lektionen och förklaringen) */
async function act(M, x, tok){
  if (tok !== token) return;
  switch (x.do){
    case 'view':   M.out(x.out === undefined ? (x.v === 'Sverige' ? null : x.v) : x.out); await M.setView(x.v, x.ms === undefined ? 700 : x.ms); return;
    case 'out':    M.out(x.ld); return;
    case 'ldchips': M.clearChips(); for (const ld of x.lds){ M.chip(LD_CHIP[ld], ld, 'ld'); await wait(260); } return;
    case 'clear':  M.clearChips(); M.clearFx(); M.pin(false); return;
    case 'pale':   M.pale(x.nrs, true); return;
    case 'lit': {
      for (const c of M.chips.filter(c => c.nr && c.kind === 'def')) M.unchip(c.nr);
      M.unfx(x.nr, 'lit'); gFxLitClear(M);
      M.pale([x.nr], false); M.num(x.nr, true); M.fx(x.nr, 'lit');
      M.chip(x.nr, label(x.nr), 'def', { below:true });
      await wait(300); return;
    }
    case 'litall': M.clearChips(); M.clearFx(); M.pale(x.nrs, false); M.nums(x.nrs); return;
    case 'nums': {
      if (!x.seq || RM()){ M.nums(x.nrs); return; }
      M.nums([]);
      for (let i = 0; i < x.nrs.length; i++){ if (tok !== token) return; M.num(x.nrs[i], true); await wait(90); }
      return;
    }
    case 'chip':   M.chip(x.nr, label(x.nr), x.kind || 'def', { below:true }); await wait(250); return;
    case 'pchip':  M.chip(x.nr, label(x.nr), 'pale', { below:true }); return;
    case 'pin':    M.pin(true); M.chip({ x:MEAS.sundsvall.x, y:MEAS.sundsvall.y }, 'Sundsvall', 'def', { dy:-40 }); await wait(400); return;
    case 'lakes':  for (const l of LAKES) M.chip({ x:l.x, y:l.y }, l.text, 'lake'); return;
    case 'here':   M.protect.add(x.nr); M.fx(x.nr, 'blink'); M.chip(x.nr, label(x.nr), 'ok', { below:!!x.below }); await wait(RM() ? 0 : 1300); return;
    case 'badchip': M.chip(x.nr, label(x.nr), 'bad'); await wait(250); return;
    case 'ref':    M.fx(x.nr, 'ref'); M.chip(x.nr, label(x.nr), 'ref'); await wait(350); return;
  }
}
function gFxLitClear(M){ M.el.querySelectorAll('.fx-lit').forEach(p => p.remove()); }
async function runActs(M, acts, tok){ for (const x of acts){ if (tok !== token) return; await act(M, x, tok); } }

function lessonRefresh(){
  if (!LS) return;
  const m = $('lMain'), P = LS.phase, E = LS.E, moreTries = LS.ti < LS.tries.length - 1;
  let lab = 'Nästa steg', icon = 'next', show = true, before = false;

  if (P === 'q') show = false;

    case 'exp':  if (E.i < E.steps.length - 1) tryExplainStep(E.i + 1); else startTry(LS.ti, true); return;
    case 'conf': if (E.i < E.steps.length - 1){ tryExplainStep(E.i + 1); return; }   // sista steget: vidare som efter 'ok2'

function startTry(j, again = false){

function tryAnswered(ok, given){

  else { LS.phase = 'exp'; LS.lead = isNear(LS.it.nr, given) ? NEAR_LEAD : FAR_LEAD; LS.good = false; LS.E = { steps:explainSteps(LS.it, given), i:-1 }; }
  tryExplainStep(0);

/* ═══════════════════════════════════════════════════════════
   ÖVA: övningspasset med varv, nötloop och kvitto (D12)
   Varven = frågetyperna som är på. En landsdel: alla dess landskap i varje varv (som Klockans steg).
   Hela Sverige: tio landskap per varv, valda ur lådorna: övar först, sedan "dags igen", nya och sist de man kan.
   PS.phase: 'q' · 'right' (går vidare själv) · 'explain' · 'explained' (Svara igen) · 'between'
═══════════════════════════════════════════════════════════ */
const SVERIGE_PER_ROUND = 10;
const RANK = { ovar:0, due:1, ny:2, kan:3 };
function pickItems(step){
  const day = today();
  if (step.id !== 'Sverige') return step.nrs.slice();
  return step.nrs.map(n => ({ n, r:RANK[SP.vis(box(n), day)] + Math.random() * 0.9 })).sort((a, b) => a.r - b.r).slice(0, SVERIGE_PER_ROUND).map(x => x.n);
}
function buildRounds(step){
  const types = ['a', 'b', 'c'].filter(t => S.types[t]);
  return types.map(type => {
    const nrs = shuffle(pickItems(step)), subs = shuffle(nrs.map((_, i) => i % 2 ? 'nummer' : 'namn'));
    return { type, items:nrs.map((nr, i) => ({ nr, type, sub:type === 'c' ? subs[i] : null })) };
  });
}
let PS = null;
function enterPass(stepId){
  const s = stepById(stepId); S.step = stepId;
  setHeader(s.name, 'Avbryt');
  PS = { s, rounds:buildRounds(s), ri:0, drill:null, phase:'q', res:[], start:Date.now(), E:null, lead:null, pr:0, justFixed:false, cur:null,
         C:{ map:MAPS.pass, prompt:'pPrompt', ctrl:'pCtrl', out:'pOut', step:s, onAnswer:answered, onZoom:v => zoomSay('pBubble', v, 'Sedan på landskapet.') } };
  startRound(0);
}
function startRound(i){ PS.ri = i; PS.drill = createDrill(PS.rounds[i].items); PS.justFixed = false; nextQ(true); }
function renderTrack(){
  const p = PS.drill.progress(), done = PS.phase === 'between';
  $('psL').innerHTML = `Varv <b>${PS.ri + 1}</b> av ${PS.rounds.length} · ${RNAME[PS.rounds[PS.ri].type]}`;
  $('psR').innerHTML = PS.rounds.map((r, k) => `<i class="rp${k < PS.ri || (k === PS.ri && done) ? ' ok' : k === PS.ri ? ' cur' : ''}"></i>`).join('');
  $('psFill').style.transform = `scaleX(${done ? 1 : p.total ? p.done / p.total : 0})`;
}
function setMain(lab, icon, show = true, after = true){
  const m = $('pMain'); m.style.visibility = show ? '' : 'hidden';
  m.innerHTML = after ? `${lab} ${icon ? svg(icon) : ''}` : `${icon ? svg(icon) : ''} ${lab}`;
  m.disabled = busy;
}
function nextQ(first = false){
  if (!PS || S.screen !== 'pass') return;
  if (PS.drill.isDone()){ roundDone(); return; }
  const cur = PS.drill.current(); PS.cur = cur; PS.phase = 'q'; PS.E = null; busy = false;
  $('pBetween').hidden = true; $('passMap').style.display = ''; $('pStage').classList.remove('ok');
  $('pTag').className = 'qtag' + (cur.retry || cur.extra ? ' on' : ''); $('pTag').textContent = cur.retry ? 'En gång till' : cur.extra ? 'Tillbaka igen' : '';
  renderTrack();
  showQuestion(PS.C, cur);
  setMain('', null, false);
  const twoStep = twoStepQ(PS.s, cur);
  const main = cur.retry ? 'Samma fråga en gång till.' : cur.extra ? 'Den här frågan kommer tillbaka en gång till.'
    : cur.type === 'a' ? (twoStep ? 'Tryck först ungefär där det ligger.' : 'Tryck på landskapet på kartan.') : 'Vilket svar stämmer?';
  say('pBubble', main, first ? RINTRO[cur.type] : twoStep ? (cur.retry || cur.extra ? ZOOM_HINT : 'Sedan på landskapet.') : '');
}
function rightText(it){
  const p = praise(PS.pr++), N = NAME(it.nr);
  if (it.type === 'c') return it.sub === 'namn' ? `${p} Nummer ${it.nr} är ${N}.` : `${p} ${N} har nummer ${it.nr}.`;
  return `${p} Det är ${N}.`;
}
function answered(ok, given){
  const cur = PS.cur, res = PS.drill.answer(ok);
  if (res.record) recordAnswer(cur.nr, ok);                 // bara första försöket räknas
  if (ok){
    PS.phase = 'right'; $('pStage').classList.add('ok');
    say('pBubble', cur.retry && PS.justFixed ? 'Rätt! Den frågan kommer tillbaka en gång till i varvet.' : rightText(cur));
    PS.justFixed = false;
    renderTrack();
    const tok = token;
    setTimeout(() => { if (tok === token && PS && PS.phase === 'right') nextQ(); }, cur.retry ? 1600 : 1100);
    return;
  }
  PS.justFixed = res.insertedAt !== null || PS.justFixed;
  PS.phase = 'explain';
  PS.E = { steps:explainSteps(cur, given), i:-1 };
  PS.lead = isNear(cur.nr, given) ? NEAR_LEAD : FAR_LEAD;
  renderTrack();
  explainStep(0);
}
async function explainStep(k){
  const tok = token, E = PS.E, st = E.steps[k];
  E.i = k; busy = true; setMain('Nästa steg', 'next');
  say('pBubble', esc(st.text), '', { lead:k === 0 ? PS.lead : null });
  await wait(LEAD);
  if (tok !== token) return;
  if (k === 0) $('pCtrl').classList.add('exp');
  await runActs(MAPS.pass, st.acts, tok);
  if (tok !== token) return;
  if (st.done && PS.C.opts){ const b = $('pCtrl').querySelectorAll('.opt')[PS.C.opts.findIndex(o => o.ok)]; if (b) b.classList.add('ok'); }
  busy = false;
  if (k >= E.steps.length - 1){ PS.phase = 'explained'; setMain('Svara igen', 'again', true, false); }
  else setMain('Nästa steg', 'next');
}
function passMain(){
  if (!PS || busy) return;
  if (PS.phase === 'explain'){ if (PS.E.i < PS.E.steps.length - 1) explainStep(PS.E.i + 1); return; }
  if (PS.phase === 'explained'){ nextQ(); return; }
  if (PS.phase === 'between'){ startRound(PS.ri + 1); return; }
}
function roundDone(){
  const st = PS.drill.stats();
  PS.res.push({ type:PS.rounds[PS.ri].type, asked:st.asked, firstOk:st.firstOk, wrongFirst:st.wrongFirst });
  if (PS.ri >= PS.rounds.length - 1){ finishPass(); return; }
  PS.phase = 'between'; renderTrack();
  const nxt = PS.rounds[PS.ri + 1].type;
  $('pPrompt').innerHTML = ''; $('pTag').className = 'qtag'; $('pOut').hidden = true;
  $('passMap').style.display = 'none'; $('pCtrl').innerHTML = '';
  $('pBetween').hidden = false;
  $('pBetween').innerHTML = `<span class="okc">${svg('check')}</span><b>Varv ${PS.ri + 1} klart!</b><span>Nästa: ${RNAME[nxt]}</span>
    <div class="rl">${PS.rounds.map((r, k) => `<span class="${k <= PS.ri ? 'ok' : k === PS.ri + 1 ? 'next' : ''}">${svg(k <= PS.ri ? 'check' : RICON[r.type])}${RNAME[r.type]}</span>`).join('')}</div>`;
  say('pBubble', 'Bra jobbat! Fortsätt när du är redo.', RHELP[nxt]);
  setMain('Fortsätt', 'next');
}
function finishPass(){
  const R0 = receiptFor(PS.res, Date.now() - PS.start);
  PS.receipt = { step:PS.s.id, ...R0, date:new Date().toISOString(), seen:null };
  goto('done');
}
$('pMain').addEventListener('click', passMain);
$('pCtrl').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b && PS && PS.phase === 'q') optClick(PS.C, +b.dataset.i, b); });
$('pOut').addEventListener('click', () => PS && zoomBackOut(PS.C));

/* ── Du är klar! – kvittot till en vuxen (som Klockans) ── */
function enterDone(){
  const e = PS.receipt, s = stepById(e.step);
  setHeader('Övningspass');
  $('dnStar').innerHTML = svg('star'); $('dnPraise').textContent = praiseFor(e.pct);
  $('rc').innerHTML = `
    <div class="rc-top"><span class="rc-k">${svg('repeat')}Övningspass · Geografi</span><span class="rc-when">${(w => w[0].toUpperCase() + w.slice(1))(fmtWhen(e.date))}</span></div>
    <div class="rc-row"><span>Steg</span><b>${s.name}</b></div>
    <div class="rc-rounds">${e.rounds.map((t, k) => `<span class="rcv">${svg('check')}<em>${k + 1}.</em> ${RNAME[t]}</span>`).join('')}</div>
    <div class="rc-row"><span>Rätt på första försöket</span><b>${e.correct} av ${e.total}</b></div>
    <div class="rc-row"><span>Fel som rättades</span><b>${e.fixed}</b></div>
    <div class="rc-row"><span>Tid</span><b>${durTxt(e.secs)}</b></div>
    <div class="rc-foot"><span class="slot-ph" id="rcPh">Plats för en vuxens stämpel</span><div class="stamp" id="rcStamp"></div></div>`;
  $('dnAsk').textContent = 'Visa kvittot för en vuxen.';
  const h = $('hold'); h.disabled = false; h.className = 'hold';
  h.innerHTML = `<i class="hold-fill"></i><span class="hold-t">${svg('hand')}Håll inne: Sett av en vuxen</span>`;
  $('dnHub').innerHTML = `${svg('stairs')} Till trappan`;
}
let holdBound = false;
function bindReceiptHold(){
  if (holdBound) return; holdBound = true;
  bindHold($('hold'), { ms:1500, canStart:() => !!(PS && PS.receipt && !PS.receipt.seen), onDone:stampReceipt });
}
function stampReceipt(){
  if (!PS || !PS.receipt || PS.receipt.seen) return;
  const iso = new Date().toISOString(); PS.receipt.seen = iso;
  $('rcStamp').innerHTML = `<span class="st-in">${svg('check')}<span class="st-tx"><b>Sett av en vuxen</b><small>${fmtStamp(iso)}</small></span></span>`;
  $('rcStamp').classList.add('on'); $('rcPh').classList.add('off');
  const h = $('hold'); h.classList.add('done'); h.disabled = true; h.innerHTML = `<span class="hold-t">${svg('check')}Kvittot är stämplat</span>`;
  $('dnAsk').textContent = 'Snyggt! Nu finns kvittot i loggen.';
}
$('dnHub').addEventListener('click', () => goto('hub'));

/* ═══════════════════════════════════════════════════════════
   START
═══════════════════════════════════════════════════════════ */
measure();
VIEWS = { Sverige:[0, 0, 512, 1179], Norrland:unionBox(NRS_OF('Norrland')), Svealand:unionBox(NRS_OF('Svealand')), Götaland:unionBox(NRS_OF('Götaland')),
  'Norrland-N':unionBox([1, 2, 3]), 'Norrland-S':unionBox([4, 5, 6, 7, 8, 10]) };
MAPS.hub = GeoMap($('hubMap'));
MAPS.step = GeoMap($('stepMap'));
MAPS.lesson = GeoMap($('lessonMap'));
MAPS.pass = GeoMap($('passMap'));
bindReceiptHold();

/* ═══════════════════════════════════════════════════════════
   window.MOCK — tillstånd och hjälpare för test
═══════════════════════════════════════════════════════════ */
/* Tryck på ett landskap där barnet skulle trycka: i siffrans punkt, i skärmkoordinater (riktig träffberäkning) */
function tapAt(mapKey, cx, cy){
  const M = MAPS[mapKey], t = document.elementFromPoint(cx, cy) || M.el;
  t.dispatchEvent(new MouseEvent('click', { bubbles:true, clientX:cx, clientY:cy, detail:1 }));
}
function tap(mapKey, nr){
  const M = MAPS[mapKey], L = MEAS[nr].label, p = M.toScreen(L.x, L.y);
  tapAt(mapKey, p.x, p.y);
  return p;
}
/* Träffytan i px, mätt med samma träffberäkning som trycken (rutnät med steg 2 px över kartans ruta):
   disc = diametern på den största cirkel som ryms helt i landskapets träffyta (fingrets kontaktyta),
   square = sidan på den största axelparallella kvadrat som ryms helt i träffytan. */
function hitReport(mapKey, step = 2){
  const M = MAPS[mapKey], r = M.el.getBoundingClientRect();
  const W = Math.floor(r.width / step), H = Math.floor(r.height / step), grid = new Int16Array(W * H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) grid[j * W + i] = M.hit(r.left + i * step + step / 2, r.top + j * step + step / 2) || 0;
  const sq = {}, dp = new Int16Array(W * H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){
    const v = grid[j * W + i]; if (!v){ dp[j * W + i] = 0; continue; }
    const up = j && grid[(j - 1) * W + i] === v ? dp[(j - 1) * W + i] : 0, lf = i && grid[j * W + i - 1] === v ? dp[j * W + i - 1] : 0, ul = i && j && grid[(j - 1) * W + i - 1] === v ? dp[(j - 1) * W + i - 1] : 0;
    const d = 1 + Math.min(up, lf, ul); dp[j * W + i] = d; if (!sq[v] || d > sq[v]) sq[v] = d;
  }
  /* avståndet till närmaste cell utanför träffytan (exakt euklidiskt, via kantcellerna) */
  const disc = {};
  for (const n of M.visibleNrs()){
    const edge = [];
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){ if (grid[j * W + i] !== n) continue;
      const out = (a, b) => a < 0 || b < 0 || a >= W || b >= H || grid[b * W + a] !== n;
      if (out(i - 1, j) || out(i + 1, j) || out(i, j - 1) || out(i, j + 1)) edge.push(i, j); }
    let best = 0;
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){ if (grid[j * W + i] !== n) continue;
      let m = Infinity; for (let e = 0; e < edge.length; e += 2){ const dx = edge[e] - i, dy = edge[e + 1] - j, d = dx * dx + dy * dy; if (d < m) m = d; }
      if (m > best) best = m; }
    disc[n] = (2 * Math.sqrt(best) + 1) * step;
  }
  const out = {};
  for (const n of M.visibleNrs()) out[n] = { name:NAME(n), disc:+(disc[n] || 0).toFixed(0), square:(sq[n] || 0) * step, small:M.smallNrs().includes(n), widthPx:+(2 * MEAS[n].r * M.k).toFixed(1) };
  return { view:M.view, k:+M.k.toFixed(3), out };
}
function allTexts(){
  const t = [];
  for (const id in LESSONS) for (const st of LESSONS[id]) t.push(st.text);
  for (const n of ALL){ t.push(CUE[n].text); for (const g of NEAR(n)) t.push(nearText(g, n));
    for (const it of [{ nr:n, type:'a' }, { nr:n, type:'b' }, { nr:n, type:'c', sub:'namn' }, { nr:n, type:'c', sub:'nummer' }]){ t.push(hereText(it), promptHTML(it).replace(/<[^>]+>/g, '')); } }
  t.push(NEAR_LEAD, FAR_LEAD, ...PRAISE, RETRY_OK, LESSON_END, TRY_HEAD, ...Object.values(RHELP), ...Object.values(RNAME));
  return [...new Set(t)];
}
window.MOCK = {
  S, LANDSKAP, NB, NEAR, isNear, CUE, STEPS, MEAS, MAPS, VIEWS, LESSONS, LESSON_TRIES,
  goto, applyPreset, stepMedal, box, today, tap, tapAt, hitReport, allTexts, nameOptions, numberOptions, explainSteps, buildRounds,
  startTry:j => startTry(j), get pass(){ return PS; }, get lesson(){ return LS; }, get busy(){ return busy; }, get hub(){ return HUB; },
  /* Svara på frågan som visas: rätt, eller fel (en granne om möjligt, annars ett landskap långt bort) */
  async answer(ok, prefer = 'near'){
    const C = S.screen === 'pass' ? PS && PS.C : LS && LS.C, it = S.screen === 'pass' ? PS && PS.cur : LS && LS.it;
    if (!C || !it) return null;
    let want = it.nr;
    const nearIn = list => NEAR(it.nr).filter(n => list.includes(n)), farIn = list => list.filter(n => n !== it.nr && !NEAR(it.nr).includes(n));
    if (C.opts){
      const os = C.opts.map(o => o.nr);
      if (!ok) want = prefer === 'near' && nearIn(os).length ? nearIn(os)[0] : farIn(os).length ? farIn(os)[0] : nearIn(os)[0];
      const i = C.opts.findIndex(o => o.nr === want); $(C.ctrl).querySelectorAll('.opt')[i].click(); return want;
    }
    const key = S.screen === 'pass' ? 'pass' : 'lesson';
    for (let i = 0; i < 3 && OVERVIEW(C.map.view); i++){ tap(key, it.nr); await wait(900); }   // översikt: först zoomar trycket
    if (!ok){ const vis = C.map.visibleNrs(); want = prefer === 'near' && nearIn(vis).length ? nearIn(vis)[0] : farIn(vis).length ? farIn(vis)[0] : nearIn(vis)[0]; }
    tap(key, want);
    return want;
  },
};

applyPreset('ny');
