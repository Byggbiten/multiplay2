<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Geografi — mockup (Sverige, Sveriges landskap)</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ── Tokens ur styles/app.css. Geografin har ett eget modultema (havsgrönt), samma komponenter ── */
:root{
  --font-head:'Baloo 2',cursive; --font-body:'Nunito',sans-serif;
  --ink:#3b1d6e; --ink-soft:#6d5a96;
  --accent:#0f8b8d; --accent-light:#4fc3c4; --deep:#134e4a; --glow:rgba(79,195,196,.42); --tint:#e8f8f7;
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.88); --glass-line:rgba(255,255,255,.9);
  --shadow-panel:0 10px 34px rgba(93,63,158,.10),0 2px 6px rgba(93,63,158,.06);
  --radius-md:18px; --radius-lg:24px;
  --spring:cubic-bezier(.34,1.3,.4,1); --smooth:cubic-bezier(.4,0,.2,1); --sheet:cubic-bezier(.2,.9,.25,1);
  --kan:#2fbf68; --due:#bfead0; --ovar:#fbbf24;          /* lådorna (samma som Gångertabellen och Klockan) */
  --fog:#c9d1dd;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%}
html{touch-action:pan-x pan-y}
body{font-family:var(--font-body);color:var(--ink);overflow:hidden;touch-action:pan-x pan-y;   /* ingen sidzoom: varken nyp eller dubbeltryck */
  
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;
  background:linear-gradient(160deg,#fdf4ff 0%,#fce7f3 34%,#eff6ff 68%,#f0fdf4 100%);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
a{color:var(--accent)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.app{width:390px;height:844px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:4px 10px 8px;overflow:hidden;position:relative}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:46px;flex-shrink:0;gap:6px}
.btn-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 16px 8px 12px;border-radius:999px;
  background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--shadow-panel);color:var(--deep);font-weight:800;font-size:14px;flex-shrink:0}
.btn-back svg{width:18px;height:18px}
.btn-back.ghost{visibility:hidden}
.title{font-family:var(--font-head);font-weight:700;font-size:21px;color:var(--deep);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-r{width:52px;display:flex;justify-content:flex-end;flex-shrink:0}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft);background:transparent}
.ibtn svg.i{width:21px;height:21px;stroke-width:2}
.ibtn:active{background:rgba(19,78,74,.08)}

/* Labbreglage (inte app-UI: dämpade) */
.labbox{flex-shrink:0;display:flex;flex-direction:column;gap:3px;padding:2px 4px 5px;border-bottom:1.5px dashed rgba(59,29,110,.18)}
.trow{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ink-soft);white-space:nowrap}
.trow .sp1{flex:1}
.tg{display:flex;gap:2px;background:rgba(255,255,255,.6);border-radius:999px;padding:2px}
.tg button{min-height:24px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
.tg button.on{background:var(--ink);color:#fff}
.lbtn{min-height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;color:var(--ink-soft);background:rgba(255,255,255,.6);display:inline-flex;align-items:center;gap:4px}
.lbtn svg{width:13px;height:13px}
.labstat{flex:1;min-width:0;text-align:right;white-space:nowrap;font-size:11px;font-weight:700;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis}
.labstat b{font-weight:900;color:var(--ink)}
.labtag{display:inline-block;font-size:9.5px;letter-spacing:.08em;font-weight:900;padding:0 5px;border-radius:4px;background:rgba(59,29,110,.1);margin-right:4px;line-height:14px}

/* Skärmar */
.screens{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:6px}
.screen.on{display:flex;animation:scrin .3s var(--smooth) both}
.card{background:var(--glass-strong);border-radius:var(--radius-lg);border:1px solid var(--glass-line);box-shadow:var(--shadow-panel)}
.grow{flex:1;min-height:0}

/* Knappar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;
  font-size:16px;font-weight:800;line-height:1;white-space:nowrap;width:100%;
  transition:transform .25s var(--spring),box-shadow .25s var(--smooth),opacity .15s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;box-shadow:0 8px 22px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-sec{background:var(--glass-strong);border:1.5px solid color-mix(in srgb,var(--accent) 28%,transparent);color:var(--deep);box-shadow:var(--shadow-panel)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.42;box-shadow:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.slot{height:52px;flex-shrink:0;display:flex;gap:8px}

/* Bubblan — fast höjd */
.bubble{flex-shrink:0;display:flex}
.b60{height:60px}.b92{height:92px}.b122{height:128px}
.thought{flex:1;background:#fff;border-radius:var(--radius-md);padding:7px 14px;box-shadow:var(--shadow-panel);font-weight:800;color:var(--ink);
  font-size:15px;line-height:1.3;border:2px solid color-mix(in srgb,var(--accent) 18%,transparent);display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden}
.thought.pop{animation:bubblein .3s var(--spring)}
.thought .sm{font-size:13px;color:#64748b;font-weight:800}
.thought .lead{font-size:15px;font-weight:900;color:#b45309}
.thought .lead.good{color:#15803d}
.thought .fact{font-size:12.5px;color:var(--deep);font-weight:800;display:flex;gap:4px;align-items:flex-start}
.thought .fact svg.i{width:14px;height:14px;margin-top:2px;color:var(--accent)}

/* Segmentväljare */
.seg{display:flex;gap:2px;background:rgba(19,78,74,.07);border-radius:999px;padding:3px}
.seg button{flex:1;min-height:44px;padding:0 8px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button svg{width:16px;height:16px}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 2px 8px rgba(19,78,74,.16)}
.flabel{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:0 6px}

/* ── Kartan ─────────────────────────────── */
.mapbox{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:18px;background:linear-gradient(180deg,#eaf6fb,#dff1f7)}
.gm{position:absolute;inset:0;width:100%;height:100%;display:block;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.gm:active{cursor:grabbing}
.gm.static{cursor:default}
.gm path.ls{fill:var(--f);stroke:rgba(40,40,40,.55);stroke-width:.9px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .45s var(--smooth),opacity .45s var(--smooth)}
.gm path.ls.out{opacity:.34}
.gm path.ls.fog{fill:var(--fog);stroke:rgba(255,255,255,.75);stroke-width:1.2px}
.gm path.ls.slot{fill:#e9eef5;stroke:#e9eef5;stroke-width:1.8px}
.gm path.ls.ctx{fill:none;stroke:#e2e8f0}
.gm .outl{fill:none;stroke:#64748b;stroke-width:5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.gm path.ls.placed{fill:var(--f);stroke:rgba(40,40,40,.55);stroke-dasharray:none}
.gm path.ls.res-ok{fill:#86efac;stroke:#15803d}
.gm path.ls.res-bad{fill:#fde68a;stroke:#b45309}
.gm path.ls.dim{fill:#f1f5f9;stroke:#cbd5e1}
.gm[data-boxes] path.ls[data-b="ny"]{fill:#fff}
.gm[data-boxes] path.ls[data-b="ovar"]{fill:var(--ovar)}
.gm[data-boxes] path.ls[data-b="kan"]{fill:var(--kan)}
.gm[data-boxes] path.ls[data-b="due"]{fill:var(--due)}
.gm .fx{pointer-events:none;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.gm .fx-bad{fill:rgba(239,68,68,.45);stroke:#dc2626;stroke-width:2.5px}
.gm .fx-ok{fill:rgba(34,197,94,.42);stroke:#15803d;stroke-width:2.5px}
.gm .fx-found{fill:none;stroke:#15803d;stroke-width:3px;animation:foundring 1s ease-out both}
.gm .fx-blink{fill:rgba(245,158,11,.6);stroke:#b45309;stroke-width:3px;animation:blink .42s ease-in-out 6 alternate}
.gm .fx-mark{fill:rgba(15,139,141,.34);stroke:var(--deep);stroke-width:3px;animation:markpulse 1.4s ease-in-out infinite}
.gm .fx-ref{fill:rgba(15,139,141,.14);stroke:var(--accent);stroke-width:2.2px;stroke-dasharray:6 4}
.gm .fx-sel{fill:rgba(255,255,255,.18);stroke:var(--deep);stroke-width:3px}
.gm .fx-halo{fill:rgba(147,51,234,.14);stroke:rgba(147,51,234,.22);stroke-linejoin:round}
.gm .disc{fill:rgba(147,51,234,.16);stroke:rgba(147,51,234,.7);stroke-width:1.5px;stroke-dasharray:4 3;pointer-events:none}
.gm .lab{pointer-events:none}
.gm .lab text{font-family:var(--font-head);font-weight:800;font-size:12.5px;fill:#1f2937;stroke:#fff;stroke-width:3px;paint-order:stroke;text-anchor:middle;dominant-baseline:central}
.gm .lab.found text{fill:#14532d}
.gm .chip{pointer-events:none}
.gm .chip rect{fill:var(--deep)}
.gm .chip text{font-family:var(--font-body);font-weight:900;font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.gm .chip.k-ok rect{fill:#15803d}
.gm .chip.k-bad rect{fill:#dc2626}
.gm .chip.k-ref rect{fill:#fff;stroke:var(--accent);stroke-width:1.5px}
.gm .chip.k-ref text{fill:var(--deep)}
.gm .chip.k-home rect{fill:#dc2626}
.gm .chip.k-lake rect{fill:none}
.gm .chip.k-lake text{fill:#0369a1;font-style:italic;font-size:11.5px}
.gm .chip .in{transform-box:fill-box;transform-origin:center;animation:chipin .4s var(--spring) both}
.gm .pin .in{animation:pindrop .5s var(--spring) both}
.gm .ripple{fill:rgba(15,139,141,.22);stroke:rgba(15,139,141,.5);stroke-width:1.5px;pointer-events:none;animation:ripple .38s ease-out both;transform-box:fill-box;transform-origin:center}
.mapbtn{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(19,78,74,.18);display:grid;place-items:center;color:var(--deep);z-index:2}
.mapbtn svg.i{width:20px;height:20px}
.maphint{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:2;pointer-events:none;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800;color:var(--deep);white-space:nowrap;box-shadow:0 2px 8px rgba(19,78,74,.12)}
.toast{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 16px);top:8px;z-index:3;pointer-events:none;background:#fff7ed;border:2px solid #fbbf24;border-radius:16px;padding:5px 12px 5px 8px;font-size:13px;font-weight:900;color:#92400e;display:flex;align-items:center;gap:6px;animation:chipin .45s var(--spring) both}
.toast svg.i{width:18px;height:18px;color:#d97706}

/* ── Geografi-menyn ────────────────────── */
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-height:0;grid-auto-rows:1fr}
.gtile{position:relative;border-radius:20px;background:var(--glass-strong);border:1.5px solid rgba(255,255,255,.95);box-shadow:var(--shadow-panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 6px;color:var(--ink-soft);transition:transform .2s var(--spring)}
.gtile:active{transform:scale(.96)}
.gtile .gic{width:58px;height:58px;display:grid;place-items:center;color:#94a3b8}
.gtile .gic svg{width:54px;height:54px}
.gtile b{font-family:var(--font-head);font-weight:800;font-size:15.5px;line-height:1.05;text-align:center;color:#64748b}
.gtile .soon{font-size:10.5px;font-weight:900;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:rgba(100,116,139,.12);color:#64748b;white-space:nowrap}
.gtile.open{background:linear-gradient(160deg,#fff,var(--tint));border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--deep)}
.gtile.open b{color:var(--deep)}
.gtile.open .gic{width:80px;height:120px}
.gtile.open .gic svg{width:auto;height:118px}
.gtile.open .soon{background:var(--accent);color:#fff}

/* ── Sverige ───────────────────────────── */
.sv-main{flex:1;min-height:0;display:flex;gap:12px;padding:14px;text-align:left;align-items:stretch;transition:transform .2s var(--spring)}
.sv-main:active{transform:scale(.98)}
.sv-main .mm{flex:0 0 150px;display:flex;align-items:center;justify-content:center}
.sv-main .mm svg{height:100%;max-height:330px;width:auto}
.sv-txt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px}
.sv-txt b{font-family:var(--font-head);font-weight:800;font-size:26px;line-height:1.05;color:var(--deep)}
.sv-txt span{font-weight:800;font-size:14px;color:var(--ink-soft)}
.sv-txt .sv-go{color:#fff}
.sv-go{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:44px;padding:0 16px;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;font-weight:900;font-size:15px;box-shadow:0 6px 16px var(--glow)}
.sv-soon{display:flex;align-items:center;gap:12px;min-height:74px;padding:10px 14px;flex-shrink:0;color:#64748b;text-align:left}
.sv-soon .ic{width:44px;height:44px;border-radius:14px;background:rgba(100,116,139,.1);display:grid;place-items:center;flex-shrink:0}
.sv-soon b{font-family:var(--font-head);font-weight:800;font-size:18px;flex:1}
.sv-soon .soon{font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;background:rgba(100,116,139,.12)}

/* ── Hemvyn (Sveriges landskap) ─────────── */
.hubtop{flex:1;min-height:0;display:flex;gap:8px;padding:10px}
.hubmm{flex:0 0 146px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hubmm .mmw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
.hubmm svg{height:100%;width:auto;max-width:146px}
.hubtop{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(232,248,247,.9)) !important}
.hublegend{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;font-size:11px;font-weight:800;color:var(--ink-soft)}
.hublegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.areas{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.arow{display:flex;align-items:center;gap:8px;min-height:62px;padding:6px 10px;border-radius:16px;background:#fff;border:1.5px solid color-mix(in srgb,var(--accent) 18%,transparent);text-align:left;color:var(--deep);transition:transform .2s var(--spring)}
.arow:active{transform:scale(.97)}
.arow.all{background:linear-gradient(135deg,#fff,var(--tint))}
.arow .amd{position:relative;width:32px;height:32px;flex-shrink:0}
.arow .att{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.arow b{font-family:var(--font-head);font-weight:800;font-size:16.5px;line-height:1.05;white-space:nowrap}
.arow small{font-size:12px;font-weight:800;color:var(--ink-soft);line-height:1.15}
.tb-bar{display:block;height:5px;border-radius:999px;background:rgba(19,78,74,.1);overflow:hidden}
.tb-bar i{display:block;height:100%;border-radius:inherit;background:var(--kan)}
svg.md{display:block;width:100%;height:100%}
.mdue{position:absolute;top:-3px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--due);box-shadow:0 0 0 1.5px #fff,inset 0 0 0 1.5px rgba(47,191,104,.5)}
.doors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;flex-shrink:0}
.door{grid-column:span 3;display:flex;align-items:center;gap:10px;min-height:66px;padding:8px 12px;border-radius:20px;background:var(--glass-strong);border:1.5px solid color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:var(--shadow-panel);color:var(--deep);text-align:left;transition:transform .2s var(--spring)}
.door:active{transform:scale(.96)}
.door .dic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--accent);flex-shrink:0}
.door .dic svg.i{width:22px;height:22px}
.door b{font-family:var(--font-head);font-weight:800;font-size:17px;line-height:1.05}
.door small{display:block;font-size:11.5px;font-weight:800;color:var(--ink-soft);line-height:1.15}

/* ── Utforska + landskapskortet ─────────── */
.sheet{position:absolute;left:0;right:0;bottom:0;height:446px;z-index:5;background:#fff;border-radius:26px 26px 20px 20px;box-shadow:0 -8px 30px rgba(19,78,74,.18);
  transform:translateY(calc(100% + 20px));transition:transform .42s var(--sheet);display:flex;flex-direction:column;padding:0 12px 10px;touch-action:none}
.sheet.on{transform:none}
#scr-explore{overflow:hidden}
.sheet.drag{transition:none}
.sh-grip{height:22px;flex-shrink:0;display:grid;place-items:center;cursor:grab}
.sh-grip i{width:44px;height:5px;border-radius:999px;background:#cbd5e1}
.sh-head{display:flex;align-items:center;gap:8px;min-height:46px;flex-shrink:0}
.sh-ld{width:14px;height:40px;border-radius:7px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sh-name{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
.sh-name b{font-family:var(--font-head);font-weight:800;font-size:25px;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-name small{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.sh-home{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;color:#b91c1c;background:#fee2e2;border-radius:999px;padding:3px 9px;white-space:nowrap}
.sh-home svg.i{width:14px;height:14px}
.sh-x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#f1f5f9;color:#475569;flex-shrink:0}
.sh-row{display:flex;gap:10px;align-items:center;flex-shrink:0;padding:4px 2px 8px}
.sh-shield{width:62px;height:72px;flex-shrink:0;display:grid;place-items:center}
.sh-shield img{max-width:62px;max-height:72px}
.sh-city{flex:1;display:flex;flex-direction:column;gap:2px}
.sh-k{font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:4px}
.sh-k svg.i{width:14px;height:14px}
.sh-city b{font-family:var(--font-head);font-weight:800;font-size:23px;color:var(--deep);line-height:1.05}
.sh-city span{font-size:13.5px;font-weight:800;color:var(--ink-soft)}
.sh-pics{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex-shrink:0}
.pic{border-radius:16px;overflow:hidden;background:#f8fafc;border:1px solid #e2e8f0;display:flex;flex-direction:column}
.pic .im{height:96px;overflow:hidden;background:#eef2f6}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic img.flower{object-position:50% 22%}
.pic .cap{padding:4px 8px 6px;display:flex;flex-direction:column;line-height:1.1}
.pic .cap b{font-family:var(--font-head);font-weight:800;font-size:16.5px;color:var(--deep)}
.sh-know{margin-top:8px;flex:1;min-height:0;border-radius:16px;background:var(--tint);padding:8px 10px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.sh-know .kl{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.25}
.sh-know .kl svg.i{width:16px;height:16px;color:var(--accent);margin-top:1px}
.sh-fact{display:flex;align-items:center;gap:6px;margin-top:auto;border-top:1.5px dashed rgba(19,78,74,.18);padding-top:5px}
.sh-fact p{flex:1;font-size:13.5px;font-weight:800;color:var(--deep);line-height:1.25}
.sh-more{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--accent);flex-shrink:0;box-shadow:0 2px 6px rgba(19,78,74,.12);position:relative}
.sh-more small{position:absolute;bottom:-1px;right:-2px;font-size:10px;font-weight:900;color:var(--ink-soft);background:#fff;border-radius:6px;padding:0 3px}

/* ── Träna <område>: ordningen överst, lägena som stora rutor (ett tryck startar, D30) ── */
.ordrow{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;flex-shrink:0}
.ordrow .flabel{padding:0;flex-shrink:0}
.ordrow .seg{flex:1}
.tmodes{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.tmode{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:10px 14px;border-radius:20px;background:var(--glass-strong);border:2px solid color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:var(--shadow-panel);color:var(--deep);text-align:left;transition:transform .2s var(--spring)}
button.tmode:active{transform:scale(.98)}
.tmode.main{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;border-color:transparent;box-shadow:0 8px 22px var(--glow)}
.tmode .th{display:flex;align-items:center;gap:12px;width:100%}
.tmode .tic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--tint);color:var(--accent);flex-shrink:0}
.tmode.main .tic{background:rgba(255,255,255,.22);color:#fff}
.tmode .tic svg.i{width:24px;height:24px}
.tmode .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tmode b{font-family:var(--font-head);font-weight:800;font-size:19px;line-height:1.05}
.tmode small{font-size:12.5px;font-weight:800;color:var(--ink-soft);line-height:1.2}
.tmode.main small{color:rgba(255,255,255,.9)}
.tmode .go{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center}
.tbtns{display:flex;gap:6px}
.tbtns button{flex:1;min-height:44px;padding:0 6px;border-radius:14px;background:#fff;border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--deep);font-weight:900;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;box-shadow:0 2px 6px rgba(19,78,74,.08)}
.tbtns button:active{transform:scale(.96)}
.tbtns button svg.i{width:15px;height:15px}
/* Pussel: välj område */
.pzpick{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
.pzarea{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:22px;background:var(--glass-strong);border:2px solid color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:var(--shadow-panel);color:var(--deep);transition:transform .2s var(--spring)}
.pzarea:active{transform:scale(.97)}
.pzarea .pv{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.pzarea .pv svg{height:100%;max-height:220px;width:auto;max-width:100%;display:block}
.pzarea{min-height:0;overflow:hidden}
.pzarea b{font-family:var(--font-head);font-weight:800;font-size:19px}
.pzarea small{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
div.pzarea:active{transform:none}
.pzlv{display:flex;flex-direction:column;gap:5px;width:100%}
.pzlv button{min-height:44px;border-radius:14px;background:#fff;border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--deep);font-weight:900;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;box-shadow:0 2px 6px rgba(19,78,74,.08)}
.pzlv button:active{transform:scale(.96)}
.pzlv button svg.i{width:15px;height:15px}
.pzlv button .done{color:#16a34a}
.pzlv button .done svg.i{stroke-width:3.2}
.gm path.ls.slotb{fill:#e9eef5;stroke:#7c8aa0;stroke-width:1.3px}
/* Hemvyn: landsdelskorten är ingången till träning */
.areas .ahead{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:5px;padding:0 4px}
.areas .ahead svg.i{width:15px;height:15px}
.arow .ago{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
.arow .ago svg.i{width:15px;height:15px;stroke-width:2.8}
/* Faktarutan efter rätt svar (D31, D32) */
.fcard{display:grid;grid-template-columns:62px 1fr;column-gap:10px;align-items:center;height:100%}
.fcard .fsh{width:62px;height:74px;object-fit:contain;justify-self:center}
.fcard .ftx{min-width:0;height:100%;display:flex;flex-direction:column;justify-content:space-evenly}
.thought:has(.fcard){padding:4px 10px 3px 8px;justify-content:flex-start}
.fcard .fmain{font-size:14px;line-height:1.1;font-weight:800;color:var(--ink)}
.fcard .fmain .lead{font-size:14px}
.fcard .ftab{display:grid;grid-template-columns:66px 1fr;column-gap:4px;row-gap:1px;align-items:baseline}
.fcard .ftab b{font-weight:900;font-size:13.5px;line-height:1.1;color:var(--deep);min-width:0}
.fcard .ftab .f2{font-weight:800;color:var(--ink-soft)}
.fcard .fl{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.fcard .fl svg.i{width:13px;height:13px}
.fcard .fspec{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:900;color:#92400e;line-height:1.05}
.fcard .fspec svg.i{width:14px;height:14px;fill:#fbbf24;stroke:#b45309;stroke-width:1.5}

/* ── Spela (träning och test) ─────────── */
.track{min-height:44px;flex-shrink:0;padding:6px 14px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.trtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:800;font-size:13px;color:var(--ink-soft);white-space:nowrap}
.trtop b{font-family:var(--font-head);font-size:16px;color:var(--deep)}
.bar{position:relative;height:8px;flex-shrink:0;border-radius:999px;background:rgba(19,78,74,.12);overflow:hidden}
.bar .fill{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-light));transform-origin:left center;transform:scaleX(0);transition:transform .45s var(--smooth)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px;position:relative}
.stage.ok{box-shadow:0 0 0 3px #86efac,var(--shadow-panel)}
.ptop{display:flex;align-items:center;gap:8px;min-height:36px;flex-shrink:0;padding:0 4px}
.prompt{flex:1;min-width:0;font-family:var(--font-head);font-weight:800;color:var(--deep);font-size:20px;line-height:1.12}
.prompt em{font-style:normal;color:var(--accent)}
.qtag{height:22px;padding:0 9px;border-radius:999px;background:var(--tint);color:var(--accent);font-size:11.5px;font-weight:900;display:inline-flex;align-items:center;white-space:nowrap;align-self:flex-start;margin-bottom:2px}
.qfig{flex-shrink:0;width:118px;border-radius:14px;overflow:hidden;background:#fff;border:1.5px solid #e2e8f0;display:flex;flex-direction:column}
.qfig .im{height:78px;overflow:hidden;background:#eef2f6;display:grid;place-items:center}
.qfig img{width:100%;height:100%;object-fit:cover;display:block}
.qfig img.flower{object-position:50% 22%}
.qfig img.shield{object-fit:contain;padding:4px}
.qfig figcaption{font-family:var(--font-head);font-weight:800;font-size:15px;color:var(--deep);text-align:center;padding:1px 4px 3px;line-height:1.15}
.ctrl{flex-shrink:0}
.ctrl:empty{display:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:54px;padding:4px 8px;border-radius:18px;font-family:var(--font-head);font-weight:800;font-size:18px;line-height:1.1;background:var(--glass-strong);color:var(--deep);
  border:2px solid color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:var(--shadow-panel);transition:transform .2s var(--spring),background-color .25s,border-color .25s}
.opt:active{transform:scale(.96)}
.opt.ok{background:#dcfce7;border-color:#22c55e;color:#15803d}
.opt.bad{background:#fee2e2;border-color:#ef4444;color:#b91c1c}
.shake{animation:shake .4s ease-in-out}

/* Slutet: sammanfattning och kvitto */
.dn-head{display:flex;flex-direction:column;align-items:center;text-align:center;flex-shrink:0}
.dn-star{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 8px 20px rgba(245,158,11,.35);animation:pop .6s var(--spring)}
.dn-star svg.i{width:30px;height:30px;fill:#fff;stroke-width:1.6}
.dn-head h2{font-family:var(--font-head);font-weight:800;font-size:28px;color:var(--deep);line-height:1.05;margin:6px 0 0}
.dn-head p{font-weight:800;font-size:14.5px;color:var(--ink-soft);margin:3px 0 0;min-height:20px}
.receipt{display:flex;flex-direction:column;gap:5px;flex-shrink:0;background:#fff !important;padding:10px 12px}
.rc-top{display:flex;flex-direction:column;gap:1px;padding-bottom:6px;border-bottom:1.5px dashed rgba(19,78,74,.2)}
.rc-k{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rc-k svg.i{width:16px;height:16px}
.rc-when{font-weight:800;font-size:14.5px;color:var(--deep)}
.rc-row span{white-space:nowrap}
.rc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;font-weight:700;color:var(--ink-soft)}
.rc-row b{font-family:var(--font-head);font-weight:800;font-size:16.5px;color:var(--deep);text-align:right}
.rc-row b.long{font-size:14px;font-family:var(--font-body);font-weight:900;line-height:1.2}
.rc-foot{position:relative;height:56px;display:grid;place-items:center;border:2px dashed rgba(22,163,74,.35);border-radius:14px;margin-top:2px}
.slot-ph{font-size:13px;font-weight:800;color:rgba(21,128,61,.6);transition:opacity .2s}
.slot-ph.off{opacity:0}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.stamp.on{animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
.st-in{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 10px;border:3px solid #16a34a;border-radius:12px;color:#15803d;transform:rotate(-5deg);background:rgba(240,253,244,.9)}
.st-in svg.i{width:24px;height:24px;stroke-width:3.2}
.st-tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.st-in b{font-size:14.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.st-in small{font-size:12px;font-weight:800}
.dn-ask{text-align:center;font-weight:900;font-size:15px;color:var(--deep);margin:0;flex-shrink:0;min-height:20px}
.hold{position:relative;overflow:hidden;min-height:56px;flex-shrink:0;border-radius:999px;border:2px solid #16a34a;background:#fff;color:#15803d;
  font-weight:900;font-size:16px;touch-action:none}
.hold-fill{position:absolute;inset:0;background:linear-gradient(90deg,#bbf7d0,#4ade80);transform:scaleX(0);transform-origin:left center}
.hold.holding .hold-fill{transform:scaleX(1);transition:transform 1.5s linear}
.hold-t{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.hold.done{background:#dcfce7}
.hold:disabled{opacity:1}
.tdmap{flex:1;min-height:0;padding:6px;display:flex;flex-direction:column;gap:4px}
.tdleg{display:flex;justify-content:center;gap:14px;font-size:12px;font-weight:800;color:var(--ink-soft);flex-shrink:0}
.tdleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sumcard{flex-shrink:0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}

/* ── Pusslet ─────────────────────────── */
.pzboard{flex:1;min-height:0;padding:6px;display:flex}
.pzboard .mapbox{background:linear-gradient(180deg,#f6fbfd,#edf6fa)}
.tray{flex-shrink:0;height:106px;display:flex;align-items:stretch;gap:8px;padding:8px}
.tpiece{flex:1;min-width:0;border-radius:16px;background:#fff;border:1.5px dashed color-mix(in srgb,var(--accent) 35%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:grab;transition:opacity .15s,transform .2s var(--spring)}
.tpiece svg{width:62px;height:62px;overflow:visible;pointer-events:none}
.tpiece .tn{font-family:var(--font-head);font-weight:800;font-size:13.5px;line-height:1;color:var(--deep);white-space:nowrap;pointer-events:none}
.floatpiece .fltag rect{fill:var(--deep)}
.floatpiece .fltag text{font-family:var(--font-body);font-weight:900;font-size:14px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.tpiece svg path{stroke:rgba(40,40,40,.6);stroke-width:1px;vector-effect:non-scaling-stroke}
.tpiece.lift{opacity:.2}
.tpiece.empty{border-style:solid;border-color:transparent;background:rgba(255,255,255,.4)}
.traycount{display:flex;flex-direction:column;align-items:center;justify-content:center;width:54px;flex-shrink:0;font-weight:800;font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.1}
.traycount b{font-family:var(--font-head);font-size:24px;color:var(--deep)}
.floatpiece{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20;overflow:visible}
.floatpiece path{stroke:rgba(30,30,30,.7);stroke-width:1.2px;vector-effect:non-scaling-stroke;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}

/* ── Samlarpärmen ────────────────────── */
.bhead{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:56px}
.bhead b{font-family:var(--font-head);font-weight:800;font-size:22px;color:var(--deep)}
.bhead .bar{flex:1}
.bhead span{font-weight:900;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.bfull{flex-shrink:0;display:flex;align-items:center;gap:8px;justify-content:center;min-height:40px;border-radius:14px;background:linear-gradient(90deg,#fef3c7,#fde68a);color:#92400e;font-weight:900;font-size:14px}
.bfull svg.i{width:18px;height:18px;fill:#f59e0b;stroke:#b45309;stroke-width:1.4}
.binder{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,minmax(88px,1fr));gap:6px;padding:2px}
.bcard{position:relative;border-radius:12px;background:#fff;border:2px solid var(--bc,#e2e8f0);box-shadow:0 3px 8px rgba(19,78,74,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;overflow:hidden;transition:transform .2s var(--spring)}
.bcard:active{transform:scale(.94)}
.bcard img{width:46px;height:54px;object-fit:contain}
.bcard .bn.long{font-size:8.2px}
.bcard .bn{font-size:9px;letter-spacing:-.15px;font-weight:900;color:var(--deep);line-height:1.05;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .bq{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:24px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);padding-bottom:4px}
.bcard.lock{background:repeating-linear-gradient(135deg,#eef1f5 0 6px,#e6eaf0 6px 12px);border-color:#d5dbe3;box-shadow:none}
.bcard.lock svg{width:40px;height:47px}
.bcard.lock{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ld) 35%,#eef1f5) 0 6px,color-mix(in srgb,var(--ld) 22%,#e6eaf0) 6px 12px)}
.bcard.lock svg path:first-child{fill:color-mix(in srgb,var(--ld) 70%,#94a3b8)}
.bcard.fresh{animation:pop .6s var(--spring)}
.bcard.lvl-1{--bc:#c2733a}
.bcard.lvl-2{--bc:#94a3b8;background:linear-gradient(160deg,#fff,#f1f5f9)}
.bcard.lvl-3{--bc:#f59e0b;background:linear-gradient(160deg,#fffbeb,#fef3c7);box-shadow:0 0 0 1px #fcd34d,0 4px 12px rgba(245,158,11,.25)}
.bcard .bmd{position:absolute;top:2px;right:2px;width:20px;height:20px}
.bhead small{font-weight:900;font-size:13px;color:var(--ink-soft);white-space:nowrap}
.blegend{flex-shrink:0;display:flex;justify-content:space-between;gap:4px;padding:0 4px}
.blegend span{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--ink-soft);line-height:1.1}
.blegend i{width:20px;height:20px;flex-shrink:0;display:block}
.bc-lvl{display:flex;gap:10px;align-items:flex-start;border-radius:16px;background:#f8fafc;border:1.5px solid #e2e8f0;padding:8px 10px}
.bc-lvl .lm{width:38px;height:38px;flex-shrink:0}
.bc-lvl b{font-family:var(--font-head);font-weight:800;font-size:17px;color:var(--deep);display:block;line-height:1.1}
.bc-lvl p{font-size:13px;font-weight:800;color:var(--ink-soft);line-height:1.25}
.kchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.kchips span{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:#eef2f6;color:#64748b}
.kchips span.ok{background:#dcfce7;color:#15803d}
.kchips svg.i{width:12px;height:12px;stroke-width:3}
.modal{position:absolute;inset:0;z-index:30;background:rgba(19,30,50,.42);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .2s both}
.bigcard{width:100%;max-width:350px;border-radius:26px;background:#fff;border:4px solid var(--bc,#e2e8f0);box-shadow:0 20px 50px rgba(0,0,0,.25);padding:12px;display:flex;flex-direction:column;gap:8px;animation:cardin .45s var(--spring) both}
.bigcard .bc-top{display:flex;align-items:center;gap:8px}
.bigcard .bc-top .sh-name b{font-size:24px}
.bigcard .bc-shield{display:flex;justify-content:center;align-items:center;height:118px}
.bigcard .bc-shield img{max-height:118px;max-width:110px}
.bigcard .bc-lock{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;text-align:center;font-weight:800;color:var(--ink-soft);font-size:15px}
.bigcard .bc-lock svg{width:80px;height:96px}
.bigcard .bigq{position:relative;display:grid;place-items:center}
.bigcard .bigq svg path:first-child{fill:color-mix(in srgb,var(--ld) 70%,#94a3b8)}
.bigcard .bigq b{position:absolute;font-family:var(--font-head);font-size:40px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25)}

/* ── Bildkällorna ────────────────────── */
.cred{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px;display:flex;flex-direction:column;gap:4px;-webkit-user-select:text;user-select:text}
.cred h3{font-family:var(--font-head);font-weight:800;font-size:17px;color:var(--deep);margin:8px 2px 2px}
.cred .intro{font-size:13.5px;font-weight:700;color:var(--ink-soft);line-height:1.35;padding:2px}
.crow{display:flex;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid #eef2f6}
.crow .ct{width:40px;height:40px;border-radius:10px;overflow:hidden;background:#f1f5f9;flex-shrink:0;display:grid;place-items:center}
.crow .ct img{width:100%;height:100%;object-fit:cover}
.crow .ct img.shield{object-fit:contain;padding:2px}
.crow .cx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.crow .cx b{font-size:13.5px;font-weight:900;color:var(--deep)}

<script>

/* ═══════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const LEAD = 280;                                    // texten först, rörelsen sen
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const ICON = {

const SAID = new Set();     // allt som sagts i bubblorna (för MOCK.allTexts)

const REF = '../referens/';
const SL = REF + 'sverige-landskap/';
let PATHS = [], LANDSKAP = [], FAKTA = {}, BILDER = [];
const BY = {}; let ALL = [];
const NAME = nr => BY[nr].namn;
const LANDSDELAR = ['Norrland', 'Svealand', 'Götaland'];
const NRS_OF = ld => LANDSKAP.filter(l => l.landsdel === ld).map(l => l.nr);
const F = nr => FAKTA[String(nr)];
const img = (nr, kind) => SL + F(nr).bilder[kind];
/* Beskärningen av blomplanscherna: texten längst ner ska aldrig synas (bilder.json, obs), blomman ska synas.
   Lodrät position i procent per plansch, satt för hand efter en kontaktbild av alla 25 (19/10); annars 22 %. */
const FLOWER_Y = { 1:3, 2:3, 5:2, 6:15, 9:8, 11:8, 13:2, 14:12, 16:6, 17:6, 18:8, 22:8, 25:3 };

const antal = n => n <= 20 ? TALORD[n] : n === 25 ? 'tjugofem' : String(n);   // antal skrivs i ord
const gen = n => /s$/.test(n) ? n : n + 's';                      // genitiv: Medelpads
const lc = s => /^Kung /.test(s) ? s : s[0].toLowerCase() + s.slice(1);   // "Kung Karls spira" behåller versalen
const cap = s => s[0].toUpperCase() + s.slice(1);
const inL = nr => (nr === 22 || nr === 23 ? 'på ' : 'i ') + NAME(nr);       // öarna: på Gotland, på Öland
async function loadData(){
  const [svgTxt, lax, fakta, bilder] = await Promise.all([
    fetch(REF + 'sveriges-landskap-farg.svg').then(r => { if (!r.ok) throw new Error('kartan'); return r.text(); }),
    fetch(REF + 'landskap-laxbok.json').then(r => r.json()),
    fetch(SL + 'landskap-fakta.json').then(r => r.json()),
    fetch(SL + 'bilder.json').then(r => r.json()),
  ]);
  const doc = new DOMParser().parseFromString(svgTxt, 'image/svg+xml');
  PATHS = [...doc.querySelectorAll('path')].map(p => [((p.getAttribute('style') || '').match(/fill:\s*(#[0-9a-fA-F]{3,6})/) || [])[1] || p.getAttribute('fill') || '#ddd', p.getAttribute('d')]);
  LANDSKAP = lax; FAKTA = fakta.landskap; BILDER = bilder.filer;
  for (const l of LANDSKAP) BY[l.nr] = l;
  ALL = LANDSKAP.map(l => l.nr);
}

/* Grannar: mätta i kartan (kantpunkter närmare än 2,5 enheter, minst 8 träffar längs gränsen), ur förra mockupen.

  16:[14,15,21], 17:[13,18,19], 18:[17,19], 19:[13,14,17,18,20,21], 20:[19,21,25], 21:[16,19,20,24,25], 22:[], 23:[], 24:[21,25], 25:[20,21,24] };
/* "Nära" = grannar, plus öarna: Gotland och Öland förväxlas med varandra, Öland ligger tätt intill Småland */
const NEAR = nr => [...NB[nr], ...({ 21:[23], 22:[23], 23:[21, 22] }[nr] || [])];
const isNear = (t, g) => g !== t && NEAR(t).includes(g);
function nearText(g, t){
  if ([22, 23].includes(g) && [22, 23].includes(t)) return `${NAME(g)} är också en ö.`;
  if ((g === 21 && t === 23) || (g === 23 && t === 21)) return `${NAME(g)} ligger tätt intill ${NAME(t)}.`;
  return `${NAME(g)} är granne med ${NAME(t)}.`;
}
/* Minnesstöd per landskap: läge, granne eller form (kartan). ref = landskapen meningen pekar på. */

const LAKES = [{ text:'Vänern', x:88, y:885 }, { text:'Vättern', x:156, y:930 }];   // punkter utan land, kontrollerade i förra mockupen

/* ── Faktan formulerad för barn: rangen i yta och invånare ur landskap-fakta.json (yta_rang, invanare_rang, 1 = störst) ── */
function ytaText(nr){

/* ═══════════════════════════════════════════════════════════

const SP = (function(){
  const MEDALS = ['brons', 'silver', 'guld'];
  const INTERVALS = [1, 3, 7, 14, 30];

  const pad2 = n => String(n).padStart(2, '0');

  function addDays(day, n){ const [y, m, d] = day.split('-').map(Number); return fmtDay(new Date(y, m - 1, d + n)); }
  const fresh = () => ({ box:'ny', okDays:0, level:0, due:null, lastOk:null, relearn:false });
  function applyAnswer(st, correct, day){
    if (correct){
      if (st.lastOk !== day){ st.okDays++; st.lastOk = day; }
      if (st.box === 'ny') st.box = 'ovar';
      else if (st.box === 'ovar'){
        if (st.okDays >= (st.relearn ? 2 : 3)){ st.box = 'kan'; st.level = 1; st.due = addDays(day, intervalFor(1)); st.relearn = false; }
      } else if (st.box === 'kan' && (!st.due || day >= st.due)){ st.level = (st.level || 1) + 1; st.due = addDays(day, intervalFor(st.level)); }
    } else if (st.box === 'kan'){ st.box = 'ovar'; st.okDays = 0; st.lastOk = null; st.relearn = true; st.level = 0; st.due = null; }

function createDrill(items, r = Math.random){
  const q = items.map((it, i) => ({ ...it, id:i, extra:false }));

    current(){ return idx < q.length ? { ...q[idx], retry } : null; },
    answer(ok){
      if (idx >= q.length) return null;

      st.attempts++;

      if (ok){ idx++; retry = false; }
      else {

          /* D34: minst två frågor emellan, och inte bredvid samma landskap om det går */
          const okPos = [];

    isDone(){ return idx >= q.length; },

  const sea = kind === 'sea' ? '<path d="M5 10.5c1.5 0 1.5-1 3-1s1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 2-1M5 14c1.5 0 1.5-1 3-1s1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 2-1" />' : '<ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3.3 9h17.4M3.3 15h17.4"/>';
  return `<svg class="i" viewBox="0 0 24 24" style="stroke-width:1.5"><circle cx="12" cy="12" r="9"/>${sea}${dot}</svg>`;

function bindSheetDrag(){

  const mv = e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  const end = () => { if (y0 === null) return; y0 = null; sh.classList.remove('drag'); sh.style.transform = ''; window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', end); if (dy > 90) closeSheet(); };
  grip.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; sh.classList.add('drag'); window.addEventListener('pointermove', mv); window.addEventListener('pointerup', end); });
}

/* ═══════════════════════════════════════════════════════════

   ett tryck på en ruta (eller på en knapp i rutan) startar direkt. Två tryck från hemvyn till första frågan.

const MODES = [

  { id:'namn', name:'Vad heter det?', icon:'bulb', desc:'Ett landskap lyser. Välj namnet.' },

];
const segHTML = (key, opts, cur) => `<div class="seg" data-key="${key}">${opts.map(([v, t, ic]) => `<button data-v="${v}" class="${v === cur ? 'on' : ''}">${ic ? svg(ic) : ''}${t}</button>`).join('')}</div>`;

  S.train.mode = cfg.mode; S.train.bild = cfg.bild;
  goto('play', { cfg });
});

/* Frågorna: en lista per läge. Hela Sverige (utom Upptäck): tolv frågor ur lådorna (övar först, sedan "dags igen", nya, kan). */
const RANK = { ovar:0, due:1, ny:2, kan:3 };
function prioritize(items){ const d = today(); return items.map(it => ({ it, r:RANK[SP.vis(box(it.nr), d)] + Math.random() * 0.9 })).sort((a, b) => a.r - b.r).map(x => x.it); }
function buildItems(cfg){
  const nrs = areaNrs(cfg.area);
  let items;
  if (cfg.mode === 'stad') items = nrs.flatMap(n => cities(n).map((c, i) => ({ nr:n, kind:'stad', stad:c, ci:i })));
  else if (cfg.mode === 'bild'){ const K = ['djur', 'blomma', 'skold'], off = Math.floor(Math.random() * 3); items = nrs.map((n, i) => ({ nr:n, kind:'bild', bild:cfg.bild === 'blandat' ? K[(i + off) % 3] : cfg.bild, svar:cfg.bildSvar === 'blandat' ? ((i + off) % 2 ? 'namn' : 'karta') : cfg.bildSvar })); }
  else if (cfg.mode === 'namn') items = nrs.map(n => ({ nr:n, kind:'namn' }));
  else items = nrs.map(n => ({ nr:n, kind:'var' }));
  if (cfg.mode !== 'upptack' && cfg.area === 'Sverige') items = prioritize(items).slice(0, 12);
  return cfg.order === 'rak' ? items.sort((a, b) => a.nr - b.nr || (a.ci || 0) - (b.ci || 0)) : spreadShuffle(items, `${cfg.mode}|${cfg.area}|${cfg.bild || ''}`);
}
/* Blandad ordning (D34): ny lottning varje runda, aldrig samma ordning som förra rundan med samma val, och aldrig samma
   landskap två gånger i rad (Städerna har två städer i vissa landskap). */
const LAST_ORDER = {};
const adjacentSame = o => o.some((x, i) => i && x.nr === o[i - 1].nr);
function spreadShuffle(items, key){
  const sig = o => o.map(x => x.nr + (x.stad || '') + (x.kind || '')).join(',');
  let o = shuffle(items);
  for (let t = 0; t < 300 && (adjacentSame(o) || (items.length > 2 && sig(o) === LAST_ORDER[key])); t++) o = shuffle(items);
  LAST_ORDER[key] = sig(o);
  return o;
}

/* ═══════════════════════════════════════════════════════════
   SPELA: träningens lägen (nötloop) och testet (ingen nötloop, ingen klocka)
   PL.phase: 'q' (väntar på svar) · 'right' (Nästa) · 'exp' (förklaringen, Nästa steg) · 'expdone' (Svara igen) · 'testwrong' (Nästa)
═══════════════════════════════════════════════════════════ */
let PL = null;
const PRAISE = ['Rätt!', 'Snyggt!', 'Helt rätt!', 'Bra hittat!'];
const MODE_NAME = { upptack:'Upptäck Sverige', namn:'Vad heter det?', stad:'Städerna', bild:'Djur, blommor, sköldar', test:'Test' };
const BILD_TITLE = { djur:'Landskapsdjur', blomma:'Landskapsblommor', skold:'Landskapssköldar', blandat:'Blandade bilder' };
const BILD_WORD = { djur:'landskapsdjur', blomma:'landskapsblomma', skold:'landskapssköld' };
const bildName = (nr, b) => b === 'djur' ? F(nr).djur : b === 'blomma' ? F(nr).blomma : null;
function enterPlay(arg){
  const M = MAPS.play;
  if (arg && arg.test){
    PL = { isTest:true, cfg:{ mode:'test', area:arg.area }, items:arg.items, i:0, results:[], phase:'q', start:Date.now(), pr:0, newCards:[] };
    setHeader(`Test ${arg.area === 'Sverige' ? 'hela Sverige' : arg.area}`, 'Avbryt');
  } else {
    const cfg = arg.cfg;
    PL = { isTest:false, cfg, upptack:cfg.mode === 'upptack', drill:createDrill(buildItems(cfg)), phase:'q', found:new Set(), start:Date.now(), pr:0, newCards:[], area:areaNrs(cfg.area) };
    setHeader(cfg.mode === 'bild' ? BILD_TITLE[cfg.bild] : MODE_NAME[cfg.mode], 'Avbryt');
  }
  M.reset(); M.inset = 0;
  M.setHome(PL.isTest ? null : areaNrs(PL.cfg.area));
  M.sync(); M.fitHome(0);
  M.showHalo(S.halo);
  nextQ(true);
}
function curItem(){ return PL.isTest ? PL.items[PL.i] : PL.drill.current(); }
function renderTrack(){
  let L, R, frac;
  if (PL.isTest){ L = `Test · fråga <b>${Math.min(PL.i + 1, PL.items.length)}</b> av ${PL.items.length}`; R = 'Ingen klocka'; frac = PL.i / PL.items.length; }
  else if (PL.upptack){ L = `Upptäckt <b>${PL.found.size}</b> av ${PL.area.length}`; R = AREA_NAME[PL.cfg.area]; frac = PL.found.size / PL.area.length; }
  else { const p = PL.drill.progress(); L = `Fråga <b>${Math.min(p.done + 1, p.total)}</b> av ${p.total}`; R = AREA_NAME[PL.cfg.area]; frac = p.done / p.total; }
  $('psL').innerHTML = L; $('psR').textContent = R; $('psFill').style.transform = `scaleX(${frac})`;
}
function setMain(lab, icon, show = true, after = true){
  const m = $('pMain'); m.style.visibility = show ? '' : 'hidden';
  m.innerHTML = after ? `${lab} ${icon ? svg(icon) : ''}` : `${icon ? svg(icon) : ''} ${lab}`;
  m.disabled = !show;
}
function nextQ(first = false){
  if (!PL || S.screen !== 'play') return;
  if (PL.isTest ? PL.i >= PL.items.length : PL.drill.isDone()){ finishPlay(); return; }
  showQuestion(curItem(), first);
}
const usesOptions = it => it.kind === 'namn' || (it.kind === 'bild' && it.svar === 'namn');
function promptHTML(it){
  if (it.kind === 'var') return `Var ligger <em>${NAME(it.nr)}</em>?`;
  if (it.kind === 'namn') return 'Vad heter det markerade landskapet?';
  if (it.kind === 'stad') return `I vilket landskap ligger <em>${esc(it.stad)}</em>?`;
  return it.bild === 'djur' ? 'Vems landskapsdjur är det här?' : it.bild === 'blomma' ? 'Vems landskapsblomma är det här?' : 'Vems landskapssköld är det här?';
}
function showQuestion(it, first = false){
  const M = MAPS.play;
  token++; busy = false;
  PL.cur = it; PL.phase = 'q'; PL.E = null; PL.lastInserted = false;
  if (!it.retry) PL.wrongs = 0;
  M.clearFx(); M.clearChips();
  $('pStage').classList.remove('ok');
  $('playMap').querySelectorAll('.toast').forEach(t => t.remove());
  /* Kartans utseende */
  const area = PL.isTest ? ALL : PL.area;
  if (PL.upptack && it.extra && !it.retry && PL.found.has(it.nr)) PL.found.delete(it.nr);    // tillbaka igen: landskapet går in i dimman
  for (const n of ALL){
    const out = !area.includes(n);
    M.P[n].setAttribute('class', 'ls' + (out ? ' out' : '') + (PL.upptack && !out && !PL.found.has(n) ? ' fog' : ''));
  }
  M.labelFor = PL.upptack ? (n => PL.found.has(n) ? { force:true, text:NAME(n), cls:'found' } : null) : null;
  M.relayout();
  /* Frågan */
  const tag = PL.isTest ? '' : it.retry ? 'En gång till' : it.extra ? 'Tillbaka igen' : '';
  const fig = it.kind === 'bild' ? `<figure class="qfig"><div class="im"><img class="${it.bild === 'blomma' ? 'flower' : it.bild === 'skold' ? 'shield' : ''}" style="${it.bild === 'blomma' ? flowerPos(it.nr) : ''}" src="${img(it.nr, it.bild === 'skold' ? 'vapen' : it.bild)}" alt="" draggable="false"></div>${bildName(it.nr, it.bild) ? `<figcaption>${esc(bildName(it.nr, it.bild))}</figcaption>` : ''}</figure>` : '';
  $('pTop').innerHTML = `<span class="prompt">${tag ? `<span class="qtag">${tag}</span><br>` : ''}${promptHTML(it)}</span>${fig}`;
  $('pCtrl').innerHTML = '';
  PL.opts = null;
  if (it.kind === 'namn') M.fx(it.nr, 'mark');
  if (usesOptions(it)){
    PL.opts = nameOptions(it.nr);

  D.tag = tag;

  draw(); requestAnimationFrame(grow);
  setTimeout(() => { if (PZ.drag === D && !D.dropping){ D.s = D.k; draw(); } }, 200);
  const mv = ev => { if (ev.pointerId !== D.id) return; ev.preventDefault(); D.px = ev.clientX - app.left; D.py = ev.clientY - app.top; draw(); };

/* Snäppradien (D32): generös – halva bitens minsta mått, minst 40 px – men alltid mindre än avståndet till närmaste

function snapRadius(n){
  const M = MAPS.pz, L = MEAS[n].label, b = MEAS[n].bbox;
  let dnb = Infinity;
  for (const m of areaNrs(PZ.area)) if (m !== n){ const Q = MEAS[m].label; dnb = Math.min(dnb, Math.hypot(L.x - Q.x, L.y - Q.y) * M.k); }

    await tween(D, { X:tX, Y:tY, s:M.k }, 140);

    PZ.placed.add(n); PZ.left = PZ.left.filter(x => x !== n);
    M.P[n].setAttribute('class', 'ls placed'); M.P[n].parentNode.appendChild(M.P[n]);   // lagd bit ritas överst, med sina gränser

    if (!PZ.left.length){ PZ_DONE.add(PZ.area + ':' + PZ.level); setTimeout(() => celebrate({ title:'Pusslet är klart!', sub:`Du har lagt hela ${PZ.area === 'Sverige' ? 'Sverige' : PZ.area}. Nivå: ${PZ_LEVEL[PZ.level].toLowerCase()}.`,
      buttons:[{ label:'Lägg igen', icon:'again', fn:() => { closeOverlay(); startPuzzle(PZ.area, PZ.level); } }, { label:'Välj ett annat pussel', icon:'puzzle', fn:() => goto('pick', 'puzzle') }, { label:'Till landskapen', icon:'next', primary:true, fn:() => goto('hub') }] }), 450); }
    return;
  }
  PZ.miss[n] = (PZ.miss[n] || 0) + 1;
  say('pzBubble', 'Inte där. Biten glider tillbaka.', PZ.miss[n] >= 2 ? 'Titta: den rätta platsen blinkar.' : 'Titta på formen och prova en annan plats.');

}

/* Tryck med riktiga pekarhändelser (genom hela kedjan: tryck/drag-skillnaden, 250 ms-väntan, träffen) */
function ptr(el, type, x, y, id = 1, kind = 'touch'){ el.dispatchEvent(new PointerEvent(type, { bubbles:true, cancelable:true, composed:true, clientX:x, clientY:y, pointerId:id, pointerType:kind, isPrimary:id === 1, button:0, buttons:type === 'pointerup' ? 0 : 1 })); }
function screenOf(mapKey, nr){ const M = MAPS[mapKey], L = MEAS[nr].label, q = M.toScreen(L.x, L.y), r = M.el.getBoundingClientRect(); return { x:r.left + q.x, y:r.top + q.y }; }
async function tapNr(mapKey, nr){ const M = MAPS[mapKey], p = screenOf(mapKey, nr); ptr(M.el, 'pointerdown', p.x, p.y); ptr(M.el, 'pointerup', p.x, p.y); await wait(380); return p; }
/* Träffytan i px för varje synligt landskap, mätt med samma träffberäkning som trycken (rutnät, steg 2 px) */
function hitReport(mapKey, step = 2){
  const M = MAPS[mapKey], W = Math.floor(M.W / step), H = Math.floor((M.H - M.inset) / step), grid = new Int16Array(W * H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) grid[j * W + i] = M.hit(i * step + step / 2, j * step + step / 2) || 0;
  const disc = {};
  for (const n of M.visibleNrs()){
    const edge = [];
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){ if (grid[j * W + i] !== n) continue;
      const out = (a, b) => a < 0 || b < 0 || a >= W || b >= H || grid[b * W + a] !== n;
      if (out(i - 1, j) || out(i + 1, j) || out(i, j - 1) || out(i, j + 1)) edge.push(i, j); }
    let best = 0;
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++){ if (grid[j * W + i] !== n) continue;
      let m = Infinity; for (let e = 0; e < edge.length; e += 2){ const dx = edge[e] - i, dy = edge[e + 1] - j, d = dx * dx + dy * dy; if (d < m) m = d; }
      if (m > best) best = m; }
    disc[n] = (2 * Math.sqrt(best) + 1) * step;
  }
  const out = {};
  for (const n of M.visibleNrs()) out[n] = { name:NAME(n), disc:Math.round(disc[n] || 0), small:M.smallNrs().includes(n), widthPx:+(2 * MEAS[n].r * M.k).toFixed(1) };
  return { k:+M.k.toFixed(3), out };
}
/* Alla texter som appen kan visa, för genomläsning med språkreglerna */

  const t = new Set(SAID);
  for (const n of ALL){
