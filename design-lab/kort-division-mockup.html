<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kort division — mockup (spec 23/9)</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ── Tokens ur styles/app.css (samma värden) ─────────────────── */
:root{
  --font-head:'Baloo 2',cursive; --font-body:'Nunito',sans-serif;
  --ink:#3b1d6e; --ink-soft:#6d5a96; --deep:#0f5c54;
  --accent:#0d9488; --accent-light:#2dd4bf; --glow:rgba(45,212,191,.5);
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.9);
  --shadow-panel:0 10px 34px rgba(93,63,158,.10),0 2px 6px rgba(93,63,158,.06);
  --radius-md:18px; --radius-lg:24px; --radius-full:999px;
  --spring:cubic-bezier(.34,1.3,.4,1); --smooth:cubic-bezier(.4,0,.2,1);
  --E:#22c55e; --T:#3b82f6; --H:#ef4444; --rest:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--ink);overflow:hidden;
  background:linear-gradient(160deg,#fdf4ff 0%,#fce7f3 34%,#eff6ff 68%,#f0fdf4 100%);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.app{width:390px;height:844px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:4px 10px 8px;overflow:hidden;position:relative}

/* Header (app-header) */
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:46px;flex-shrink:0}
.btn-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 16px 8px 12px;border-radius:var(--radius-full);
  background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--shadow-panel);color:var(--deep);font-weight:800;font-size:14px}
.btn-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.title{font-family:var(--font-head);font-weight:700;font-size:22px;color:var(--deep);flex:1;text-align:center}
.hdr .sp{width:88px}

/* Labb-rader (inte app-UI: dämpade) */
.lab{display:flex;gap:5px;flex-shrink:0}
.lab .pill{flex:1;min-height:44px;border-radius:var(--radius-full);background:rgba(255,255,255,.55);border:1.5px solid rgba(13,148,136,.22);
  font-family:var(--font-head);font-weight:700;font-size:15px;color:var(--deep);transition:transform .2s var(--spring)}
.lab .pill.on{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;box-shadow:0 6px 16px var(--glow)}
.lab .pill:active{transform:scale(.96)}
.lab.seg .pill{font-family:var(--font-body);font-weight:800;font-size:14px}

/* Pappret */
.paper{position:relative;height:200px;background:var(--glass-strong);border-radius:var(--radius-lg);padding:14px 12px;border:1px solid var(--glass-line);box-shadow:var(--shadow-panel);flex-shrink:0}
.drawn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;max-width:250px}
.frac{display:flex;flex-direction:column;align-items:center;gap:4px}
.fracrow{display:flex;gap:11px}
.fcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.lbl{font-size:13px;font-weight:900;line-height:1.1;height:15px}
.cell{width:36px;height:36px;border-radius:11px;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:1.35rem;font-weight:900;border:2px solid rgba(0,0,0,.08);background:rgba(255,255,255,.92);
  transition:box-shadow .3s var(--smooth)}
.cell.lit{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent),0 0 18px color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 9%,#fff)}
.cell .dg{transition:opacity .3s}
.cell.struck .dg{opacity:.55}
.cell.tap{cursor:pointer}
.cell.tap::after{content:'';position:absolute;inset:-6px}
.cell .nstrike{position:absolute;left:7%;top:7%;width:86%;height:86%;overflow:visible;pointer-events:none;z-index:2}
.cell .nstrike path{stroke:#b91c1c;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:44;stroke-dashoffset:44}
.cell .nstrike.draw path{animation:pen .4s ease-out forwards}
/* mellanresten: liten röd pennsiffra uppe till vänster (stryks aldrig) */
.rem{position:absolute;top:-11px;left:-9px;z-index:3;display:inline-flex;align-items:center;justify-content:center;visibility:hidden;
  min-width:.7em;height:1.15em;font-family:var(--font-head);font-weight:900;color:var(--rest);transform:rotate(-4deg);font-size:1.1rem;
  padding:0 3px;border-radius:6px;background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rem.on{visibility:visible}
.rem.lit{box-shadow:0 0 0 2px rgba(220,38,38,.22),0 0 12px rgba(220,38,38,.7)}
/* platsen barnet ska träffa (hjälpläget) */
.slot{position:absolute;top:-15px;left:-13px;z-index:4;width:20px;height:24px;border:2.5px dashed rgba(220,38,38,.9);border-radius:6px;
  background:rgba(255,255,255,.97);box-shadow:0 2px 8px rgba(220,38,38,.28);display:none;cursor:pointer}
.slot::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.slot.show{display:block}
.slot.pulse{animation:slotpulse 1.1s ease-in-out infinite}
.fracbar{align-self:stretch;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,#374151 6%,#374151 94%,transparent)}
.cell.dcell{border-color:#64748b}
.cell.dcell .dg{color:#475569}
.diveq{display:flex;align-items:flex-end;gap:5px}
.qcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.eq{font-family:var(--font-head);font-weight:900;color:#475569;font-size:1.3rem;padding:0 2px;height:36px;display:flex;align-items:center}
.qbox{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:900;
  border:2.5px dashed color-mix(in srgb,var(--accent) 32%,transparent);background:rgba(255,255,255,.7);transition:border-color .3s,background .3s}
.qbox.active{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.qbox.filled{border-style:solid;border-color:var(--c)}
.qbox span{color:var(--c)}
.qbox.land span{display:inline-block;animation:land .4s var(--spring) both}
/* glöd på källor (bara text-shadow/box-shadow — pappret står still) */
.glow{animation:readglow .3s ease-in-out both}
.glint{animation:readglow .4s ease-in-out 2 both}
.shake{animation:shake .4s ease-in-out both}

/* Marginalen: brickor och flygare (absolut i pappret) */
.stage{position:absolute;inset:0;pointer-events:none;overflow:visible}
.chip{position:absolute;z-index:8;display:flex;align-items:center;justify-content:center;gap:1px;padding:4px 9px;border-radius:999px;line-height:1;
  font-family:var(--font-head);font-weight:800;font-size:15px;color:#fff;white-space:nowrap;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#fff));
  box-shadow:0 7px 20px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.chip.big{font-size:1.35rem;padding:3px 11px;min-width:34px}
/* appens sifferbricka (.md-chip.md-anchor): stor kvotsiffra, tabellraden litet under */
.chip.num{flex-direction:column;gap:0;padding:2px 8px 3px;border-radius:14px;min-width:40px}
.chip.num .qd{font-size:1.35rem}
.chip.num .sub{font-size:10px;line-height:1;opacity:.95;letter-spacing:.02em}
.chip.in{animation:chipin .5s cubic-bezier(.34,1.3,.4,1) both}
.chip.ghost{opacity:.62;text-decoration:line-through;text-decoration-thickness:2px;filter:saturate(.5)}
.chip.ghost.fade{transition:opacity .6s var(--smooth);opacity:0}
.chip.spent{transition:opacity .2s,transform .2s;opacity:0;transform:scale(.7)}
.chip.move{transition:left .6s var(--smooth),top .6s var(--smooth),font-size .6s,padding .6s,background .6s,color .6s,box-shadow .6s,transform .6s}
.chip.torest{font-size:1.1rem;padding:0 3px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--rest);transform:rotate(-4deg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fly{position:absolute;z-index:22;display:grid;place-items:center;font-family:var(--font-head);font-weight:800;line-height:1;font-size:15px;color:#fff;
  transition:left .6s var(--smooth),top .6s var(--smooth),width .6s var(--smooth),height .6s var(--smooth),font-size .6s var(--smooth),color .6s}
.live{position:absolute;z-index:9;right:0;background:#fff;border:2px solid #f59e0b;border-radius:12px;padding:5px 7px;font-size:12px;line-height:1.35;
  font-weight:800;color:var(--ink);box-shadow:0 6px 18px rgba(245,158,11,.3);animation:chipin .3s var(--spring) both;white-space:nowrap}
.live .row{display:block;font-family:var(--font-head)}
.live .row.mid{font-size:14px;color:var(--deep)}
.live .row.over{text-decoration:line-through;color:#94a3b8}
.live .note{display:block;margin-top:3px;font-size:10.5px;color:#64748b;white-space:normal;max-width:96px}

/* Bubblan — fast höjd, knappen står still */
.bubble{height:88px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center}
.thought{height:100%;background:#fff;border-radius:var(--radius-md);padding:8px 12px;box-shadow:var(--shadow-panel);font-weight:800;color:var(--ink);
  font-size:16px;line-height:1.45;border:2px solid color-mix(in srgb,var(--accent) 18%,transparent);display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.thought.pop{animation:bubblein .3s var(--spring)}
.thought .b2{font-size:14px;color:#64748b}
.thought .b2.fakta{font-size:16px;color:var(--ink)}
.thought .b2.err{color:#b91c1c}
.thought .ans{display:inline-block;min-width:1.1em;text-align:center;border-bottom:2.5px solid var(--accent);color:var(--deep)}

/* Panelen */
.panel{flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 24px;border-radius:var(--radius-full);
  font-size:16px;font-weight:800;line-height:1;white-space:nowrap;user-select:none;width:100%;
  transition:transform .25s var(--spring),box-shadow .25s var(--smooth),opacity .05s}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;box-shadow:0 8px 22px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.help{display:none;flex-direction:column;gap:6px;background:var(--glass-strong);border-radius:var(--radius-md);padding:8px 10px;border:1px solid var(--glass-line);box-shadow:var(--shadow-panel)}
.help.on{display:flex}
.numpad{display:grid;grid-template-columns:repeat(5,48px);gap:4px;justify-content:center;transition:opacity .2s}
.numpad.off{opacity:.3;pointer-events:none}
.nk{width:48px;height:48px;border-radius:50%;font-size:1.1rem;font-family:var(--font-head);font-weight:900;background:var(--glass-strong);
  border:1.5px solid color-mix(in srgb,var(--accent) 32%,transparent);color:var(--deep);transition:transform .2s var(--spring)}
.nk:active{transform:scale(.92)}
.row2{display:flex;gap:8px}
.row2 .btn{min-height:44px;padding:0 10px;font-size:14px;flex:1}
.btn-live{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;box-shadow:0 5px 14px rgba(245,158,11,.4)}
.btn-live svg{width:18px;height:18px}

/* Labbfoten */
.foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding:8px 10px 4px;border-top:1.5px dashed rgba(59,29,110,.18);flex-shrink:0}
.foot .trow{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.foot .trow .lb{flex:1;min-width:0}
.foot .tg{display:flex;gap:2px;background:rgba(255,255,255,.6);border-radius:999px;padding:2px}
.foot .tg button{min-height:28px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
.foot .tg button.on{background:var(--ink);color:#fff}
.foot .trow.dim{opacity:.35;pointer-events:none}
.counter{font-family:var(--font-head);font-weight:700;font-size:14px;color:var(--deep);text-align:center;padding-top:2px}
.counter b{color:#b45309}

@keyframes readglow{0%,100%{text-shadow:none}45%{text-shadow:0 0 9px var(--c),0 0 3px var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 75%,transparent)}}
@keyframes chipin{0%{transform:scale(.4);opacity:0}65%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes land{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pen{to{stroke-dashoffset:0}}
@keyframes bubblein{from{transform:scale(.9) translateY(4px);opacity:.4}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes slotpulse{0%,100%{box-shadow:0 0 4px rgba(220,38,38,.3)}50%{box-shadow:0 0 14px rgba(220,38,38,.8)}}
@keyframes dpulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px rgba(100,116,139,.25),0 0 14px rgba(100,116,139,.6)}}
.cell.dpulse{animation:dpulse .3s ease-in-out both}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="hdr">
    <button class="btn-back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Avsluta</button>
    <span class="title">Kort division</span>
    <span class="sp"></span>
  </div>

  <div class="lab" id="taskrow"></div>
  <div class="lab seg" id="moderow">
    <button class="pill on" data-mode="demo">Titta och lär</button>
    <button class="pill" data-mode="help">Räkna med hjälp</button>
  </div>

  <div class="paper" id="paper">
    <div class="drawn" id="drawn"></div>
    <div class="stage" id="stage"></div>
  </div>

  <div class="bubble" id="bubble"><div class="thought" id="thought"><span class="b1" id="b1"></span><span class="b2" id="b2"></span></div></div>

  <div class="panel" id="panel">
    <button class="btn btn-primary" id="nextbtn">Nästa steg <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="help" id="helpbox">
      <div class="numpad" id="numpad"></div>
      <div class="row2">
        <button class="btn btn-live" id="livebtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><path d="M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></svg>Livlina</button>
        <button class="btn btn-primary" id="hnext">Nästa <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </div>

  <div class="foot">
    <div class="trow"><span class="lb">1 · "För mycket"-brickan i fall D</span><span class="tg" data-k="ghost"><button data-v="1">På</button><button data-v="0">Av</button></span></div>
    <div class="trow"><span class="lb">2 · Faktatexten</span><span class="tg" data-k="wording"><button data-v="talord">Talord</button><button data-v="siffra">Siffra</button></span></div>
    <div class="trow" id="trow3"><span class="lb">3 · Fakta i demon</span><span class="tg" data-k="fakta"><button data-v="eget">Eget klick</button><button data-v="med">Med frågan</button></span></div>
    <div class="trow"><span class="lb">4 · Brickans form</span><span class="tg" data-k="form"><button data-v="piller">Piller 6 · 7 = 42</button><button data-v="siffra">Sifferbricka</button></span></div>
    <div class="counter" id="counter"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   MODELLEN (spec §2–§4). Fyra fall per siffra: A, B, C, D.
   Texterna genereras ur specens mallar; talord/siffra per växel.
═══════════════════════════════════════════════════════════ */
const TASKS = [{num:420,N:6},{num:444,N:6},{num:612,N:6},{num:72,N:6}];
const PV   = ['entalet','tiotalet','hundratalet','tusentalet'];
const COLV = ['#22c55e','#3b82f6','#ef4444','#a855f7'];
const LBL  = ['E','T','H','T'];
const ORD  = ['noll','en','två','tre','fyra','fem','sex','sju','åtta','nio','tio'];   // antal N:or
const ORDN = ['noll','ett','två','tre','fyra','fem','sex','sju','åtta','nio','tio'];  // resten som tal
const cap = s => s[0].toUpperCase() + s.slice(1);

const S = { task:0, mode:'demo', ghost:true, wording:'talord', fakta:'eget', form:'piller' };
const ack = t => 'Rätt — ' + (t.startsWith('Ingen — ') ? 'ingen. ' + t.slice(8) : t[0].toLowerCase() + t.slice(1));

function faktaText(N,q,cur,prod,r,o){
  const sfx = q === 1 ? 'a' : 'or';
  if (r === 0){
    return o.wording === 'talord' ? `${cap(ORD[q])} ${N}:${sfx} är precis ${cur}.` : `${N} · ${q} är precis ${cur}.`;
  }
  const head = o.wording === 'talord' ? `${cap(ORD[q])} ${N}:${sfx} är ${prod}` : `${N} · ${q} = ${prod}`;
  if (!o.ghost) return `${head} — det får plats i ${cur}.`;
  return `${head} — det får plats.` + (o.wording === 'talord' ? ` ${cap(ORD[q+1])} vore ${(q+1)*N}, för mycket.` : ` ${N} · ${q+1} = ${(q+1)*N}, för mycket.`);
}

function buildSteps(task, o){
  const N = task.N, nd = String(task.num).split('').map(Number), L = nd.length;
  const W = String(task.num / N).length;
  const steps = [];
  let rest = 0, carried = [];         // carried: celler (g) som ingår i cur efter fall A
  /* Strykningar namnger KOLUMNEN, aldrig siffrans värde (beslut 23/9). */
  const strykStep = (gs, cur) => {
    const cols = [...gs].sort((a,b) => b - a);
    if (cols.length === 1){
      const c = cap(PV[cols[0]]);
      return { t:'stryk', gs:cols, text:`${c} är klart — vi stryker det.`, htext:`${c} är klart — tryck på det, så stryker vi det.` };
    }
    const c = `${cap(PV[cols[0]])} och ${PV[cols[1]]} är klara — ${cur} är räknat.`;
    return { t:'stryk', gs:cols, text:`${c} Vi stryker dem.`, htext:`${c} Tryck på dem, så stryker vi dem.` };
  };
  const flyttaStep = (r, g, i) => ({ t:'flytta', r, toG:g-1, nextD:nd[i+1], newCur:r*10+nd[i+1],
    text:`Resten ${r} ställer sig framför ${nd[i+1]}:an i ${PV[g-1]} — nu står det ${r*10+nd[i+1]}.` });
  for (let i = 0; i < L; i++){
    const g = L-1-i, d = nd[i], cur = rest*10 + d, lead = i === 0;
    const digitCells = carried.length ? [...carried, g] : [g];
    const srcCells = rest > 0 && !carried.length ? ['r'+g, g] : digitCells;
    const fraga = { t:'fraga', text:`Hur många ${N}:or ryms i ${cur}?`, cells:srcCells, g, cur, N };
    if (cur === 0 && !lead){                                                // fall B′: inget kvar att dela
      steps.push({ t:'inget_kvar', text:`Inget kvar att dela — vi skriver 0 i ${PV[g]}.`, g, cells:[g] });
      steps.push(strykStep([g], cur));
      rest = 0; carried = []; continue;
    }
    if (cur < N){
      steps.push(fraga);
      if (lead && L > 1){                                                   // fall A
        steps.push({ t:'ryms_inte', text:`Ingen — ${N} är större än ${cur}. En nolla först skriver vi inte.`, g, cells:[g], zero:false, cur, N });
        steps.push({ t:'ta_med', text:`Vi tar med ${nd[i+1]}:an i ${PV[g-1]} — nu har vi ${cur*10+nd[i+1]}.`, gs:[g, g-1] });
        rest = cur; carried = [g]; continue;
      }
      // fall B (sista siffran med cur > 0 kan inte inträffa i jämna uppgifter)
      steps.push({ t:'ryms_inte', text:`Ingen — ${N} är större än ${cur}. Vi skriver 0 i ${PV[g]}.`, g, cells:[g], zero:true, cur, N });
      if (i < L-1) steps.push(flyttaStep(cur, g, i));
      steps.push(strykStep([g], cur));
      rest = i < L-1 ? cur : 0; carried = []; continue;
    }
    const q = Math.floor(cur / N), r = cur - q*N, prod = q*N;
    const fakta = { t:'fakta', text:faktaText(N,q,cur,prod,r,o), N, q, cur, prod, r, g, cells:srcCells, ghost: r > 0 && o.ghost };
    if (o.fakta === 'med' && S.mode === 'demo') steps.push({ ...fakta, t:'fraga_fakta', fragaText:fraga.text });
    else { steps.push(fraga); steps.push(fakta); }
    steps.push({ t:'skriv', q, g, text:`Vi skriver ${q} i ${PV[g]}.` });
    if (r > 0){
      steps.push({ t:'rest', r, cur, prod, cells:srcCells, g, text:`${cur} − ${prod} = ${r}. Resten är ${r}.` });
      if (i < L-1) steps.push(flyttaStep(r, g, i));
    }
    steps.push(strykStep(digitCells, cur));
    rest = r; carried = [];
  }
  return { steps, nd, L, W, N };
}

/* ═══════════════════════════════════════════════════════════
   HJÄLPLÄGET (spec §5): två räknefrågor per siffra, tryck på plats
   och siffra. Härleds ur demokedjan. Texter utanför specen är märkta [lucka].
═══════════════════════════════════════════════════════════ */
function buildHelp(demo){
  const H = [];
  for (let k = 0; k < demo.length; k++){
    const s = demo[k];
    if (s.t === 'fraga'){
      const nx = demo[k+1];
      if (nx.t === 'ryms_inte' && !nx.zero){                                   // fall A: kvittensen säger regeln (spec §5)
        const tm = demo[k+2];
        H.push({ input:'digit', answer:0, text:s.text, q:s, enter:()=>anim(s), correct:async()=>{ setBubble(`Rätt — ingen. En nolla först skriver vi inte. ${tm.text}`); await anim(nx); await anim(tm); }, thenNext:true, live:{kind:'q', N:s.N, q:0, cur:s.cur} });
        k += 2;
      } else if (nx.t === 'ryms_inte'){                                        // fall B
        H.push({ input:'digit', answer:0, text:s.text, q:s, enter:()=>anim(s), correct:async()=>{ setBubble(ack(nx.text)); await anim(nx); }, thenNext:true, live:{kind:'q', N:s.N, q:0, cur:s.cur} });
        k += 1;
      } else {
        const fk = nx, sk = demo[k+2];
        H.push({ input:'digit', answer:sk.q, text:s.text, q:s, enter:async()=>{ lightSources(s.cells); await animFakta(fk); }, correct:async()=>{ setBubble(ack(sk.text)); await anim(sk); }, thenNext:true, live:{kind:'q', N:fk.N, q:fk.q, cur:fk.cur, r:fk.r} });
        k += 2;
      }
    } else if (s.t === 'fraga_fakta'){
      const sk = demo[k+1];
      H.push({ input:'digit', answer:sk.q, text:s.fragaText, enter:()=>anim(s), correct:async()=>{ setBubble(ack(sk.text)); await anim(sk); }, thenNext:true, live:{kind:'q', N:s.N, q:s.q, cur:s.cur, r:s.r} });
      k += 1;
    } else if (s.t === 'inget_kvar'){
      H.push({ input:'digit', answer:0, text:'Inget kvar att dela — vad skriver vi?', enter:()=>{ lightSources(s.cells); return wait(300); }, correct:async()=>{ setBubble(`Rätt — 0 i ${PV[s.g]}.`); await anim(s); }, thenNext:true, live:{kind:'r0', g:s.g} });
    } else if (s.t === 'ta_med'){
      H.push({ input:'next', text:s.text, enter:()=>anim(s) });
    } else if (s.t === 'rest'){
      H.push({ input:'digit', answer:s.r, text:`${s.cur} − ${s.prod} = ?`, enter:()=>lightSources(s.cells.concat(['q'+s.g])), correct:async()=>{ setBubble(ack(s.text)); await anim(s); }, thenNext:true, live:{kind:'r', cur:s.cur, prod:s.prod, r:s.r} });
    } else if (s.t === 'flytta'){
      H.push({ input:'place', toG:s.toG, step:s, text:`Tryck på platsen framför ${s.nextD}:an i ${PV[s.toG]} — där ska resten ${s.r} stå.`,
        enter:async()=>{ if (!stage.querySelector('.chip[data-role="rest"]')) await bornRest(s); },
        correct:async()=>{ setBubble(ack(s.text)); await animFlytta(s); }, thenNext:true });
    } else if (s.t === 'stryk'){
      H.push({ input:'strike', gs:[...s.gs], text:s.htext, cost:s.gs.length });
    }
  }
  return H;
}
const helpCost = H => H.reduce((a,s) => a + (s.input === 'strike' ? s.cost : 1) + (s.thenNext ? 1 : 0), 0);

/* ═══════════════════════════════════════════════════════════
   RENDERING
═══════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const paper = $('paper'), stage = $('stage'), drawn = $('drawn');
let M = null, steps = [], idx = 0, locked = false, clicks = 0, helpSteps = [], hs = null, awaiting = null, errors = 0, strikeLeft = [], liveEl = null, ghostEl = null;
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

function renderTasks(){
  $('taskrow').innerHTML = TASKS.map((t,i) => `<button class="pill${i===S.task?' on':''}" data-i="${i}">${t.num} ÷ ${t.N}</button>`).join('');
  $('taskrow').querySelectorAll('.pill').forEach(b => b.onclick = () => { S.task = +b.dataset.i; start(); });
}
function renderPaper(){
  const { nd, L, W, N } = M;
  let cols = '';
  for (let i = 0; i < L; i++){
    const g = L-1-i, c = COLV[g];
    cols += `<div class="fcol"><span class="lbl" style="color:${c}">${LBL[g]}</span>
      <div class="cell" id="n${g}" style="--c:${c};border-color:${c}" data-g="${g}"><span class="dg" style="color:${c}">${nd[i]}</span><span class="rem" id="r${g}"></span><span class="slot" id="s${g}" data-g="${g}"></span></div></div>`;
  }
  let qs = '';
  for (let g = W-1; g >= 0; g--) qs += `<div class="qcol"><span class="lbl" style="color:${COLV[g]}">${LBL[g]}</span><div class="qbox" id="q${g}" style="--c:${COLV[g]}"><span></span></div></div>`;
  drawn.innerHTML = `<div class="frac"><div class="fracrow">${cols}</div><div class="fracbar"></div>
      <div class="cell dcell" id="dcell" style="--c:#64748b"><span class="dg">${N}</span></div></div>
    <div class="diveq"><span class="eq">=</span>${qs}</div>`;
  stage.innerHTML = ''; liveEl = null; ghostEl = null;
  drawn.querySelectorAll('.cell[data-g]').forEach(c => c.onclick = () => onCellTap(+c.dataset.g));
  drawn.querySelectorAll('.slot').forEach(s => s.onclick = e => { e.stopPropagation(); onSlotTap(+s.dataset.g); });
}
function renderNumpad(){
  $('numpad').innerHTML = [1,2,3,4,5,6,7,8,9,0].map(d => `<button class="nk" data-d="${d}">${d}</button>`).join('');
  $('numpad').querySelectorAll('.nk').forEach(b => b.onclick = () => onDigit(+b.dataset.d, b));
}
function renderFoot(){
  document.querySelectorAll('.foot .tg').forEach(tg => {
    const k = tg.dataset.k;
    tg.querySelectorAll('button').forEach(b => {
      const v = k === 'ghost' ? (b.dataset.v === '1') : b.dataset.v;
      b.classList.toggle('on', S[k] === v);
      b.onclick = () => { S[k] = v; start(); };
    });
  });
  $('trow3').classList.toggle('dim', S.mode === 'help');
}
function setBubble(t1, t2 = '', cls = ''){
  const th = $('thought');
  $('b1').innerHTML = t1; $('b2').innerHTML = t2; $('b2').className = 'b2 ' + cls;
  th.classList.remove('pop'); void th.offsetWidth; th.classList.add('pop');
}
function counter(){
  const total = S.mode === 'demo' ? steps.length - 1 : helpCost(helpSteps);
  const done = S.mode === 'demo' && idx >= steps.length ? ' — klart' : '';
  $('counter').innerHTML = `${TASKS[S.task].num} ÷ ${TASKS[S.task].N} · ${S.mode === 'demo' ? 'Titta och lär' : 'Räkna med hjälp'}: <b>${clicks}</b> / <b>${total}</b> klick${S.mode === 'demo' ? ` · ${steps.length} steg` : ''}${done}`;
}
let lockTimer = null;
function setLock(ms){
  clearTimeout(lockTimer);                 // ett äldre lås får aldrig släppa ett nyare i förtid
  locked = true;
  $('nextbtn').disabled = true; $('hnext').disabled = true; $('numpad').classList.add('off');
  lockTimer = setTimeout(() => { locked = false; refreshControls(); }, Math.min(ms, 900));
}
function refreshControls(){
  if (locked) return;
  if (S.mode === 'demo'){
    const b = $('nextbtn'); b.disabled = false;
    if (idx >= steps.length) b.innerHTML = `Igen <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3M4.5 17.5V12H10"/></svg>`;
    else b.innerHTML = `Nästa steg <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
  } else {
    $('numpad').classList.toggle('off', awaiting !== 'digit');
    $('hnext').disabled = awaiting !== 'next' && awaiting !== 'done';
    $('hnext').innerHTML = awaiting === 'done' ? `Igen <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3M4.5 17.5V12H10"/></svg>` : `Nästa <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
    $('livebtn').disabled = !(awaiting === 'digit' || awaiting === 'place' || awaiting === 'strike');
  }
}

/* ═══════════════════════════════════════════════════════════
   ANIMATIONSGRAMMATIK (spec §7, §9)
═══════════════════════════════════════════════════════════ */
const rel = el => { const p = paper.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x:r.left-p.left, y:r.top-p.top, w:r.width, h:r.height }; };
const cellOf = key => typeof key === 'string' ? (key[0] === 'r' ? $(key) : $(key)) : $('n'+key);
const innerRight = () => paper.clientWidth - 12;
const anchorY = () => rel($('n0')).y;
function glowEls(els, cls = 'glow'){ els.forEach(e => { if (!e) return; e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls); }); }
function lightSources(keys){
  drawn.querySelectorAll('.cell.lit').forEach(c => c.classList.remove('lit'));
  drawn.querySelectorAll('.qbox.active').forEach(c => c.classList.remove('active'));
  const els = keys.map(cellOf);
  els.forEach(e => e && e.classList.add('lit'));
  const g = keys.filter(k => typeof k === 'number').sort()[0];
  if ($('q'+g) && !$('q'+g).classList.contains('filled')) $('q'+g).classList.add('active');
  glowEls(els.concat([$('dcell')]));
  $('dcell').classList.remove('dpulse'); void $('dcell').offsetWidth; $('dcell').classList.add('dpulse');
}
function killGhost(){ if (ghostEl){ ghostEl.remove(); ghostEl = null; } }
function killLive(){ if (liveEl){ liveEl.remove(); liveEl = null; } }
function bornChip(html, color, y, big = false, cls = '', rightEdge = null){
  const c = document.createElement('div');
  c.className = 'chip' + (big ? ' big' : '') + (cls ? ' ' + cls : ''); c.style.setProperty('--c', color); c.innerHTML = html;
  c.style.visibility = 'hidden'; stage.append(c);
  c.style.left = ((rightEdge ?? innerRight()) - c.offsetWidth) + 'px'; c.style.top = y + 'px';
  c.style.visibility = ''; c.classList.add('in');
  c.addEventListener('animationend', () => c.classList.remove('in'), { once:true });   // annars låser fill-mode opacity över fade/spent
  return c;
}
async function animFakta(s){
  const color = COLV[s.g];
  glowEls(s.cells.map(cellOf).concat([$('dcell')]));
  await wait(300);
  const num = S.form === 'siffra';
  const html = num ? `<span class="qd">${s.q}</span><span class="sub">·${s.N}=${s.prod}</span>`
                   : `<span>${s.N}</span>&nbsp;·&nbsp;<span class="qd">${s.q}</span>&nbsp;=&nbsp;<span>${s.prod}</span>`;
  const chip = bornChip(html, color, anchorY(), false, num ? 'num' : '');
  chip.dataset.role = 'fakta';
  if (s.ghost){
    await wait(200);
    killGhost();
    /* "för mycket"-brickan står kvar tills kvotsiffran flyger (§8.5): intill —
       pillret får den under sig, sifferbrickan till vänster om sig. */
    const gh = num ? `<span class="qd">${s.q+1}</span><span class="sub">·${s.N}=${(s.q+1)*s.N}</span>` : `${s.N} · ${s.q+1} = ${(s.q+1)*s.N}`;
    ghostEl = num ? bornChip(gh, color, anchorY(), false, 'num ghost', innerRight() - chip.offsetWidth - 6)
                  : bornChip(gh, color, anchorY() + 40, false, 'ghost');
    await wait(300);
  } else await wait(500);
}
async function animSkriv(s){
  const chip = stage.querySelector('.chip[data-role="fakta"]'), q = $('q'+s.g);
  q.classList.remove('active');
  if (!chip){ q.querySelector('span').textContent = s.q; q.classList.add('filled','land'); await wait(400); return; }
  const qd = chip.querySelector('.qd'), sr = rel(qd), tr = rel(q);
  const f = document.createElement('div'); f.className = 'fly'; f.textContent = s.q;
  f.style.cssText = `left:${sr.x}px;top:${sr.y}px;width:${sr.w}px;height:${sr.h}px`;
  stage.append(f); qd.style.visibility = 'hidden';
  await frame();
  fadeGhost();
  f.style.left = tr.x + 'px'; f.style.top = tr.y + 'px'; f.style.width = tr.w + 'px'; f.style.height = tr.h + 'px';
  f.style.fontSize = '1.35rem'; f.style.color = COLV[s.g]; f.style.fontFamily = 'var(--font-body)'; f.style.fontWeight = '900';
  await wait(600);
  q.querySelector('span').textContent = s.q; q.classList.add('filled'); f.remove();
  chip.classList.add('spent'); setTimeout(() => chip.remove(), 220);
}
function fadeGhost(){
  if (!ghostEl) return;
  const g = ghostEl; g.classList.add('fade');
  setTimeout(() => { g.remove(); if (ghostEl === g) ghostEl = null; }, 650);
}
async function animRest(s){
  glowEls(s.cells.map(cellOf).concat([$('q'+s.g)]));
  await wait(300);
  const chip = bornChip(`${s.r}`, '#ef4444', anchorY(), true); chip.dataset.role = 'rest';
  await wait(500);
}
/* Fall B har inget rest-steg: brickan föds ur siffran i flytta-steget (spec §4 B). */
async function bornRest(s){
  glowEls([$('n'+(s.toG+1))]);
  const chip = bornChip(`${s.r}`, '#ef4444', anchorY(), true); chip.dataset.role = 'rest';
  await wait(500);
  return chip;
}
async function animFlytta(s){
  let chip = stage.querySelector('.chip[data-role="rest"]');
  const rem = $('r'+s.toG), slot = $('s'+s.toG);
  slot.classList.remove('show','pulse');
  if (!chip) chip = await bornRest(s);
  const tr = rel(rem);
  await frame();
  chip.classList.add('move'); chip.classList.add('torest');
  chip.style.left = tr.x + 'px'; chip.style.top = tr.y + 'px';
  await wait(600);
  rem.textContent = s.r; rem.classList.add('on'); chip.remove();
  lightSources(['r'+s.toG, s.toG]);            // resten och nästa siffra läses som ett tal
  await wait(300);
}
async function animStryk(gs){
  gs.forEach(g => pen($('n'+g)));
  await wait(400);
}
function pen(cell){
  if (cell.querySelector('.nstrike')) return;
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns,'svg'), p = document.createElementNS(ns,'path');
  svg.setAttribute('viewBox','0 0 36 36'); svg.setAttribute('class','nstrike');
  p.setAttribute('d','M5 31 L31 5'); svg.append(p); cell.append(svg);
  cell.classList.add('struck'); void svg.offsetWidth; svg.classList.add('draw');
}
async function anim(s){
  switch (s.t){
    case 'fraga':       lightSources(s.cells); await wait(300); return;
    case 'fraga_fakta': lightSources(s.cells); await animFakta(s); return;
    case 'fakta':       await animFakta(s); return;
    case 'skriv':       await animSkriv(s); return;
    case 'rest':        await animRest(s); return;
    case 'flytta':      await animFlytta(s); return;
    case 'stryk':       await animStryk(s.gs); return;
    case 'ta_med':      lightSources(s.gs); await wait(300); return;
    case 'inget_kvar': { lightSources(s.cells); const q = $('q'+s.g); q.classList.remove('active'); q.querySelector('span').textContent = '0'; q.classList.add('filled','land'); await wait(500); return; }
    case 'ryms_inte':
      glowEls([$('dcell'), $('n'+s.g)], 'glint');
      if (s.zero){ const q = $('q'+s.g); q.classList.remove('active'); q.querySelector('span').textContent = '0'; q.classList.add('filled','land'); }
      await wait(s.zero ? 500 : 400); return;
  }
}
const LOCK = { fraga:300, fraga_fakta:800, fakta:800, skriv:700, rest:800, flytta:900, stryk:400, ta_med:300, ryms_inte:500, inget_kvar:500 };

/* ═══════════════════════════════════════════════════════════
   DEMO-MOTORN — texten skrivs, sedan rörelsen, knappen synligt låst
═══════════════════════════════════════════════════════════ */
function start(){
  M = buildSteps(TASKS[S.task], S);
  steps = M.steps; idx = 0; clicks = 0; locked = false; errors = 0; awaiting = null;
  renderTasks(); renderPaper(); renderFoot();
  document.querySelectorAll('#moderow .pill').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  $('nextbtn').style.display = S.mode === 'demo' ? '' : 'none';
  $('helpbox').classList.toggle('on', S.mode === 'help');
  if (S.mode === 'demo'){ runDemoStep(); }
  else { helpSteps = buildHelp(steps); hs = -1; nextHelp(); }
  counter();
}
function runDemoStep(){
  const s = steps[idx];
  idx++;                                   // stegas vid START: ett klick mellan låsets slut och rörelsens slut får aldrig köra om steget
  if (s.t === 'fraga_fakta') setBubble(s.fragaText, s.text, 'fakta'); else setBubble(s.text);
  setLock(LOCK[s.t]);
  anim(s).then(() => counter());
}
$('nextbtn').onclick = () => {
  if (locked) return;
  if (idx >= steps.length){ start(); return; }
  clicks++; runDemoStep();
};
document.querySelectorAll('#moderow .pill').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; start(); });

/* ═══════════════════════════════════════════════════════════
   HJÄLP-MOTORN
═══════════════════════════════════════════════════════════ */
async function nextHelp(){
  killLive(); errors = 0;
  hs++;
  if (hs >= helpSteps.length){ awaiting = 'done'; refreshControls(); counter(); return; }
  const s = helpSteps[hs];
  setBubble(s.text, s.input === 'digit' ? `<span class="ans">?</span>` : '');
  awaiting = null; setLock(900);
  if (s.enter) await s.enter();
  if (s.input === 'place'){ const sl = $('s'+s.toG); sl.classList.add('show'); }
  if (s.input === 'strike'){ strikeLeft = [...s.gs]; s.gs.forEach(g => $('n'+g).classList.add('tap')); }
  awaiting = s.input; locked = false; refreshControls();
}
async function onDigit(d, btn){
  if (locked || awaiting !== 'digit') return;
  const s = helpSteps[hs]; clicks++; counter();
  $('b2').innerHTML = `<span class="ans">${d}</span>`;
  if (d === s.answer){
    awaiting = null; setLock(900); killLive();
    await s.correct();
    awaiting = 'next'; locked = false; refreshControls();
    return;
  }
  errors++;
  glowEls([btn, $('thought')], 'shake');
  if (errors >= 2) $('b2').innerHTML = `<span class="ans">${d}</span>&nbsp; ${d > s.answer ? 'För högt.' : 'För lågt.'}`;
  if (errors >= 3) showLive(s);
}
async function onSlotTap(g){
  if (locked || awaiting !== 'place') return;
  const s = helpSteps[hs]; clicks++; counter();
  if (g !== s.toG){ glowEls([$('s'+g)], 'shake'); return; }
  awaiting = null; setLock(900); killLive();
  await s.correct();
  awaiting = 'next'; locked = false; refreshControls();
}
async function onCellTap(g){
  if (locked || awaiting !== 'strike') return;
  const i = strikeLeft.indexOf(g); clicks++; counter();
  if (i < 0){ glowEls([$('n'+g)], 'shake'); return; }
  strikeLeft.splice(i,1); $('n'+g).classList.remove('tap');
  awaiting = null; setLock(400); killLive();
  await animStryk([g]);
  if (strikeLeft.length){ awaiting = 'strike'; locked = false; refreshControls(); }
  else nextHelp();
}
$('hnext').onclick = () => {
  if (locked) return;
  if (awaiting === 'done'){ start(); return; }
  if (awaiting !== 'next') return;
  clicks++; nextHelp();
};
$('livebtn').onclick = () => { if (!locked && hs >= 0) showLive(helpSteps[hs]); };
function showLive(s){
  killLive();
  if (s.input === 'place'){ $('s'+s.toG).classList.add('pulse'); return; }
  if (s.input === 'strike'){ strikeLeft.forEach(g => glowEls([$('n'+g)], 'glint')); return; }
  if (s.input !== 'digit') return;
  const L = s.live, el = document.createElement('div'); el.className = 'live';
  if (L.kind === 'r0'){
    el.innerHTML = `<span class="row mid">0 i ${PV[L.g]}</span>`;
  } else if (L.kind === 'r'){
    el.innerHTML = `<span class="row mid">${L.cur} − ${L.prod} = ${L.r}</span>`;
  } else if (L.q === 0){
    el.innerHTML = `<span class="row mid">${L.N} · 0 = 0</span><span class="row over">${L.N} · 1 = ${L.N}</span><span class="note">${L.N} är större än ${L.cur}.</span>`;
  } else {
    const rows = [];
    if (L.q > 1) rows.push(`<span class="row">${L.N} · ${L.q-1} = ${(L.q-1)*L.N}</span>`);
    rows.push(`<span class="row mid">${L.N} · ${L.q} = ${L.q*L.N}</span>`);
    rows.push(`<span class="row over">${L.N} · ${L.q+1} = ${(L.q+1)*L.N}</span>`);
    rows.push(`<span class="note">${L.r > 0 ? `${L.q*L.N} får plats i ${L.cur}. ${(L.q+1)*L.N} är för mycket.` : `Precis ${L.cur}. ${(L.q+1)*L.N} är för mycket.`}</span>`);
    el.innerHTML = rows.join('');
  }
  el.style.top = (anchorY() + 42) + 'px'; el.style.right = '12px';
  stage.append(el); liveEl = el; if (S.form === 'piller') killGhost();   // kortet tar spökets plats under pillret
}

/* ── Exponerat för verifiering i headless-körning ─────────── */
window.MOCK = { S, start, get steps(){ return steps; }, get helpSteps(){ return helpSteps; }, get idx(){ return idx; }, get hs(){ return hs; }, get awaiting(){ return awaiting; }, get locked(){ return locked; }, buildSteps, buildHelp, helpCost, TASKS };

renderNumpad();
